<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Marine Desktop — Deep Current</title>
  <desc id="desc">Original blue and teal oceanic desktop artwork with layered waves, luminous horizon, glass panels and a subtle navigation grid.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset=".48" stop-color="#0b3a5c"/>
      <stop offset="1" stop-color="#087e91"/>
    </linearGradient>
    <radialGradient id="horizon" cx=".72" cy=".48" r=".52">
      <stop offset="0" stop-color="#a4fff0" stop-opacity=".72"/>
      <stop offset=".28" stop-color="#35d6d0" stop-opacity=".25"/>
      <stop offset="1" stop-color="#35d6d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1ee4d0" stop-opacity=".68"/>
      <stop offset=".55" stop-color="#087caa" stop-opacity=".82"/>
      <stop offset="1" stop-color="#06264d"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2=".2">
      <stop stop-color="#0a668b"/>
      <stop offset=".52" stop-color="#12b7b0"/>
      <stop offset="1" stop-color="#061c3d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8ffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#a5eaff" stop-opacity=".035"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#b8ffff" stroke-opacity=".10" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#c8ffff" fill-opacity=".25"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#horizon)"/>
  <circle cx="1390" cy="390" r="180" fill="#8affeb" opacity=".16" filter="url(#glow)"/>
  <circle cx="1390" cy="390" r="92" fill="#c4fff4" opacity=".16"/>
  <path d="M0 565 C250 495 430 590 660 540 S1080 455 1300 520 S1660 610 1920 500 V1080 H0Z" fill="#0a496b" opacity=".52"/>
  <path d="M0 665 C220 555 390 655 625 625 C890 590 1030 500 1280 585 C1510 665 1700 650 1920 570 V1080 H0Z" fill="url(#wave1)"/>
  <path d="M0 760 C260 650 430 760 670 730 C930 695 1100 610 1320 690 C1540 770 1740 760 1920 690 V1080 H0Z" fill="url(#wave2)"/>
  <path d="M0 865 C300 760 520 850 760 820 C1030 785 1200 735 1440 805 C1640 865 1800 850 1920 810 V1080 H0Z" fill="#052b4d"/>
  <path d="M0 705 C240 595 430 700 650 670 S1080 565 1290 645 S1660 740 1920 640" fill="none" stroke="#b4fff1" stroke-opacity=".52" stroke-width="3"/>
  <path d="M0 795 C270 690 450 790 690 760 S1100 655 1330 735 S1660 825 1920 730" fill="none" stroke="#a7fff5" stroke-opacity=".30" stroke-width="2"/>
  <path d="M0 930 C340 830 520 925 800 885 S1250 825 1480 885 S1740 930 1920 880" fill="none" stroke="#8fffe9" stroke-opacity=".24" stroke-width="2"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity=".48"/>
  <g fill="#d8ffff">
    <circle cx="180" cy="170" r="2" opacity=".8"/><circle cx="340" cy="255" r="1.5" opacity=".65"/>
    <circle cx="560" cy="130" r="2" opacity=".6"/><circle cx="810" cy="215" r="1.5" opacity=".7"/>
    <circle cx="1020" cy="115" r="2" opacity=".6"/><circle cx="1640" cy="180" r="2" opacity=".75"/>
    <circle cx="1780" cy="320" r="1.5" opacity=".65"/><circle cx="1510" cy="95" r="1.5" opacity=".55"/>
  </g>
  <g transform="translate(118 120)">
    <rect width="520" height="250" rx="28" fill="url(#glass)" stroke="#c8fff8" stroke-opacity=".30"/>
    <path d="M0 70H520" stroke="#d7ffff" stroke-opacity=".18"/>
    <circle cx="38" cy="35" r="6" fill="#8fffe9"/><circle cx="62" cy="35" r="6" fill="#79d7ee" opacity=".8"/><circle cx="86" cy="35" r="6" fill="#c4eaff" opacity=".65"/>
    <text x="38" y="126" fill="#e9ffff" font-family="Inter,Segoe UI,sans-serif" font-size="20" letter-spacing="5" opacity=".8">CHIMERA II OS</text>
    <text x="38" y="178" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="48" font-weight="600">MARINE</text>
    <text x="40" y="216" fill="#b7f8f1" font-family="Inter,Segoe UI,sans-serif" font-size="17" letter-spacing="3">DEEP CURRENT • DESKTOP ENVIRONMENT</text>
  </g>
  <g transform="translate(1480 765)">
    <rect width="300" height="150" rx="24" fill="url(#glass)" stroke="#c8fff8" stroke-opacity=".26"/>
    <text x="28" y="48" fill="#eaffff" font-family="Inter,Segoe UI,sans-serif" font-size="15" letter-spacing="3">SYSTEM STATUS</text>
    <path d="M28 75H270" stroke="#cfffff" stroke-opacity=".24"/>
    <text x="28" y="112" fill="#c6fff5" font-family="Inter,Segoe UI,sans-serif" font-size="20">Ready to explore</text>
  </g>
  <path d="M0 1048H1920" stroke="#b8fff6" stroke-opacity=".20" stroke-width="2"/>
</svg>
