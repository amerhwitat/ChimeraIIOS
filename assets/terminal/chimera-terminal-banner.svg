<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">CHIMERA II OS terminal banner</title><desc id="desc">Cosmic aurora glass terminal banner with a dual-shell prompt and terminal families.</desc>
