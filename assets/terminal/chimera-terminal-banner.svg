<rect width="1600" height="520" rx="34" fill="url(#bg)"/><path d="M0 330 Q260 90 520 250 T1040 190 T1600 85 V520 H0Z" fill="url(#aurora)"/><path d="M0 390 Q300 190 570 330 T1120 260 T1600 190" fill="none" stroke="#8cfbe4" stroke-opacity=".35" stroke-width="3"/>
