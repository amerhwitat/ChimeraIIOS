<text x="192" y="112" fill="#efffff" font-family="Inter,Segoe UI,sans-serif" font-size="22" letter-spacing="5">AURORA WAYLAND GLASS DESKTOP</text><text x="188" y="190" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-weight="700" font-size="76">CHIMERA II OS</text><text x="192" y="235" fill="#a9f8ee" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="25">One terminal. Many environments. Explicit compatibility.</text>
<rect x="84" y="290" width="1432" height="152" rx="22" fill="url(#glass)" stroke="#c4fff5" stroke-opacity=".35"/><circle cx="119" cy="325" r="7" fill="#ff7b8c"/><circle cx="144" cy="325" r="7" fill="#ffd166"/><circle cx="169" cy="325" r="7" fill="#61e6b5"/><text x="112" y="370" fill="#9dffe9" font-family="ui-monospace,monospace" font-size="24">chimera@aurora</text><text x="330" y="370" fill="#ffffff" font-family="ui-monospace,monospace" font-size="24">:~$</text><text x="390" y="370" fill="#dceaff" font-family="ui-monospace,monospace" font-size="24">shell --list  |  terminal --catalog</text><text x="112" y="414" fill="#d2e7ff" font-family="ui-monospace,monospace" font-size="18">bash · zsh · fish · nushell · PowerShell · kitty · WezTerm · foot · xterm</text><text x="1510" y="482" text-anchor="end" fill="#d5e8ff" font-family="Inter,Segoe UI,sans-serif" font-size="15" letter-spacing="3">OPEN ECOSYSTEM • PROVIDER STATUS IS VERIFIED SEPARATELY</text></svg>