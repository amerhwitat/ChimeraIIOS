name: Koronos transactional ELF loader tests

on:
  pull_request:
    paths:
      - "kernel/core/process_loader.cpp"
      - "kernel/include/chimera/process_loader.h"
      - "tests/kernel/process_loader_transaction_test.cpp"
      - "kernel/tests/process_loader_test.cpp"
      - "tests/kernel/CMakeLists.txt"
      - ".github/workflows/koronos-elf-loader.yml"
  push:
    branches: [main]
    paths:
      - "kernel/core/process_loader.cpp"
      - "kernel/include/chimera/process_loader.h"
      - "tests/kernel/process_loader_transaction_test.cpp"
      - ".github/workflows/koronos-elf-loader.yml"

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile transactional ELF loader tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -Ikernel/include \
            tests/kernel/process_loader_transaction_test.cpp \
            kernel/core/process_loader.cpp kernel/core/elf64.cpp \
            -o /tmp/koronos-elf-loader-test
      - name: Run mapping and rollback tests
        run: /tmp/koronos-elf-loader-test

      - name: Compile existing process-loader compatibility regression
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -Ikernel/include kernel/tests/process_loader_test.cpp \
            kernel/core/process_loader.cpp kernel/core/elf64.cpp \
            -o /tmp/koronos-elf-loader-existing-test
      - name: Run existing process-loader regression
        run: /tmp/koronos-elf-loader-existing-test
      - name: Validate canonical kernel build script syntax
        run: bash -n kernel/build-koronos.sh
