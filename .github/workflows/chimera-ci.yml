name: Chimera II CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCHIMERA_ENABLE_CVEL=ON -DCHIMERA_BUILD_STARTUP_RUNTIME=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
  build-test-windows:
    # Windows leg (billed at 2x) runs on pull requests and manual dispatch only.
    if: github.event_name != 'push'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCHIMERA_ENABLE_CVEL=ON -DCHIMERA_BUILD_STARTUP_RUNTIME=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  validate-infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate registries
        run: python3 -m json.tool cloud/providers.json >/dev/null && python3 -m json.tool virtualization/cvel/cvel_registry.json >/dev/null && python3 -m json.tool devops/pipeline_schema.json >/dev/null
      - name: Validate Python modules
        run: python3 -m compileall -q cloud tools/image devops desktop/aurora
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input pytest
      - name: Validate capability maturity and evidence
        run: python3 tools/validation/validate_capability_status.py
      - name: Validate Python tests
        run: python3 -m pytest -q tests/cloud tests/image tests/devops tests/build/test_capability_status.py tests/build/test_build_manifest.py tests/build/test_portfolio_build_status.py
      - name: Validate Terraform when installed
        run: |
          if command -v terraform >/dev/null 2>&1; then
            terraform -chdir=infrastructure/openstack fmt -check
            terraform -chdir=infrastructure/openstack init -backend=false
            terraform -chdir=infrastructure/openstack validate
          else
            echo "Terraform not installed; provider-specific IaC validation runs in IaC environments."
          fi
      - name: Validate cloud fabric
        run: python3 tools/cloud/validate_cloud.py
  code-generation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate ISA artifacts
        run: |
          cmake -S . -B build -DCHIMERA_BUILD_STARTUP_RUNTIME=OFF
          cmake --build build --target chimera_generate_isa_bitfields
      - name: Generate infrastructure plan
        run: python3 tools/cloud/chimera_cloud.py plan kubernetes --output build/chimera-kubernetes-plan.json
  integration-contracts:
    name: Registry, SMB, AD/LDAP, optical and FHS contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile all integration Python entry points
        run: |
          find services tools live-image -type f -name '*.py' -print0 |
            xargs -0 -r python -m py_compile
      - name: Registry, SMB, AD/LDAP, optical and FHS integration tests
        run: |
          python -m unittest discover -s tests/integrations -v
          bash tests/services/run-service-tests.sh
      - name: Check Aurora integration JavaScript
        run: |
          node --check desktop/aurora-shell/assets/apps-registry.js
          node --check desktop/aurora-shell/assets/apps-windows-network.js
          node --check desktop/aurora-shell/assets/apps-optical-media.js
          node --check web/system-services.js
      - name: Validate integration manifests and user units
        run: |
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path("system/integrations").glob("*.json"):
              json.loads(path.read_text())
          services = json.loads(pathlib.Path("services/service_registry.json").read_text())
          ids = {item["id"] for item in services["services"]}
          required = {"registry", "smb-server", "smb-discovery", "directory-services", "optical-media"}
          assert required <= ids, required - ids
          for required_path in (
              "services/registry/registry-editor-api.py",
              "services/registry/registry-editor-launcher.py",
              "desktop/aurora/registry-editor.html",
              "userspace/systemd/user/chimera-registry-editor.service",
              "services/network/directory-discovery.py",
              "services/storage/mount-image.py",
          ):
              assert pathlib.Path(required_path).is_file(), required_path
          print("registry/network/storage contracts: OK")
          PY
          make -C userspace check
      - name: Shell syntax
        run: bash -n live-image/build.sh
  package:
    needs: [build-test, validate-infrastructure, code-generation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCHIMERA_ENABLE_CVEL=ON -DCHIMERA_BUILD_STARTUP_RUNTIME=OFF
      - name: Build release
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: chimera-ii-os-build
          path: build/
