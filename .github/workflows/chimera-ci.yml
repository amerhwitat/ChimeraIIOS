name: Chimera II CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        id: configure
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -DCHIMERA_ENABLE_EXPERIMENTAL=ON -DCHIMERA_BUILD_STARTUP_RUNTIME=ON 2>&1 | tee cmake-configure.log
      - name: Upload CMake diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-cmake-diagnostics
          path: |
            cmake-configure.log
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: warn
      - name: Fail on configure error
        if: steps.configure.outcome == 'failure'
        run: exit 1
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Python ISA/database registry tests
        run: python3 -m pytest -q tests/isa/test_isa_registry.py tests/database/test_database_catalog.py
      - name: Validate LLVM importer syntax
        run: python3 -m py_compile isa/tools/import_llvm_targets.py
      - name: Install smoke test
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/chimera-install"
          test -x "$RUNNER_TEMP/chimera-install/bin/chimera_kernel"
          test -x "$RUNNER_TEMP/chimera-install/bin/chimera-enable-startup"
          test -f "$RUNNER_TEMP/chimera-install/lib/systemd/system/chimera-kernel.service"
          test -f "$RUNNER_TEMP/chimera-install/lib/systemd/system/aurora-session@.service"
          test -f "$RUNNER_TEMP/chimera-install/share/wayland-sessions/aurora.desktop"
          test -x "$RUNNER_TEMP/chimera-install/lib/chimera/aurora-session"
