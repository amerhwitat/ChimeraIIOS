name: Desktop Compatibility CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenGL and OpenCV development runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglfw3-dev libopencv-dev xvfb mesa-utils pkg-config vice fs-uae python3-venv gcc-aarch64-linux-gnu qemu-user
      - name: Test ELF, PE/COFF, Mach-O and WASM header inspection
        run: python3 -m unittest discover -s tests/compat -p test_binary_headers.py -v
      - name: Validate semantic Aurora desktop icon integration
        run: |
          node --check desktop/aurora-shell/assets/shell.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("desktop/aurora/icons/manifest.json").read_text(encoding="utf-8"))
          theme = json.loads(Path("desktop/aurora/icons/icon_theme.json").read_text(encoding="utf-8"))
          sprite = Path("desktop/aurora/icons/catalog.svg").read_text(encoding="utf-8")
          shell = Path("desktop/aurora-shell/assets/shell.js").read_text(encoding="utf-8")
          css = Path("desktop/aurora-shell/assets/shell.css").read_text(encoding="utf-8")
          ids = {item["id"] for item in manifest["apps"]}
          required = {"aurora-files", "chromium", "terminal", "settings", "network", "voiceconnect", "system-monitor", "aurora-media-player", "store", "about", "docs"}
          assert required <= ids, f"missing manifest IDs: {sorted(required - ids)}"
          for icon_id in required:
              assert f'id="app-{icon_id}"' in sprite, f"missing SVG symbol app-{icon_id}"
          assert theme["desktops"]["aurora"]["finder"] == "aurora-files"
          assert theme["desktops"]["marine"]["file_explorer"] == "aurora-files"
          assert "appGlyphNode(icon.glyph, ICON_SYMBOLS[icon.id])" in shell
          assert "../aurora/icons/catalog.svg#app-" in shell
          assert ".app-symbol" in css
          x11 = json.loads(Path("desktop/x11/xorg-provider.json").read_text(encoding="utf-8"))
          launcher = Path("desktop/x11/start-session.sh").read_text(encoding="utf-8")
          providers = Path("tools/commands/install-command-providers.sh").read_text(encoding="utf-8")
          assert "xserver-xorg" in x11["packages"] and "xwayland" in x11["packages"]
          assert "freexp" in x11["desktop_sessions"]
          assert "freexp" in launcher
          assert "CHIMERA_X11_RUNTIME_VERIFIED" in launcher
          assert "CHIMERA_X11_FORCE_UNVERIFIED" in launcher
          assert "xserver-xorg" in providers
          desktop_profiles = json.loads(Path("desktop/desktop_profiles.json").read_text(encoding="utf-8"))
          assert any(item["id"] == "freexp" for item in desktop_profiles["profiles"]["chimera"])
          package_profiles = json.loads(Path("desktop/profiles/desktop-profiles.json").read_text(encoding="utf-8"))
          assert any(item["id"] == "freexp" for item in package_profiles["profiles"])
          print("Aurora semantic icons, guarded X.Org provider and FreeXP profile contracts: PASS")
          PY
      - name: Validate X11 provider script and manifest syntax
        run: |
          bash -n desktop/x11/start-session.sh
          bash -n tools/commands/install-command-providers.sh
          python3 -m json.tool desktop/x11/xorg-provider.json >/dev/null
      - name: Build and verify Amiga ADF and Commodore D64 starter disks
        run: |
          python3 -m venv /tmp/chimera-retro-media-venv
          . /tmp/chimera-retro-media-venv/bin/activate
          python -m pip install --disable-pip-version-check amitools
          command -v c1541
          command -v fs-uae
          fs-uae --version
          bash -n tools/retro-media/install-emulators.sh
          python3 -m json.tool tools/retro-media/emulator-packages.json >/dev/null
          python tools/retro-media/build_retro_media.py --output /tmp/chimera-retro-media
          CHIMERA_RETRO_MEDIA_DIR=/tmp/chimera-retro-media python -m unittest discover -s tests/retro_media -v
      - name: Upload Amiga and Commodore disk images
        uses: actions/upload-artifact@v4
        with:
          name: chimera-amiga-commodore-disk-images
          path: /tmp/chimera-retro-media/
          if-no-files-found: error
          retention-days: 30
      - name: Build and runtime-test OpenGL and OpenCV tools
        run: |
          cmake -S . -B /tmp/chimera-graphics-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/chimera-graphics-build --target chm-opengl-smoke chm-image-inspect -j2
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a /tmp/chimera-graphics-build/desktop/native/chm-opengl-smoke --self-test
          /tmp/chimera-graphics-build/desktop/native/chm-image-inspect --self-test
          /tmp/chimera-graphics-build/desktop/native/chm-image-inspect --help
          python3 - <<'PY'
          from pathlib import Path
          Path("/tmp/chimera-test.ppm").write_bytes(b"P6\n2 2\n255\n" + bytes([255,0,0, 0,255,0, 0,0,255, 255,255,255]))
          PY
          /tmp/chimera-graphics-build/desktop/native/chm-image-inspect /tmp/chimera-test.ppm --edges /tmp/chimera-edges.png --grayscale /tmp/chimera-gray.png --resize 4x4 /tmp/chimera-resized.png --json
          test -s /tmp/chimera-edges.png
          test -s /tmp/chimera-gray.png
          test -s /tmp/chimera-resized.png
          bash -n tools/ides/ide-manager.sh
          bash tools/ides/ide-manager.sh list
          bash tools/ides/ide-manager.sh --help
          node --check web/chimera-hub.js
          python3 -m py_compile tools/runtime/chimera-local-bridge.py tools/runtime/chimera-terminal-backend.py tools/retro-media/build_retro_media.py tools/inspect-binary-headers.py
          python3 tests/runtime/test_terminal_backend.py
          python3 tests/tools/test_inspect_binary_headers.py
          python3 tests/tools/test_run_compatible_binary.py
          bash -n tools/binary/install-compat-runtimes.sh
          python3 -m json.tool tools/binary/compatibility-runtimes.json >/dev/null
          bash -n tools/toolchains/bootstrap-open-toolchains.sh
          bash tools/toolchains/bootstrap-open-toolchains.sh list >/dev/null
          python3 -m json.tool tools/toolchains/cross-targets.json >/dev/null
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          cat > /tmp/chimera-aarch64-smoke.c <<'EOF'
          #include <stdio.h>
          int main(void) { puts("CHIMERA AARCH64 QEMU USER PASS"); return 0; }
          EOF
          aarch64-linux-gnu-gcc -static -O2 -o /tmp/chimera-aarch64-smoke /tmp/chimera-aarch64-smoke.c
          python3 tools/run-compatible-binary.py --dry-run /tmp/chimera-aarch64-smoke
          python3 tools/run-compatible-binary.py --run /tmp/chimera-aarch64-smoke
          python3 tools/inspect-binary-headers.py --json /bin/true
          test -s man/chm-opengl-smoke.1
          test -s man/chm-image-inspect.1
          test -s man/chm-ide.1
      - name: Compile C++ desktop header
        run: |
          printf '#include "desktop/cpp/chm_desktop.hpp"\nint main(){auto p=chimera::desktop::profile(chimera::desktop::Platform::WindowsWin32); return p.menu_bar ? 0 : 1;}' | c++ -std=c++17 -I. -x c++ - -o /tmp/chm-desktop
          /tmp/chm-desktop
      - name: Compile C ABI header
        run: |
          printf '#include "desktop/c/desktop_event.h"\nint main(){return CHM_QUIT==23 ? 0 : 1;}' | cc -std=c11 -I. -x c - -o /tmp/chm-desktop-c
          /tmp/chm-desktop-c
      - name: Build Aurora input and locale runtime
        run: |
          chmod +x tools/build-desktop-binaries.sh
          CHIMERA_DESKTOP_BUILD_DIR=/tmp/chimera-desktop-build ./tools/build-desktop-binaries.sh
          test -s /tmp/chimera-desktop-build/aurora_input.o
          test -s /tmp/chimera-desktop-build/aurora_input_router.o
          test -s /tmp/chimera-desktop-build/aurora_locale.o
          test -s /tmp/chimera-desktop-build/aurora_utf.o
          test -s /tmp/chimera-desktop-build/aurora_emoji.o
          test -s /tmp/chimera-desktop-build/chimera_icons.o
          test -x /tmp/chimera-desktop-build/bin/chm-utf8
          test -x /tmp/chimera-desktop-build/bin/aurora-utf-selftest
      - name: Validate Aurora locale and input manifests
        run: |
          python3 -m json.tool desktop/aurora/i18n/input_sources.json >/dev/null
          python3 -m json.tool desktop/aurora/i18n/language_catalog.json >/dev/null
          python3 -m json.tool desktop/aurora/window_manager_policy.json >/dev/null
      - name: Validate capability maturity registry
        run: python3 tools/validation/validate_capability_status.py
      - name: Build native userland shell and system utilities
        run: |
          cmake -S . -B /tmp/chimera-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/chimera-build --target chimera-shell chimera-utils chmctl chm-diagnostics chmhelp chm-utf8 aurora-settings aurora-utf-selftest -j2
          /tmp/chimera-build/userland/aurora-utf-selftest
      - name: Validate man pages
        run: |
          test -s man/chimera-shell.1
          test -s man/chimera-utils.1
          test -s man/chmctl.1
          test -s man/aurora-settings.1
          test -s man/chm-diagnostics.1
          test -s man/chm-utf8.1
          test -s man/aurora-terminal.1
      - name: Python syntax
        run: python -m py_compile desktop/python/chimera_desktop.py desktop/aurora/repository_application_center.py appcenter/cli/chimera-appctl.py tools/validation/validate_capability_status.py
      - name: Java syntax/build
        run: javac java/chimera/desktop/*.java
