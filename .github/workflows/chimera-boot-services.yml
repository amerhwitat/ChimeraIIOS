name: Chimera Boot and Enterprise Services
on:
  push:
    paths:
      - 'boot/**'
      - 'config/services/**'
      - 'installer/services/**'
      - 'kernel/core/service.cpp'
      - 'kernel/include/chimera/service.h'
      - 'kernel/build-koronos.sh'
      - 'tools/tests/**'
      - '.github/workflows/chimera-boot-services.yml'
  pull_request:
    paths:
      - 'boot/**'
      - 'config/services/**'
      - 'installer/services/**'
      - 'kernel/core/service.cpp'
      - 'kernel/include/chimera/service.h'
      - 'kernel/build-koronos.sh'
      - 'tools/tests/**'
      - '.github/workflows/chimera-boot-services.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Validate JSON contracts
        run: |
          python3 -m json.tool config/services/service-registry.json >/dev/null
          python3 -m json.tool config/services/service-profiles.json >/dev/null
          python3 -m json.tool config/services/hardware-requirements.json >/dev/null
          python3 -m json.tool config/services/security-policies.json >/dev/null
          python3 -m json.tool config/services/dependency-graph.json >/dev/null
          python3 -m json.tool boot/chimera-boot-modes.json >/dev/null
          python3 -m json.tool installer/services/service-selection.json >/dev/null
      - name: Run registry tests
        run: python3 tools/tests/test_service_registry.py
      - name: Run boot-mode tests
        run: python3 tools/tests/test_boot_modes.py
      - name: Validate service-plan resolver
        run: python3 tools/chimera_service_plan.py minimal-desktop
      - name: Shell syntax
        run: bash -n kernel/build-koronos.sh
  koronos:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ nasm binutils
      - name: Build Koronos
        run: bash kernel/build-koronos.sh
