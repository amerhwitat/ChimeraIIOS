name: Koronos VMware/QEMU Boot Matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kernel/**"
      - "boot/iso/**"
      - "boot/jasper/**"
      - "boot/spitfire/**"
      - "boot/installation/**"
      - "boot/loader-menu.cfg"
      - "tools/boot/verify-menu-timeouts.py"
      - "tools/build-chimera-iso.sh"
      - "desktop/**"
      - "tools/build-koronos-targets.sh"
      - "tools/build-desktop-binaries.sh"
      - "tools/build-full-iso.sh"
      - ".github/workflows/koronos-boot-matrix.yml"
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "boot/iso/**"
      - "desktop/**"
      - "tools/build-koronos-targets.sh"
      - "tools/build-desktop-binaries.sh"
      - "tools/build-full-iso.sh"
      - ".github/workflows/koronos-boot-matrix.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86_64-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel/ISO test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ nasm binutils grub-common grub-pc-bin grub-efi-amd64-bin mtools xorriso qemu-system-x86 file
      - name: Validate all interactive boot menu timeouts
        run: python3 tools/boot/verify-menu-timeouts.py --root .
      - name: Validate native live, installer and recovery console contracts
        run: python3 tests/kernel/test_native_target_console_contract.py
      - name: Build Koronos
        run: |
          chmod +x kernel/build-koronos.sh tools/build-desktop-binaries.sh tools/build-koronos-targets.sh
          ./kernel/build-koronos.sh
          grub-file --is-x86-multiboot2 build/koronos/x86_64/koronos.elf
          file build/koronos/x86_64/koronos.elf
      - name: Build desktop artifacts
        run: ./tools/build-desktop-binaries.sh
      - name: Build minimal Multiboot2 test ISO
        run: |
          set -euo pipefail
          mkdir -p build/qemu-iso/boot/grub
          install -m 0644 build/koronos/x86_64/koronos.elf build/qemu-iso/boot/koronos.elf
          cat > build/qemu-iso/boot/grub/grub.cfg <<'GRUB'
          # Test-only ISO: boot quickly; production Jasper/Gates/GRUB menus are
          # independently checked for their 300-second interactive timeout.
          set timeout=1
          set default=0
          insmod serial
          serial --unit=0 --speed=115200
          terminal_input serial
          terminal_output serial
          menuentry "Koronos Multiboot2 smoke test" {
            multiboot2 /boot/koronos.elf
            boot
          }
          GRUB
          grub-mkrescue -o build/koronos-qemu-smoke.iso build/qemu-iso
      - name: QEMU serial boot smoke test
        run: |
          set -euo pipefail
          set +e
          timeout 15s qemu-system-x86_64 -machine pc -cpu max -smp 2 -m 1024 \
            -cdrom build/koronos-qemu-smoke.iso -boot d -serial stdio \
            -debugcon file:qemu-debug.log -global isa-debugcon.iobase=0xe9 \
            -display none -no-reboot 2>&1 | tee qemu-koronos.log
          qemu_rc=${PIPESTATUS[0]}
          set -e
          # timeout (124) is expected after the kernel enters its idle loop.
          [[ "$qemu_rc" -eq 0 || "$qemu_rc" -eq 124 ]]
          echo "=== QEMU serial log ==="
          cat qemu-koronos.log
          echo "=== QEMU debugcon log ==="
          cat qemu-debug.log
          grep -Fq "[KRN ] KORONOS READY" qemu-debug.log
          grep -Fq "[RUN ] Entering Koronos scheduler loop" qemu-debug.log
      - name: Boot the real Installer init ELF and verify ring-3 handoff
        run: |
          set -euo pipefail
          mkdir -p build/qemu-installer-iso/boot/grub
          install -m 0644 build/koronos/x86_64/koronos.elf build/qemu-installer-iso/boot/koronos.elf
          install -m 0644 build/koronos/x86_64/target-init-installer.elf build/qemu-installer-iso/boot/target-init-installer.elf
          printf '%s\n' 'installer-image-test' > build/qemu-installer-iso/boot/installation.img
          printf '%s\n' '{"schema":1,"target":"installer","test":true}' > build/qemu-installer-iso/boot/installation-manifest.json
          printf '%s\n' '{"schema":1,"target":"installer","read_only_test":true}' > build/qemu-installer-iso/boot/installer-contract.json
          cat > build/qemu-installer-iso/boot/grub/grub.cfg <<'GRUB'
          set timeout=0
          set default=0
          insmod serial
          serial --unit=0 --speed=115200
          terminal_input serial
          terminal_output serial
          menuentry "Koronos Installer ring-3 handoff test" {
            multiboot2 /boot/koronos.elf
            module2 /boot/installation.img chimera-installation-image
            module2 /boot/installation-manifest.json chimera-installation-manifest
            module2 /boot/installer-contract.json chimera-installer-contract
            module2 /boot/target-init-installer.elf chimera-user-init-elf target=installer
            boot
          }
          GRUB
          grub-mkrescue -o build/koronos-installer-qemu.iso build/qemu-installer-iso
          set +e
          timeout 25s qemu-system-x86_64 -machine pc -cpu max -smp 2 -m 1024 \
            -cdrom build/koronos-installer-qemu.iso -boot d \
            -serial file:qemu-installer-serial.log \
            -debugcon file:qemu-installer-debug.log -global isa-debugcon.iobase=0xe9 \
            -display none -no-reboot 2>&1 | tee qemu-installer-qemu.log
          qemu_rc=${PIPESTATUS[0]}
          set -e
          [[ "$qemu_rc" -eq 0 || "$qemu_rc" -eq 124 ]]
          cat qemu-installer-debug.log
          grep -Fq "[INST] Installer image, manifest and contract verified as present" qemu-installer-debug.log
          grep -Fq "[INST] Dispatching the target-specific installer init ELF" qemu-installer-debug.log
          python3 tests/boot/verify-userspace-handoff.py installer qemu-installer-debug.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koronos-boot-diagnostics
          path: |
            qemu-koronos.log
            qemu-debug.log
            qemu-installer-serial.log
            qemu-installer-debug.log
            qemu-installer-qemu.log
            build/koronos/x86_64/koronos.elf
            build/desktop/
