name: Koronos VMware/QEMU Boot Matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kernel/**"
      - "boot/iso/**"
      - "boot/jasper/**"
      - "boot/spitfire/**"
      - "boot/installation/**"
      - "boot/loader-menu.cfg"
      - "tools/boot/verify-menu-timeouts.py"
      - "tools/boot/verify-native-boot-sequence.py"
      - "tools/build-chimera-iso.sh"
      - "desktop/**"
      - "tools/build-koronos-targets.sh"
      - "tools/build-desktop-binaries.sh"
      - "tools/build-full-iso.sh"
      - ".github/workflows/koronos-boot-matrix.yml"
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "boot/iso/**"
      - "desktop/**"
      - "tools/build-koronos-targets.sh"
      - "tools/build-desktop-binaries.sh"
      - "tools/build-full-iso.sh"
      - ".github/workflows/koronos-boot-matrix.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-port-probes:
    name: AArch64 and RV64 boot-entry probes (not full kernel ports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compilers and emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu binutils \\
            gcc-multilib qemu-system-arm qemu-system-misc make
      - name: Build and boot architecture probes
        run: |
          chmod +x tools/build-koronos-targets.sh
          ./tools/build-koronos-targets.sh --require-all
      - name: Upload architecture probe manifests and serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koronos-architecture-port-probes
          path: build/koronos/ports/
          if-no-files-found: warn

  x86_64-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel/ISO test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ nasm binutils grub-common grub-pc-bin grub-efi-amd64-bin mtools xorriso qemu-system-x86 file
      - name: Validate all interactive boot menu timeouts
        run: python3 tools/boot/verify-menu-timeouts.py --root .
      - name: Validate native boot sequence and release gates
        run: python3 tools/boot/verify-native-boot-sequence.py
      - name: Build Koronos
        run: |
          chmod +x kernel/build-koronos.sh tools/build-desktop-binaries.sh tools/build-koronos-targets.sh
          ./kernel/build-koronos.sh
          grub-file --is-x86-multiboot2 build/koronos/x86_64/koronos.elf
          file build/koronos/x86_64/koronos.elf
      - name: Build desktop artifacts
        run: ./tools/build-desktop-binaries.sh
      - name: Build minimal Multiboot2 test ISO
        run: |
          set -euo pipefail
          mkdir -p build/qemu-iso/boot/grub
          install -m 0644 build/koronos/x86_64/koronos.elf build/qemu-iso/boot/koronos.elf
          cat > build/qemu-iso/boot/grub/grub.cfg <<'GRUB'
          # Keep the interactive boot menu visible before selecting the default.
          set timeout=300
          set default=0
          insmod serial
          serial --unit=0 --speed=115200
          terminal_input serial
          terminal_output serial
          menuentry "Koronos Multiboot2 smoke test" {
            multiboot2 /boot/koronos.elf
            boot
          }
          GRUB
          grub-mkrescue -o build/koronos-qemu-smoke.iso build/qemu-iso
      - name: QEMU serial boot smoke test
        run: |
          set -euo pipefail
          set +e
          timeout 15s qemu-system-x86_64 -machine pc -cpu max -smp 2 -m 1024 \
            -cdrom build/koronos-qemu-smoke.iso -boot d -serial stdio \
            -debugcon file:qemu-debug.log -global isa-debugcon.iobase=0xe9 \
            -display none -no-reboot 2>&1 | tee qemu-koronos.log
          qemu_rc=${PIPESTATUS[0]}
          set -e
          # timeout (124) is expected after the kernel enters its idle loop.
          [[ "$qemu_rc" -eq 0 || "$qemu_rc" -eq 124 ]]
          echo "=== QEMU serial log ==="
          cat qemu-koronos.log
          echo "=== QEMU debugcon log ==="
          cat qemu-debug.log
          grep -Fq "[KRN ] KORONOS READY" qemu-debug.log
          grep -Fq "[RUN ] Entering Koronos scheduler loop" qemu-debug.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koronos-boot-diagnostics
          path: |
            qemu-koronos.log
            qemu-debug.log
            qemu-debug.log
            build/koronos/x86_64/koronos.elf
            build/desktop/
