name: Chimera II OS live ISO and fullscreen desktop validation

on:
  push:
    branches: [main, 'fix/live-image-fullscreen-app-bundle-*', 'fix/live-image-validation-and-koronos-menu-timeouts']
    paths:
      - 'live-image/**'
      - 'tools/aurora/**'
      - 'tools/commands/build-command-isa-coverage.py'
      - 'tools/commands/build-chimera-native-tools.sh'
      - 'tools/commands/chimera-info.py'
      - 'tools/commands/chimera-doctor.py'
      - 'tools/commands/chimera-update.sh'
      - 'tests/commands/test-native-chimera-tools.sh'
      - 'tools/boot/verify-menu-timeouts.py'
      - 'tests/live-image/**'
      - 'tests/desktop/test_aurora_sound_contract.py'
      - 'desktop/aurora-shell/**'
      - 'web/**'
      - 'desktop/**'
      - 'apps/**'
      - 'applications/**'
      - 'appcenter/**'
      - 'iso/manifests/**'
      - '.github/workflows/live-image-build.yml'
  pull_request:
    paths:
      - 'live-image/**'
      - 'tools/aurora/**'
      - 'tools/commands/build-command-isa-coverage.py'
      - 'tools/commands/build-chimera-native-tools.sh'
      - 'tools/commands/chimera-info.py'
      - 'tools/commands/chimera-doctor.py'
      - 'tools/commands/chimera-update.sh'
      - 'tests/commands/test-native-chimera-tools.sh'
      - 'tools/boot/verify-menu-timeouts.py'
      - 'tests/live-image/**'
      - 'tests/desktop/test_aurora_sound_contract.py'
      - 'desktop/aurora-shell/**'
      - 'web/**'
      - 'desktop/**'
      - 'apps/**'
      - 'applications/**'
      - 'appcenter/**'
      - 'iso/manifests/**'
      - '.github/workflows/live-image-build.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release after all ISO and desktop checks pass
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: live-image-chimera-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Chimera II OS live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install current stable Rust toolchain for source-built shells and terminals
        uses: dtolnay/rust-toolchain@stable

      - name: Install host ISO and graphical smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools imagemagick python3 python3-gi gir1.2-gtk-3.0 \
            gcc-i686-linux-gnu gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-riscv64-linux-gnu gcc-powerpc64le-linux-gnu gcc-s390x-linux-gnu binutils qemu-user-static \
            git g++ cargo rustc cmake ninja-build pkg-config python3-venv python3-pip nodejs \
            libgtk-4-dev libadwaita-1-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev libvulkan-dev qt6-base-dev qt6-declarative-dev \
            libdbus-1-dev libssl-dev libasound2-dev libpulse-dev libxrandr-dev \
            libxi-dev libxinerama-dev libxcursor-dev libxext-dev libxrender-dev \
            libxfixes-dev libxdamage-dev libxcomposite-dev \
            gir1.2-webkit2-4.1 openbox x11-utils xdotool xvfb dbus-x11

      - name: Validate desktop source and application catalogs
        run: |
          set -euo pipefail
          python3 -m py_compile live-image/lib/aurora-kiosk.py live-image/lib/patch_html.py tools/aurora/export-icon-theme.py tools/aurora/export-app-icon-theme.py tools/commands/build-command-isa-coverage.py tools/commands/build_linux_abi_command_matrix.py tools/commands/chimera-info.py tools/commands/chimera-doctor.py tools/boot/verify-menu-timeouts.py
          python3 -m py_compile tools/drivers/chimera-driver-panel.py tools/runtime/chimera-service.py
          python3 -m py_compile tools/help/chimera-help
          bash -n tools/aurora/install-terminal-shell-suite.sh tools/aurora/build-terminal-shell-sources.sh aurora/terminals/install-desktop-entries.sh aurora/terminals/aurora-terminal-center.sh aurora/shells/aurora-shell-center.sh aurora/shells/launch-shell.sh live-image/verify-terminal-shell-suite.sh tests/commands/test-native-chimera-tools.sh tests/commands/test-native-command-matrix.sh tests/commands/test-native-chimera-tools.sh
          bash -n tools/commands/install-busybox-applets.sh
          bash -n tools/commands/build-chimera-native-tools.sh
          bash -n tools/display/chimera-gpu-driver-manager tools/drivers/chimera-hardware-drivers tools/display/chimera-display tools/branding/chimera-background
          python3 tests/desktop/test_aurora_sound_contract.py
          python3 tests/desktop/test_terminal_shell_suite_contract.py
          python3 tests/desktop/test_app_icon_export.py
          python3 tests/desktop/test_aurora_app_icon_usage.py
          node --check desktop/aurora-shell/assets/shell.js
          python3 tools/boot/verify-menu-timeouts.py --root .
          python3 tools/aurora/export-icon-theme.py --output "$RUNNER_TEMP/aurora-icon-export"
          python3 - "$RUNNER_TEMP/aurora-icon-export/manifest.json" <<'PY'
          import json, pathlib, sys
          manifest=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert manifest["count"] >= 1
          for icon in manifest["icons"]:
              assert (pathlib.Path(sys.argv[1]).parent / icon["file"]).is_file()
          print("Aurora icon assets exported:", manifest["count"])
          PY
          python3 -m json.tool desktop/optional_apps_catalog.json >/dev/null
          if [[ "chimera" == "chimera" ]]; then
            python3 -m json.tool applications/catalog.json >/dev/null
            python3 -m json.tool appcenter/catalog/apps.json >/dev/null
          else
            python3 -m json.tool apps/desktop-application-catalog.json >/dev/null
            python3 -m json.tool vendor/chimera-ii-os/source/desktop/optional_apps_catalog.json >/dev/null
          fi

      - name: Verify kiosk fullscreen at 1280x720
        run: |
          chmod +x tests/live-image/test-aurora-fullscreen.sh
          xvfb-run -a -s "-screen 0 1280x720x24" \
            bash tests/live-image/test-aurora-fullscreen.sh "file://${GITHUB_WORKSPACE}/web/index.html"

      - name: Verify kiosk fullscreen at 1920x1080
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            bash tests/live-image/test-aurora-fullscreen.sh "file://${GITHUB_WORKSPACE}/web/index.html"

      - name: Build the complete live ISO from this repository revision
        env:
          BUILD_ROOT: ${{ runner.temp }}/aurora-live-build
          OUT_DIR: ${{ runner.temp }}/aurora-live-output
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" bash live-image/build.sh chimera
          # The builder runs as root to configure the chroot; restore runner
          # ownership so the validation and artifact-upload steps can read it.
          sudo chown -R "$(id -u):$(id -g)" "$OUT_DIR"
          test -s "$OUT_DIR/chimera-ii-os-live-amd64.iso"

      - name: Validate ISO checksum, firmware boot entries and embedded application bundle
        env:
          OUT_DIR: ${{ runner.temp }}/aurora-live-output
          ISO_NAME: chimera-ii-os-live-amd64.iso
        run: |
          set -euo pipefail
          iso="$OUT_DIR/$ISO_NAME"
          (cd "$OUT_DIR" && sha256sum --check "$ISO_NAME.sha256")
          xorriso -indev "$iso" -report_el_torito plain -report_system_area plain -print '' | tee "$OUT_DIR/ISO-BOOT-REPORT.txt"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          xorriso -osirrox on -indev "$iso" -extract /live/filesystem.squashfs "$tmp/filesystem.squashfs" >/dev/null
          # SquashFS stores security.capability xattrs for privileged executables.
          # Extract as root so the acceptance check validates the actual image metadata.
          sudo unsquashfs -d "$tmp/root" "$tmp/filesystem.squashfs" >/dev/null
          root="$tmp/root"
          test -x "$root/usr/bin/openbox"
          test -x "$root/usr/bin/xprop"
          test -x "$root/usr/local/bin/aurora-session"
          test -x "$root/usr/local/bin/chimera-verify-opengl"
          test -s "$root/usr/share/chimera/catalogs/command-isa-coverage.json"
          test -s "$root/usr/share/chimera/catalogs/terminal-shell-provider-status.json"
          test -x "$root/usr/local/bin/aurora-terminal-center"
          test -x "$root/usr/local/bin/aurora-shell-center"
          test -s "$root/usr/share/chimera/aurora/terminal-shell-installed.tsv"
          test -s "$root/usr/share/chimera/aurora/shells-installed.tsv"
          python3 - "$root/usr/share/chimera/catalogs/terminal-shell-provider-status.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["summary"]["shells_registered"] == 8, d["summary"]
          assert d["summary"]["terminals_registered"] == 20, d["summary"]
          assert any(x["id"]=="bash" and x["path"] for x in d["shells"]), "Bash executable missing"
          assert any(x["id"]=="xterm" and x["path"] for x in d["terminals"]), "XTerm executable missing"
          print("Shell/terminal provider inventory validated; optional providers remain status-labelled.")
          PY
          python3 - "$root/usr/share/chimera/catalogs/command-isa-coverage.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          assert report["native_chimera_command_count"] == 90
          assert report["native_chimera_provider_count"] == 0, "Linux binaries must not be misreported as Koronos-native providers"
          assert report["hosted_linux_chimera_provider_count"] >= 8
          assert report["linux_abi_multicall_alias_count"] == 15
          assert report["isa_candidate_definition_count"] >= 7000
          print("Verified catalogue coverage accounting and honest Koronos/Linux ABI separation.")
          PY
          test -s "$root/usr/share/chimera/catalogs/chimera-command-list.json"
          test -s "$root/usr/share/chimera/catalogs/linux-command-registry.json"
          test -s "$root/usr/share/chimera/catalogs/ISA.csv"
          test -s "$root/usr/share/chimera/catalogs/online-isa-index.json"
          test -s "$root/usr/share/chimera/catalogs/linux-abi-command-matrix.json"
          python3 - "$root/usr/share/chimera/catalogs/linux-abi-command-matrix.json" <<'PY'
          import json,sys
          matrix=json.load(open(sys.argv[1],encoding="utf-8"))
          targets=matrix.get("targets",[])
          assert len(targets)==8, f"expected eight Linux ABI targets, got {len(targets)}"
          assert all(row.get("runtime_status") in {"native-linux-abi-smoke-tested","qemu-user-linux-abi-smoke-tested"} for row in targets), targets
          assert sum(row.get("runtime_status")=="native-linux-abi-smoke-tested" for row in targets)==1
          assert sum(row.get("runtime_status")=="qemu-user-linux-abi-smoke-tested" for row in targets)==7
          print("All eight Linux ABI command targets passed their native/QEMU-user smoke tests.")
          PY
          test -s "$root/usr/share/chimera/catalogs/terminals-registry.json"
          test -s "$root/usr/share/chimera/catalogs/shells-registry.json"
          test -s "$root/usr/share/chimera/commands/hosted-tools.tsv"
          test -x "$root/usr/bin/chmctl"
          test -x "$root/usr/bin/chimera-help"
          test -x "$root/usr/bin/chimera-shell"
          test -x "$root/usr/bin/chimera-display"
          test -x "$root/usr/bin/chimera-python"
          test -x "$root/usr/bin/chimera-background"
          test -x "$root/usr/bin/chimera-gpu-driver-manager"
          test -x "$root/usr/bin/chimera-hardware-drivers"
          test -x "$root/usr/bin/chimera-driver-panel"
          chroot "$root" /usr/bin/chmctl status
          chroot "$root" /usr/bin/chimera-help verify
          chroot "$root" /usr/bin/chimera-python --version
          chroot "$root" /usr/bin/chimera-background show
          test -s "$root/usr/share/chimera/commands/busybox-applets.tsv"
          python3 - "$root" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          bb=(root/'bin/busybox') if (root/'bin/busybox').exists() else (root/'usr/bin/busybox')
          assert bb.is_file(), 'BusyBox binary missing'
          rows=(root/'usr/share/chimera/commands/busybox-applets.tsv').read_text().splitlines()
          for row in rows:
              name,path,provider=row.split('|')
              link=root/path.lstrip('/')
              assert link.is_symlink() and link.resolve()==bb.resolve(), f'bad BusyBox provider link: {name}'
          assert rows, 'no BusyBox applets were installed'
          print(f'Verified {len(rows)} BusyBox applet symlinks.')
          PY
          for arch in x86_64 i686 armel aarch64 armv7 riscv64 ppc64le s390x; do
            test -s "$root/usr/lib/chimera/commands/linux-abi/$arch/chimera-cmd"
          done
          test -s "$root/usr/share/icons/chimera-aurora/scalable/apps/chimera-settings.svg"
          test -s "$root/usr/share/chimera/aurora/sounds/menu-select.wav"
          test -s "$root/opt/aurora/desktop/app-icons/catalog.svg"
          test -s "$root/opt/aurora/desktop/app-icons/manifest.json"
          test "$(find "$root/opt/aurora/desktop/app-icons/icons" -maxdepth 1 -type f -name 'chimera-*.svg' | wc -l)" -eq 133
          test "$(find "$root/usr/share/icons/hicolor/scalable/apps" -maxdepth 1 -type f -name 'chimera-*.svg' | wc -l)" -eq 133
          test -s "$root/etc/systemd/system/aurora-startup-sound.service"
          test -s "$root/usr/share/chimera/aurora/terminal-shell-installed.tsv"
          test -f "$root/usr/share/chimera/aurora/terminal-shell-source-required.tsv"
          test ! -s "$root/usr/share/chimera/aurora/terminal-shell-source-required.tsv"
          test -x "$root/usr/local/bin/aurora-terminal-center"
          test -x "$root/usr/local/bin/aurora-shell-center"
          test -x "$root/usr/local/bin/chimera-terminal"
          test -x "$root/usr/local/bin/chimera-terminals"
          test -x "$root/usr/local/bin/chimera-shell-ar"
          test -s "$root/usr/share/applications/chimera-terminal-center.desktop"
          test -s "$root/usr/share/applications/chimera-shell-center.desktop"
          while IFS='|' read -r pkg bin; do test -x "$root/usr/bin/$bin" || test -x "$root/bin/$bin" || test -x "$root/usr/local/bin/$bin"; done < "$root/usr/share/chimera/aurora/terminal-shell-installed.tsv"
          python3 - "$root" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          installed={line.split('|')[:2][1] for line in (root/'usr/share/chimera/aurora/terminal-shell-installed.tsv').read_text().splitlines() if '|' in line}
          terms=json.loads(pathlib.Path('aurora/terminals/registry.json').read_text())['entries']
          shells=json.loads(pathlib.Path('aurora/shells/registry.json').read_text())['entries']
          expected={x['binary'] for x in terms+shells}
          missing=sorted(expected-installed)
          assert not missing, f'providers not installed or source-built: {missing}'
          for name in expected:
              assert any((root/d/name).is_file() and (root/d/name).stat().st_mode & 0o111 for d in ('usr/bin','bin','usr/local/bin','usr/sbin','sbin')), f'missing executable {name}'
          for x in terms:
              assert (root/'usr/share/applications'/f"chimera-terminal-{x['id']}.desktop").is_file(), f"missing launcher {x['id']}"
          print(f'Verified {len(terms)} terminal emulators and {len(shells)} shells.')
          PY
          test -s "$root/opt/aurora/application-bundle.json"
          test -d "$root/opt/aurora/app-catalogs"
          test -d "$root/opt/aurora/apps/native/aurora"
          grep -Fq 'Openbox window manager ready' "$root/usr/local/bin/aurora-session"
          python3 - "$root/opt/aurora" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / "application-bundle.json").read_text())
          assert manifest["schema"] == "aurora-offline-application-bundle-v1"
          for relative in manifest["catalog_files"]:
              path = root / "app-catalogs" / relative
              assert path.is_file(), f"missing catalog: {relative}"
              if path.suffix == ".json":
                  json.loads(path.read_text())
          assert (root / "repo").is_dir(), "full source snapshot missing"
          print(f"Embedded {len(manifest['catalog_files'])} offline application catalogs.")
          PY
          cp "$iso" "$OUT_DIR/chimera-ii-os-live-desktop-fixed.iso"
          cp "$iso.sha256" "$OUT_DIR/chimera-ii-os-live-desktop-fixed.iso.sha256"

      - name: Upload verified live ISO candidate
        uses: actions/upload-artifact@v4
        with:
          name: chimera-ii-os-live-desktop-fixed
          path: |
            ${{ runner.temp }}/aurora-live-output/chimera-ii-os-live-amd64.iso
            ${{ runner.temp }}/aurora-live-output/chimera-ii-os-live-amd64.iso.sha256
            ${{ runner.temp }}/aurora-live-output/ISO-BOOT-REPORT.txt
          if-no-files-found: error
          retention-days: 30

  octavian:
    name: Build OctavianOS live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install current stable Rust toolchain for source-built shells and terminals
        uses: dtolnay/rust-toolchain@stable
      - name: Install host ISO and cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools imagemagick python3 python3-gi gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 openbox x11-utils xdotool xvfb dbus-x11 \
            gcc-i686-linux-gnu gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-riscv64-linux-gnu gcc-powerpc64le-linux-gnu gcc-s390x-linux-gnu binutils qemu-user-static \
            git g++ cargo rustc cmake ninja-build pkg-config python3-venv python3-pip nodejs \
            libgtk-4-dev libadwaita-1-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev libvulkan-dev qt6-base-dev qt6-declarative-dev \
            libdbus-1-dev libssl-dev libasound2-dev libpulse-dev libxrandr-dev \
            libxi-dev libxinerama-dev libxcursor-dev libxext-dev libxrender-dev \
            libxfixes-dev libxdamage-dev libxcomposite-dev
      - name: Validate shared Aurora runtime sources
        run: |
          set -euo pipefail
          python3 -m py_compile tools/aurora/export-icon-theme.py tools/aurora/export-app-icon-theme.py tools/commands/build-command-isa-coverage.py tools/commands/build_linux_abi_command_matrix.py tools/commands/chimera-info.py tools/commands/chimera-doctor.py tools/boot/verify-menu-timeouts.py
          python3 -m py_compile tools/aurora/verify-terminal-shell-providers.py
          bash -n tools/aurora/install-terminal-shell-suite.sh tools/aurora/build-terminal-shell-sources.sh aurora/terminals/install-desktop-entries.sh aurora/terminals/aurora-terminal-center.sh aurora/shells/launch-shell.sh live-image/verify-terminal-shell-suite.sh tests/commands/test-native-chimera-tools.sh
          python3 tests/desktop/test_aurora_sound_contract.py
          python3 tools/boot/verify-menu-timeouts.py --root .
      - name: Verify Octavian Aurora desktop fullscreen
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            bash tests/live-image/test-aurora-fullscreen.sh "file://${GITHUB_WORKSPACE}/desktop/aurora-shell/index.html"
      - name: Build OctavianOS live ISO
        env:
          BUILD_ROOT: ${{ runner.temp }}/octavian-live-build
          OUT_DIR: ${{ runner.temp }}/octavian-live-output
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" bash live-image/build.sh octavian
          sudo chown -R "$(id -u):$(id -g)" "$OUT_DIR"
          iso="$OUT_DIR/octavian-os-live-amd64.iso"
          test -s "$iso"
          (cd "$OUT_DIR" && sha256sum --check octavian-os-live-amd64.iso.sha256)
          xorriso -indev "$iso" -report_el_torito plain -report_system_area plain > "$OUT_DIR/ISO-BOOT-REPORT.txt"
      - name: Validate Octavian graphics, commands, icons and Aurora audio payloads
        env:
          OUT_DIR: ${{ runner.temp }}/octavian-live-output
        run: |
          set -euo pipefail
          iso="$OUT_DIR/octavian-os-live-amd64.iso"
          tmp="$(mktemp -d)"
          trap 'sudo rm -rf "$tmp"' EXIT
          xorriso -osirrox on -indev "$iso" -extract /live/filesystem.squashfs "$tmp/filesystem.squashfs" >/dev/null
          sudo unsquashfs -d "$tmp/root" "$tmp/filesystem.squashfs" >/dev/null
          root="$tmp/root"
          test -x "$root/usr/bin/openbox"
          test -x "$root/usr/local/bin/aurora-session"
          test -x "$root/usr/local/bin/chimera-verify-opengl"
          test -s "$root/usr/share/chimera/catalogs/command-isa-coverage.json"
          test -s "$root/usr/share/chimera/catalogs/terminal-shell-provider-status.json"
          test -x "$root/usr/local/bin/aurora-terminal-center"
          test -x "$root/usr/local/bin/aurora-shell-center"
          test -s "$root/usr/share/chimera/aurora/terminal-shell-installed.tsv"
          test -s "$root/usr/share/chimera/aurora/shells-installed.tsv"
          python3 - "$root/usr/share/chimera/catalogs/terminal-shell-provider-status.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["summary"]["shells_registered"] == 8, d["summary"]
          assert d["summary"]["terminals_registered"] == 20, d["summary"]
          assert any(x["id"]=="bash" and x["path"] for x in d["shells"]), "Bash executable missing"
          assert any(x["id"]=="xterm" and x["path"] for x in d["terminals"]), "XTerm executable missing"
          print("Shell/terminal provider inventory validated; optional providers remain status-labelled.")
          PY
          for arch in x86_64 i686 armel aarch64 armv7 riscv64 ppc64le s390x; do
            test -s "$root/usr/lib/chimera/commands/linux-abi/$arch/chimera-cmd"
          done
          test -s "$root/usr/share/icons/chimera-aurora/scalable/apps/chimera-settings.svg"
          test -s "$root/usr/share/chimera/aurora/sounds/menu-select.wav"
          test -s "$root/etc/systemd/system/aurora-startup-sound.service"
          cp "$iso" "$OUT_DIR/octavian-os-live-desktop-fixed.iso"
          cp "$iso.sha256" "$OUT_DIR/octavian-os-live-desktop-fixed.iso.sha256"
      - name: Upload verified OctavianOS live ISO candidate
        uses: actions/upload-artifact@v4
        with:
          name: octavian-os-live-desktop-fixed
          path: |
            ${{ runner.temp }}/octavian-live-output/octavian-os-live-amd64.iso
            ${{ runner.temp }}/octavian-live-output/octavian-os-live-amd64.iso.sha256
            ${{ runner.temp }}/octavian-live-output/ISO-BOOT-REPORT.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified Chimera II OS and OctavianOS hosted live ISOs
    needs: [build, octavian]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chimera-ii-os-live-desktop-fixed
          path: release-assets/chimera
      - uses: actions/download-artifact@v4
        with:
          name: octavian-os-live-desktop-fixed
          path: release-assets/octavian
      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chimera_iso="$(find release-assets/chimera -maxdepth 1 -type f -name 'chimera-ii-os-live-desktop-fixed.iso' -print -quit)"
          chimera_sum="$(find release-assets/chimera -maxdepth 1 -type f -name 'chimera-ii-os-live-desktop-fixed.iso.sha256' -print -quit)"
          octavian_iso="$(find release-assets/octavian -maxdepth 1 -type f -name 'octavian-os-live-desktop-fixed.iso' -print -quit)"
          octavian_sum="$(find release-assets/octavian -maxdepth 1 -type f -name 'octavian-os-live-desktop-fixed.iso.sha256' -print -quit)"
          chimera_report="$(find release-assets/chimera -maxdepth 1 -type f -name 'ISO-BOOT-REPORT.txt' -print -quit)"
          octavian_report="$(find release-assets/octavian -maxdepth 1 -type f -name 'ISO-BOOT-REPORT.txt' -print -quit)"
          test -s "$chimera_iso" && test -s "$chimera_sum" && test -s "$octavian_iso" && test -s "$octavian_sum" && test -s "$chimera_report" && test -s "$octavian_report"
          version="$(date -u +%Y.%m.%d)"
          short="${GITHUB_SHA:0:12}"
          tag="chimera-octavian-live-${version}-desktop-${short}"
          gh release create "$tag" "$chimera_iso" "$chimera_sum" "$chimera_report" "$octavian_iso" "$octavian_sum" "$octavian_report" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Chimera II OS + OctavianOS ${version} — hosted desktop images" \
            --notes "Rebuilt from commit ${GITHUB_SHA}. Both hosted desktop editions are built and validated with Aurora WebGL/OpenGL userspace, command providers, cross-built native command artifacts and desktop assets. These are Debian/Linux-backed hosted live images; they are not Koronos-native production releases. The native Koronos ISO remains gated on its separate kernel, QEMU, live, installer and recovery runtime acceptance."
