name: Chimera Mobile Build

on:
  push:
    paths:
      - 'mobile/**'
      - 'kernel/**'
      - 'arch/**'
      - 'tools/mobile/**'
      - 'tests/mobile/**'
      - 'mobile/build/**'
      - 'mobile/device-profiles/**'
      - 'mobile/flash/**'
      - 'CMakeLists.txt'
      - '.github/workflows/chimera-mobile-build.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'kernel/**'
      - 'arch/**'
      - 'tools/mobile/**'
      - 'CMakeLists.txt'
      - '.github/workflows/chimera-mobile-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-build:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm32, x86_64, x86]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ python3
      - name: Validate mobile profile, flash CLI and image staging safety
        run: |
          set -euo pipefail
          bash -n mobile/build/build-mobile-image.sh tools/mobile/chimera-mobile-flash.sh
          python3 -m py_compile mobile/build/validate-profile.py tools/mobile/chimera-mobile-build.py tools/mobile/chimera-mobile-flash-gui.py tools/mobile/chimera-mobile-fastboot.py
          for profile in mobile/device-profiles/*.json; do python3 mobile/build/validate-profile.py "$profile"; done
          python3 -m unittest discover -s tests/mobile -p 'test_*.py' -v
          bash mobile/build/build-mobile-image.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("mobile/images/dist/mobile-image-manifest.json").read_text())
          assert d["flashable"] is False
          assert d["support_status"] == "reference-only"
          print("Research layout explicitly marked non-flashable.")
          PY
      - name: Configure
        run: |
          cmake -S . -B build/mobile/${{ matrix.arch }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHIMERA_MOBILE=ON \
            -DCHIMERA_TARGET_ARCH=${{ matrix.arch }}
      - name: Build
        run: cmake --build build/mobile/${{ matrix.arch }} --parallel
      - name: Package build manifest
        run: |
          mkdir -p artifacts/${{ matrix.arch }}
          find build/mobile/${{ matrix.arch }} -type f \
            \( -name '*.img' -o -name '*.bin' -o -name '*.dtb' -o -name '*.elf' -o -name '*.zip' \) \
            -exec cp --parents {} artifacts/${{ matrix.arch }}/ \;
          sha256sum $(find artifacts/${{ matrix.arch }} -type f) > artifacts/${{ matrix.arch }}/SHA256SUMS 2>/dev/null || true
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mobile-${{ matrix.arch }}
          path: artifacts/${{ matrix.arch }}
