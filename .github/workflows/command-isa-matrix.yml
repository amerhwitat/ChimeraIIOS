name: Native command cross-build matrix
on:
  push:
    paths:
      - 'src/chimera-command-compat/chimera-cmd.c'
      - 'system/commands/compatibility-binary-policy.json'
      - 'tools/commands/build_native_command_matrix.py'
      - 'tools/commands/build_linux_abi_command_matrix.py'
      - 'tools/commands/generate_runtime_manifest.py'
      - 'tests/commands/test-native-command-matrix.sh'
      - '.github/workflows/command-isa-matrix.yml'
  pull_request:
    paths:
      - 'src/chimera-command-compat/chimera-cmd.c'
      - 'system/commands/compatibility-binary-policy.json'
      - 'tools/commands/build_native_command_matrix.py'
      - 'tools/commands/build_linux_abi_command_matrix.py'
      - '.github/workflows/command-isa-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install cross compilers and ELF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14-i686-linux-gnu gcc-14-arm-linux-gnueabi gcc-14-aarch64-linux-gnu gcc-14-arm-linux-gnueabihf gcc-14-riscv64-linux-gnu gcc-14-powerpc64le-linux-gnu gcc-14-s390x-linux-gnu binutils qemu-user-static
      - name: Build native multicall commands for target ISAs
        run: |
          python3 tools/commands/build_linux_abi_command_matrix.py \
            --source src/chimera-command-compat/chimera-cmd.c \
            --policy system/commands/compatibility-binary-policy.json \
            --output build/native-command-isa \
            --require-all
      - name: Smoke-test command binaries under native Linux and QEMU user emulation
        run: bash tests/commands/test-native-command-matrix.sh build/native-command-isa
      - name: Upload target command binaries and machine-verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: native-command-binaries-eight-linux-abis
          path: build/native-command-isa/
          if-no-files-found: error
          retention-days: 30
