name: Linux ABI command cross-build and QEMU runtime
on:
  push:
    branches: [main, 'fix/live-image-validation-and-koronos-menu-timeouts']
    paths:
      - 'src/chimera-command-compat/chimera-cmd.c'
      - 'system/commands/compatibility-binary-policy.json'
      - 'tools/commands/build_linux_abi_command_matrix.py'
      - 'tests/commands/test-native-command-matrix.sh'
      - '.github/workflows/linux-abi-command-matrix.yml'
  pull_request:
    paths:
      - 'src/chimera-command-compat/chimera-cmd.c'
      - 'system/commands/compatibility-binary-policy.json'
      - 'tools/commands/build_linux_abi_command_matrix.py'
      - 'tests/commands/test-native-command-matrix.sh'
      - '.github/workflows/linux-abi-command-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-build-and-test:
    name: Cross-build and execute Linux ABI candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install eight-target cross compilers and QEMU user emulators
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gcc-i686-linux-gnu gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-riscv64-linux-gnu gcc-powerpc64le-linux-gnu gcc-s390x-linux-gnu \
            binutils qemu-user-static
      - name: Build static Linux ABI command binaries and verify ELF machine fields
        run: |
          python3 tools/commands/build_linux_abi_command_matrix.py \
            --source src/chimera-command-compat/chimera-cmd.c \
            --policy system/commands/compatibility-binary-policy.json \
            --output build/linux-abi-command-matrix \
            --require-all
      - name: Run native and QEMU user-mode command behavior tests
        run: bash tests/commands/test-native-command-matrix.sh build/linux-abi-command-matrix
      - name: Upload Linux ABI binaries, aliases and runtime manifest
        uses: actions/upload-artifact@v4
        with:
          name: linux-abi-command-binaries-eight-targets
          path: build/linux-abi-command-matrix/
          if-no-files-found: error
          retention-days: 30
