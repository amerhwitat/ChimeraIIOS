name: Koronos ELF and scheduler regression

on:
  pull_request:
    paths:
      - 'kernel/core/physmem.cpp'
      - 'kernel/include/chimera/physmem.h'
      - 'kernel/core/koronos.cpp'
      - 'kernel/core/user_mode.cpp'
      - 'kernel/core/interrupt.cpp'
      - 'kernel/arch/x86_64/user_mode.asm'
      - 'kernel/arch/x86_64/interrupts.asm'
      - 'kernel/arch/x86_64/user_init.ld'
      - 'kernel/userland/**'
      - 'kernel/include/chimera/user_mode.h'
      - 'kernel/build-koronos.sh'
      - 'kernel/core/process.cpp'
      - 'kernel/core/elf_loader.cpp'
      - 'kernel/core/nbit.cpp'
      - 'kernel/core/nbit_runtime.cpp'
      - 'kernel/core/nbit_vm.cpp'
      - 'kernel/core/nbit_cache.cpp'
      - 'kernel/core/nbit_fpu.cpp'
      - 'kernel/include/chimera/nbit_cache.h'
      - 'kernel/include/chimera/nbit_fpu.h'
      - 'tests/koronos/test_nbit_cache.cpp'
      - 'tests/koronos/test_nbit_fpu.cpp'
      - 'kernel/include/chimera/nbit_vm.h'
      - 'kernel/include/chimera/nbit_runtime.h'
      - 'tools/nbit/**'
      - 'config/nbit-mode.json'
      - 'tests/nbit/**'
      - 'kernel/core/ipc.cpp'
      - 'kernel/include/chimera/ipc.h'
      - 'kernel/include/chimera/nbit.h'
      - 'kernel/core/scheduler.cpp'
      - 'kernel/include/chimera/process.h'
      - 'kernel/include/chimera/elf_loader.h'
      - 'kernel/include/chimera/elf64.h'
      - 'kernel/include/chimera/scheduler.h'
      - 'tests/koronos/**'
      - 'tests/boot/**'
      - 'isa/isa_database.json'
      - 'tools/isa/chimera_isa_convert.py'
      - 'tests/isa/test_chimera_isa_convert.py'
      - 'boot/iso/**'
      - 'boot/grub/**'
      - 'boot/jasper/**'
      - 'desktop/aurora/apps/**'
      - 'desktop/aurora/aurora-progress.sh'
      - 'desktop/aurora/aurora-init-splash.sh'
      - 'tools/aurora/**'
      - 'build-chimera-iso.sh'
      - '.github/workflows/koronos-elf-smp.yml'
  push:
    branches: [main, koronos/elf-smp-acceptance-gate]
    paths:
      - 'kernel/core/**'
      - 'kernel/arch/x86_64/**'
      - 'kernel/userland/**'
      - 'kernel/include/chimera/user_mode.h'
      - 'kernel/drivers/builtin/**'
      - 'kernel/include/chimera/**'
      - 'kernel/build-koronos.sh'
      - 'isa/isa_database.json'
      - 'tools/nbit/**'
      - 'tests/nbit/**'
      - 'config/nbit-mode.json'
      - 'desktop/aurora/apps/**'
      - 'tools/isa/**'
      - 'tests/koronos/**'
      - 'tests/boot/**'
      - 'boot/iso/**'
      - 'boot/grub/**'
      - 'boot/jasper/**'
      - 'desktop/aurora/aurora-progress.sh'
      - 'desktop/aurora/aurora-init-splash.sh'
      - 'tools/aurora/**'
      - 'build-chimera-iso.sh'
      - '.github/workflows/koronos-elf-smp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and test tools
        run: sudo apt-get update && sudo apt-get install -y g++ python3 python3-pytest qemu-system-x86
      - name: Validate changed boot/build shell scripts
        run: |
          bash -n build-chimera-iso.sh
          bash -n kernel/build-koronos.sh
          bash -n boot/iso/build-iso.sh
          bash -n boot/iso/prepare-layout.sh
          bash -n tools/aurora/build-visual-assets.sh
          bash -n desktop/aurora/aurora-progress.sh
          bash -n desktop/aurora/aurora-init-splash.sh
          bash -n desktop/aurora/aurora-desktop-init.sh
          bash -n tools/stage-chimera-runtime.sh
      - name: Build and test Aurora N-bit settings selection
        run: |
          g++ -std=c++17 -Wall -Wextra desktop/aurora/apps/aurora_settings.cpp -o /tmp/aurora-settings-test
          tmp="$(mktemp -d)"
          HOME="$tmp" /tmp/aurora-settings-test set isa.nbit.width 8193
          HOME="$tmp" /tmp/aurora-settings-test set isa.nbit.backend chimera-virtual
          HOME="$tmp" /tmp/aurora-settings-test set isa.nbit.guest x86-32
          HOME="$tmp" /tmp/aurora-settings-test set isa.nbit.compatibility linux
          HOME="$tmp" /tmp/aurora-settings-test set isa.nbit.backend compatibility
          python3 - "$tmp/.config/chimera/nbit-mode.json" <<'PY'
          import json, sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text())
          assert p["selected_width_bits"] == 8193
          assert p["backend"] == "compatibility"
          assert p["backend_id"] == 3
          assert p["guest_isa"] == "x86-32"
          assert p["guest_isa_id"] == 3
          assert p["compatibility_personality"] == "linux"
          assert p["compatibility_target_mask"] == 4
          PY
          if HOME="$tmp" /tmp/aurora-settings-test set isa.nbit.width 0; then
            echo "invalid N-bit width unexpectedly accepted" >&2
            exit 1
          fi
      - name: Test user-selectable N-bit profiles
        run: python3 tests/nbit/test_select_mode.py
      - name: Run ISA translation-plan regression tests
        run: python3 tests/isa/test_chimera_isa_convert.py
      - name: Validate ISA database JSON and profile coverage
        run: |
          python3 -m json.tool isa/isa_database.json >/dev/null
          python3 tools/isa/chimera_isa_convert.py inventory >/tmp/chimera-isa-inventory.json
      - name: Run ELF admission and scheduler regressions
        run: python3 tests/koronos/test_elf_scheduler_contracts.py
      - name: Run boot artwork continuity and fail-closed handoff tests
        run: python3 -m pytest -q tests/boot/test_aurora_boot_artwork_contract.py tests/boot/test_userspace_handoff_verifier.py
      - name: Run Chimera N-bit virtual machine tests
        run: |
          g++ -std=c++17 -Wall -Wextra -I kernel/include tests/koronos/test_nbit_vm.cpp kernel/core/nbit_vm.cpp kernel/core/nbit_runtime.cpp kernel/core/nbit_cache.cpp -o /tmp/koronos-nbit-vm-test
          /tmp/koronos-nbit-vm-test
      - name: Run arbitrary-width N-bit arithmetic tests
        run: |
          g++ -std=c++17 -Wall -Wextra -I kernel/include tests/koronos/test_nbit_runtime.cpp kernel/core/nbit_runtime.cpp -o /tmp/koronos-nbit-runtime-test
          /tmp/koronos-nbit-runtime-test
          g++ -std=c++17 -Wall -Wextra -I kernel/include tests/koronos/test_nbit_cache.cpp kernel/core/nbit_cache.cpp -o /tmp/koronos-nbit-cache-test
          /tmp/koronos-nbit-cache-test
          g++ -std=c++17 -Wall -Wextra -I kernel/include tests/koronos/test_nbit_fpu.cpp kernel/core/nbit_fpu.cpp -o /tmp/koronos-nbit-fpu-test
          /tmp/koronos-nbit-fpu-test
      - name: Run N-bit process registry and cross-width IPC tests
        run: |
          g++ -std=c++17 -Wall -Wextra -I kernel/include tests/koronos/test_nbit_process_registry.cpp kernel/core/nbit.cpp kernel/core/hardware.cpp -o /tmp/koronos-nbit-process-test
          /tmp/koronos-nbit-process-test
      - name: Run capability IPC service regressions
        run: |
          g++ -std=c++17 -Wall -Wextra -I kernel/include tests/koronos/test_ipc_service.cpp kernel/core/ipc.cpp kernel/core/nbit.cpp kernel/core/hardware.cpp -o /tmp/koronos-ipc-test
          /tmp/koronos-ipc-test
      - name: Run physical-page allocator tests
        run: |
          g++ -std=c++17 -Wall -Wextra -I kernel/include tests/koronos/test_physmem_allocator.cpp kernel/core/physmem.cpp -o /tmp/koronos-physmem-test
          /tmp/koronos-physmem-test
      - name: Run transactional ELF loader tests
        run: |
          g++ -std=c++17 -Wall -Wextra -I kernel/include tests/koronos/test_elf_loader_transaction.cpp kernel/core/process.cpp kernel/core/elf_loader.cpp kernel/core/nbit.cpp kernel/core/hardware.cpp kernel/core/ipc.cpp -o /tmp/koronos-elf-loader-test
          /tmp/koronos-elf-loader-test
      - name: Build freestanding Koronos kernel
        run: |
          sudo apt-get install -y nasm binutils
          CHIMERA_NBIT_EXTRA_WIDTHS="13 8193" bash kernel/build-koronos.sh
          test -f build/koronos/x86_64/nbit/koronos-nbit-13.elf
          test -f build/koronos/x86_64/nbit/koronos-nbit-8193.elf
      - name: Verify required kernel ELF format
        run: |
          readelf -h build/koronos/x86_64/koronos.elf | grep -E 'Class:.*ELF64'
          readelf -h build/koronos/x86_64/koronos.elf | grep -E 'Machine:.*Advanced Micro Devices X86-64'
      - name: QEMU multi-vCPU boot smoke test (not SMP proof)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y grub-pc-bin grub-common xorriso mtools
          iso_root="$(mktemp -d)"
          mkdir -p "$iso_root/boot/grub"
          cp build/koronos/x86_64/koronos.elf "$iso_root/boot/koronos.elf"
          cp build/koronos/x86_64/chimera-user-init.elf "$iso_root/boot/chimera-user-init.elf"
          cat > "$iso_root/boot/grub/grub.cfg" <<'GRUB'
          set timeout=0
          set default=0
          menuentry "Koronos boot smoke" {
            multiboot2 /boot/koronos.elf
            module2 /boot/chimera-user-init.elf chimera-user-init-elf
            boot
          }
          GRUB
          grub-mkrescue -o /tmp/koronos-smp-smoke.iso "$iso_root"
          log=/tmp/koronos-qemu-debugcon.log
          rm -f "$log"
          set +e
          timeout --signal=TERM --kill-after=3s 15s qemu-system-x86_64 \
            -machine q35,accel=tcg -cpu max -m 512M -smp 2 \
            -cdrom /tmp/koronos-smp-smoke.iso -boot d \
            -display none -serial none -monitor none \
            -no-reboot -no-shutdown \
            -debugcon "file:$log" -global isa-debugcon.iobase=0xe9
          qemu_rc=$?
          set -e
          # A successful smoke test intentionally leaves the scheduler running;
          # timeout (124) is expected, while early QEMU/kernel termination is not.
          if [[ "$qemu_rc" -ne 124 && "$qemu_rc" -ne 137 ]]; then
            echo "QEMU exited before the smoke-test timeout (status $qemu_rc)" >&2
            cat "$log" >&2 || true
            exit 1
          fi
          test -s "$log" || { echo "QEMU produced no debugcon output" >&2; exit 1; }
          if grep -Fq '[HANDOFF] ERROR: user-mode transition returned; ELF load/handoff failed' "$log"; then
            echo "Kernel reported that the native init ELF handoff failed." >&2
            cat "$log" >&2
            exit 1
          fi
          for marker in \
            '[KRN ] koronos_boot entered' \
            '[KRN ] KORONOS READY' \
            '[SCH ] Bootstrap tasks submitted' \
            '[RUN ] Entering Koronos scheduler loop' \
            '[UABI] x86-64 user page tables, GDT/TSS and IDT ready' \
            '[USER] Ring-3 Chimera init entered successfully; userspace handoff verified'; do
            grep -Fq "$marker" "$log" || {
              echo "Missing QEMU boot marker: $marker" >&2
              cat "$log" >&2
              exit 1
            }
          done
          echo "GRUB/Multiboot2 boot smoke observed kernel and ring-3 init markers; two virtual CPUs were configured, which does not by itself prove genuine SMP scheduling."
          cat "$log"
      - name: Preserve QEMU boot trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koronos-qemu-debugcon
          path: /tmp/koronos-qemu-debugcon.log
          if-no-files-found: warn
