name: ISA Catalog CI
on:
  push:
    paths:
      - 'isa/**'
      - 'data/isa/**'
      - 'tools/isa/research_catalog.py'
      - 'build-chimera-iso.sh'
      - 'tests/isa/**'
      - 'tests/test_isa_registry.py'
      - 'tools/validate_isa_catalog.py'
      - 'tools/validate_isa_registry.py'
      - 'tools/load_isa_database.py'
      - 'tools/isa_registry_report.py'
      - 'tools/generate_isa_bindings.py'
      - 'tools/binary/**'
      - 'tools/memory/chimera_swap.py'
      - 'tools/memory/test_chimera_swap.py'
      - 'docs/architecture/chimera-native-binary-format.md'
      - 'docs/architecture/chimera-virtual-memory-swap.md'
      - 'compat/binary-format-registry.json'
      - '.github/workflows/isa-catalog-ci.yml'
  pull_request:
    paths:
      - 'isa/**'
      - 'tests/isa/**'
      - 'tests/test_isa_registry.py'
      - 'tools/validate_isa_catalog.py'
      - 'tools/validate_isa_registry.py'
      - 'tools/load_isa_database.py'
      - 'tools/isa_registry_report.py'
      - 'tools/generate_isa_bindings.py'
      - 'tools/binary/**'
      - 'tools/memory/chimera_swap.py'
      - 'tools/memory/test_chimera_swap.py'
      - 'docs/architecture/chimera-native-binary-format.md'
      - 'docs/architecture/chimera-virtual-memory-swap.md'
      - 'docs/architecture/chimera-nbit-native-isa.md'
      - 'compat/binary-format-registry.json'
      - '.github/workflows/isa-catalog-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate recursive ISA research and build-script syntax
        run: |
          bash -n build-chimera-iso.sh
          python -m py_compile tools/isa/research_catalog.py
          python tools/isa/research_catalog.py --offline
          python - <<'PY'
          import json
          from pathlib import Path
          db = json.loads(Path('isa/isa_database.json').read_text(encoding='utf-8'))
          targets = db.get('research_targets', [])
          assert len(targets) == 11, f'expected 11 ISA research targets, got {len(targets)}'
          assert all(t.get('id') and t.get('sources') for t in targets)
          assert all(t.get('executable_support_claimed') is False for t in json.loads(Path('isa/world_architectures.json').read_text(encoding='utf-8')).get('research_targets', []))
          print(f'ISA research metadata valid: {len(targets)} targets')
          PY
      - name: Validate legacy ISA catalog
        run: python tools/validate_isa_catalog.py
      - name: Validate universal ISA database
        run: python tools/validate_isa_registry.py
      - name: Run ISA tests
        run: |
          python -m pip install pytest
          python -m pytest tests/isa/test_catalog.py tests/test_isa_registry.py -q
      - name: Test binary identification and swap reference backends
        run: |
          PYTHONPATH=tools/binary python -m unittest discover -s tools/binary -p 'test_*.py' -v
          python -m unittest discover -s tools/memory -p 'test_chimera_swap.py' -v
      - name: Build SQLite ISA database
        run: python tools/load_isa_database.py --output /tmp/chimera-isa.db
      - name: Report ISA coverage
        run: python tools/isa_registry_report.py
      - name: Check Python adapter
        run: python -m py_compile isa/python/chimera_isa.py
      - name: Check C++ adapter
        run: printf '#include "isa/cpp/chimera_isa.hpp"\nint main() { return 0; }\n' | c++ -std=c++20 -Wall -Wextra -Werror -fsyntax-only -x c++ -
      - name: Check C adapter
        run: cc -std=c11 -Wall -Wextra -Werror -fsyntax-only isa/c/chimera_isa.h
