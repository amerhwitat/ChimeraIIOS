name: Build and Push Multi-Platform Image

on:
  push:
    branches:
      - main

jobs:
  build-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          # Use a Personal Access Token (PAT) stored safely in your GitHub Secrets
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx (Cloud Builder)
        uses: docker/setup-buildx-action@v4
        with:
          driver: cloud
          # Insert your unique endpoint here
          endpoint: "johndoe/my-cloud-builder" 

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Instructs the cloud builder to build for Intel/AMD and Apple Silicon/ARM concurrently
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/my-app:latest
            ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }}
