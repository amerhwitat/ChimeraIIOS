name: Build Chimera II OS Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'Dockerfile.*'
      - 'docker/**'
      - '.dockerignore'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.*'
      - 'docker/**'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: "Completed successful run that produced the immutable production DAPS evidence bundle"
        required: true
        type: string
      evidence_artifact_name:
        description: "Exact artifact name containing evidence.json and the ISO-bound raw traces"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: amerhwitat/chimeraiios
  BUILDER_IMAGE_NAME: amerhwitat/chimeraiios-builder

jobs:
  docker:
    name: Build multi-platform builder and runtime images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compile verifier and validate fail-closed DAPS contract
        run: |
          python3 -m py_compile tools/release/verify-production-daps.py
          python3 tools/tests/test_production_daps_contract.py
      - name: Verify evidence source run completed successfully
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid evidence run ID" >&2; exit 2; }
          result="$(gh run view "$EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status + ":" + .conclusion')"
          [[ "$result" == "completed:success" ]] || {
            echo "Publication blocked: evidence source run is not completed successfully ($result)" >&2
            exit 1
          }
      - name: Download production DAPS evidence
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.evidence_run_id }}
          name: ${{ inputs.evidence_artifact_name }}
          path: build/production-daps
      - name: Verify production DAPS evidence before allowing image publication
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: daps
        run: |
          set -euo pipefail
          python3 tools/release/verify-production-daps.py --evidence build/production-daps/evidence.json
          echo "accepted=true" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          buildkitd-flags: --debug
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract runtime image metadata
        id: runtime-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
            type=ref,event=pr
      - name: Extract builder image metadata
        id: builder-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
            type=ref,event=pr
      - name: Build and publish builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: builder
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' && steps.daps.outputs.accepted == 'true' }}
          tags: ${{ steps.builder-meta.outputs.tags }}
          labels: ${{ steps.builder-meta.outputs.labels }}
          cache-from: type=gha,scope=chimeraiios-builder
          cache-to: type=gha,mode=max,scope=chimeraiios-builder
          provenance: mode=max
          sbom: true
      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.runtime-meta.outputs.tags }}
          labels: ${{ steps.runtime-meta.outputs.labels }}
          cache-from: type=gha,scope=chimeraiios-runtime
          cache-to: type=gha,mode=max,scope=chimeraiios-runtime
          provenance: mode=max
          sbom: true
      - name: Validate built image metadata
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}:latest