name: Chimera II OS Bootstrap ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'boot/iso/**'
      - '.github/workflows/chimera-iso.yml'

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO toolchain
        run: sudo apt-get update && sudo apt-get install -y grub-pc-bin grub-common xorriso gcc gcc-multilib binutils
      - name: Build ISO
        run: chmod +x boot/iso/build-iso.sh && boot/iso/build-iso.sh
      - name: Hash ISO
        run: sha256sum boot/iso/dist/chimera2os-bootstrap.iso > boot/iso/dist/SHA256SUMS
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: chimera2os-bootstrap-iso
          path: boot/iso/dist/*
