name: Chimera II OS Bootstrap ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'boot/iso/**'
      - 'appcenter/**'
      - 'mobile/device-profiles/**'
      - 'toolchains/cpp/**'
      - 'docs/APPLICATION_ECOSYSTEM.md'
      - 'docs/MOBILE_PORTING_MATRIX.md'
      - 'docs/LEGAL_AND_PROVENANCE.md'
      - '.github/workflows/chimera-iso.yml'

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO and C++ toolchain validation tools
        run: sudo apt-get update && sudo apt-get install -y grub-pc-bin grub-common xorriso gcc gcc-multilib binutils python3 clang lldb gdb cmake ninja-build
      - name: Validate application metadata
        run: |
          python3 -m json.tool appcenter/catalog/apps.json >/dev/null
          python3 -m json.tool appcenter/providers/providers.json >/dev/null
          python3 -m json.tool appcenter/schema/chimera-app.schema.json >/dev/null
          python3 -m json.tool toolchains/cpp/registry.json >/dev/null
          python3 -m json.tool toolchains/cpp/ides.json >/dev/null
          python3 -m json.tool toolchains/cpp/debuggers.json >/dev/null
          for p in mobile/device-profiles/*.json; do python3 mobile/build/validate-profile.py "$p"; done
      - name: Validate compiler/debugger host integration
        run: |
          gcc --version | head -n 1
          g++ --version | head -n 1
          clang --version | head -n 1
          lldb --version | head -n 1
          gdb --version | head -n 1
      - name: Build ISO
        run: chmod +x boot/iso/build-iso.sh && boot/iso/build-iso.sh
      - name: ISO content smoke test
        run: |
          test -s boot/iso/dist/chimera2os-bootstrap.iso
          test -f boot/iso/dist/iso/chimera/appcenter/catalog/apps.json
          test -f boot/iso/dist/iso/chimera/mobile/device-profile.schema.json
          test -f boot/iso/dist/iso/chimera/toolchains/cpp/registry.json
          test -f boot/iso/dist/iso/chimera/toolchains/cpp/ides.json
          test -f boot/iso/dist/iso/chimera/toolchains/cpp/debuggers.json
          test -f boot/iso/dist/iso/chimera/docs/APPLICATION_ECOSYSTEM.md
      - name: Hash ISO
        run: sha256sum boot/iso/dist/chimera2os-bootstrap.iso > boot/iso/dist/SHA256SUMS
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: chimera2os-bootstrap-iso
          path: boot/iso/dist/*
