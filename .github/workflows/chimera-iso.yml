name: Chimera II OS Structured ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'boot/**'
      - 'kernel/**'
      - 'src/**'
      - 'include/**'
      - 'desktop/**'
      - 'network/**'
      - 'installer/**'
      - 'appcenter/**'
      - 'mobile/**'
      - 'toolchains/**'
      - 'drivers/**'
      - 'filesystems/**'
      - 'packages/**'
      - 'compat/**'
      - 'repositories/**'
      - 'games/**'
      - 'wallets/**'
      - 'install/**'
      - 'docs/**'
      - 'tests/**'
      - '.github/workflows/chimera-iso.yml'

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO, EFI and validation tools
        run: sudo apt-get update && sudo apt-get install -y grub-pc-bin grub-common grub-efi-amd64-bin xorriso mtools gcc gcc-multilib binutils nasm python3 python3-pytest clang lldb gdb cmake ninja-build qemu-system-x86
      - name: Validate platform registries
        run: |
          python3 -m json.tool repositories/platform-manifest.json >/dev/null
          python3 -m json.tool drivers/driver-registry.json >/dev/null
          python3 -m json.tool filesystems/filesystem-registry.json >/dev/null
          python3 -m json.tool packages/package-manager-registry.json >/dev/null
          python3 -m json.tool compat/binary-format-registry.json >/dev/null
          python3 -m json.tool install/installer-contract.json >/dev/null
          python3 -m json.tool desktop/aurora/gates_menu.json >/dev/null
          python3 -m json.tool appcenter/catalog/apps.json >/dev/null
          python3 -m json.tool appcenter/providers/providers.json >/dev/null
          python3 -m json.tool appcenter/schema/chimera-app.schema.json >/dev/null
          python3 -m json.tool toolchains/cpp/registry.json >/dev/null
          python3 -m json.tool toolchains/cpp/ides.json >/dev/null
          python3 -m json.tool toolchains/cpp/debuggers.json >/dev/null
          for p in mobile/device-profiles/*.json; do python3 mobile/build/validate-profile.py "$p"; done
      - name: Run boot and ISO tests
        run: python3 -m pytest -q tests/boot tests/iso
      - name: Validate Spit Fire MBR sector
        run: nasm -f bin boot/spitfire/sf0_mbr.asm -o /tmp/sf0.bin && test "$(stat -c %s /tmp/sf0.bin)" = 512 && tail -c 2 /tmp/sf0.bin | od -An -tx1 | grep -qi '55 aa'
      - name: Validate host toolchain
        run: |
          gcc --version | head -n 1
          g++ --version | head -n 1
          clang --version | head -n 1
          lldb --version | head -n 1
          gdb --version | head -n 1
      - name: Build structured ISO
        run: chmod +x boot/iso/build-iso.sh boot/iso/prepare-layout.sh && boot/iso/build-iso.sh
      - name: Inspect ISO boot records
        run: xorriso -indev boot/iso/dist/chimera2os-bootstrap.iso -report_el_torito plain -report_system_area plain -print ''
      - name: ISO content smoke test
        run: |
          test -s boot/iso/dist/chimera2os-bootstrap.iso
          test -f boot/iso/dist/iso/boot/spitfire/sf0_mbr.asm
          test -f boot/iso/dist/iso/boot/koronos/koronos.elf
          test -f boot/iso/dist/iso/boot/jasper/grub.cfg
          test -f boot/iso/dist/iso/chimera/manifests/platform-manifest.json
          test -f boot/iso/dist/iso/chimera/manifests/driver-registry.json
          test -f boot/iso/dist/iso/chimera/manifests/filesystem-registry.json
          test -f boot/iso/dist/iso/chimera/manifests/package-manager-registry.json
          test -f boot/iso/dist/iso/chimera/manifests/binary-format-registry.json
          test -f boot/iso/dist/iso/chimera/manifests/installer-contract.json
          test -f boot/iso/dist/iso/chimera/manifests/gates_menu.json
          test -f boot/iso/dist/iso/chimera/toolchains/cpp/registry.json
          test -f boot/iso/dist/iso/checksums/SHA256SUMS
          test -f boot/iso/dist/iso/ISO/iso-layout.json
          test -d boot/iso/dist/iso/src
          test -d boot/iso/dist/iso/opt
      - name: BIOS QEMU smoke test
        timeout-minutes: 2
        run: timeout 45s qemu-system-x86_64 -machine pc -m 256M -cdrom boot/iso/dist/chimera2os-bootstrap.iso -display none -serial stdio -no-reboot || test $? -eq 124
      - name: UEFI QEMU smoke test
        timeout-minutes: 2
        run: |
          OVMF_CODE=$(find /usr/share/OVMF /usr/share/edk2 -type f \( -name 'OVMF_CODE.fd' -o -name 'OVMF_CODE_4M.fd' \) 2>/dev/null | head -n 1)
          if [[ -n "$OVMF_CODE" ]]; then timeout 45s qemu-system-x86_64 -machine q35 -m 256M -bios "$OVMF_CODE" -cdrom boot/iso/dist/chimera2os-bootstrap.iso -display none -serial stdio -no-reboot || test $? -eq 124; else echo 'OVMF firmware not installed; UEFI smoke test skipped.'; fi
      - name: Validate ISO metadata
        run: python3 boot/iso/validate-iso.py --tree boot/iso/dist/iso --json >/tmp/iso-manifest.json
      - name: Hash ISO
        run: sha256sum boot/iso/dist/chimera2os-bootstrap.iso > boot/iso/dist/SHA256SUMS
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: chimera2os-structured-iso
          path: boot/iso/dist/*
          retention-days: 14
