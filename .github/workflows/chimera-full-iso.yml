name: Build Chimera II Full ISO

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kernel/**"
      - "boot/**"
      - "installer/**"
      - "desktop/**"
      - "iso/**"
      - "tools/build-live-boot-binaries.sh"
      - "tools/build-full-iso.sh"
      - "tools/build-full-iso.*"
      - "CMakeLists.txt"
      - "tests/boot/**"
      - ".github/workflows/chimera-full-iso.yml"
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "src/**"
      - "include/**"
      - "database/**"
      - "cmake/**"
      - "boot/**"
      - "installer/**"
      - "desktop/**"
      - "services/**"
      - "userland/**"
      - "iso/**"
      - "tools/build-full-iso.*"
      - "sdk/**"
      - "CMakeLists.txt"
      - ".github/workflows/chimera-full-iso.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHIMERA_FETCH_SOURCES: "0"

jobs:
  build:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ISO and cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm xorriso grub-pc-bin grub-efi-amd64-bin grub-common grub2-common mtools dosfstools qemu-system-x86 gcc g++ clang openjdk-21-jdk python3 python3-pip git curl busybox-static cpio zstd

      - name: Validate boot target routing and embedded artwork contract
        run: python3 tests/boot/test_iso_target_routing_artwork.py

      - name: Test fail-closed userspace handoff evidence verifier
        run: python3 -m unittest discover -s tests/boot -p "test_userspace_handoff_verifier.py" -v

      - name: Build ASM/C/C++ and compose ISO
        env:
          CHIMERA_AURORA_BACKGROUND: ""
        run: |
          chmod +x iso/chimera-live-iso.sh tools/build-full-iso.sh
          ./tools/build-full-iso.sh

      - name: Validate ISO artifacts
        run: |
          test -f build/iso/chimera-ii-os.iso
          test -f build/iso/chimera-ii-os.iso.sha256
          file build/iso/chimera-ii-os.iso
          sha256sum -c build/iso/chimera-ii-os.iso.sha256

      - name: Validate ISO contains target payloads and offline artwork
        run: |
          set -euo pipefail
          iso=build/iso/chimera-ii-os.iso
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          extract() {
            local source="$1" output="$2"
            xorriso -osirrox on -indev "$iso" -extract "$source" "$output" >/dev/null
            test -s "$output" || { echo "::error::ISO payload missing or empty: $source"; exit 1; }
          }
          extract /boot/koronos/koronos.elf "$tmp/koronos.elf"
          extract /boot/live/chimera-live-initramfs.img "$tmp/live-initramfs.img"
          extract /boot/live/live-manifest.json "$tmp/live-manifest.json"
          extract /boot/recovery/chimera-recovery-initramfs.img "$tmp/recovery-initramfs.img"
          extract /boot/recovery/recovery-manifest.json "$tmp/recovery-manifest.json"
          extract /install/installer/installation.img "$tmp/installation.img"
          extract /install/installer/installation-manifest.json "$tmp/installation-manifest.json"
          extract /install/installer/installer-contract.json "$tmp/installer-contract.json"
          extract /boot/grub/grub.cfg "$tmp/grub.cfg"
          extract /boot/grub/aurora-wayland-glass.jpg "$tmp/aurora-wayland-glass.jpg"
          extract /boot/grub/Init.mp4 "$tmp/Init.mp4"
          # Inspect the initramfs actually embedded in the ISO. This is a
          # payload-content check, not a substitute for target-specific QEMU.
          mkdir -p "$tmp/live-root" "$tmp/recovery-root"
          (cd "$tmp/live-root" && gzip -dc "$tmp/live-initramfs.img" | cpio -id --quiet)
          (cd "$tmp/recovery-root" && gzip -dc "$tmp/recovery-initramfs.img" | cpio -id --quiet)
          grep -Fq 'USERSPACE READY: target=live' "$tmp/live-root/init"
          grep -Fq 'USERSPACE READY: target=recovery' "$tmp/recovery-root/init"
          grep -Fq 'exec /bin/sh -i' "$tmp/live-root/init"
          grep -Fq 'exec /bin/chimera-recovery-console.sh' "$tmp/recovery-root/init"
          extract /desktop/aurora/assets/chimera-infinite-research-horizon.svg "$tmp/chimera-wallpaper.svg"
          extract /desktop/aurora/assets/chimera-artwork-manifest.json "$tmp/chimera-artwork-manifest.json"
          python3 - "$tmp" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for name in ("live-manifest.json", "recovery-manifest.json",
                       "installation-manifest.json", "installer-contract.json",
                       "chimera-artwork-manifest.json"):
              json.loads((root / name).read_text())
          if "<svg" not in (root / "chimera-wallpaper.svg").read_text():
              raise SystemExit("embedded Chimera wallpaper is not SVG source")
          artwork = json.loads((root / "chimera-artwork-manifest.json").read_text())
          if not any(item.get("path") == "desktop/aurora/assets/chimera-infinite-research-horizon.svg" for item in artwork.get("artworks", [])):
              raise SystemExit("artwork manifest does not declare the embedded Chimera wallpaper")
          grub = (root / "grub.cfg").read_text()
          for target in ("aurora-live", "install", "recovery"):
              if f"--id {target}" not in grub:
                  raise SystemExit(f"GRUB config missing required target: {target}")
          print("ISO payload check passed: Koronos, Live, Recovery, Installer and offline Aurora artwork are embedded.")
          PY

      - name: QEMU headless Koronos boot smoke test
        run: |
          set +e
          timeout 20s qemu-system-x86_64 \
            -machine pc -m 1024 -smp 1 -accel tcg \
            -display none -serial none -monitor none \
            -no-reboot -no-shutdown -cdrom build/iso/chimera-ii-os.iso \
            -debugcon file:/tmp/chimera-qemu-debugcon.log \
            -global isa-debugcon.iobase=0xe9 >/tmp/chimera-qemu.log 2>&1
          qemu_rc=$?
          set -e
          cat /tmp/chimera-qemu.log
          if [ -f /tmp/chimera-qemu-debugcon.log ]; then
            python3 - <<'PY'
          from pathlib import Path
          data = Path("/tmp/chimera-qemu-debugcon.log").read_bytes().decode("latin1")
          markers = "ELBC"
          cursor = 0
          for marker in markers:
              found = data.find(marker, cursor)
              if found < 0:
                  raise SystemExit(f"QEMU did not reach Koronos marker {marker!r}; debugcon={data!r}")
              cursor = found + 1
          print("QEMU reached x86 entry, long mode, Koronos handoff and post-init markers (ELBC).")
          PY
          else
            echo "QEMU produced no debugcon output (exit $qemu_rc)" >&2
            exit 1
          fi

      - name: Compress ISO for GitHub release asset size limit
        run: |
          set -euo pipefail
          iso=build/iso/chimera-ii-os.iso
          compressed="$iso.zst"
          zstd -T0 -3 --force "$iso" -o "$compressed"
          zstd -t "$compressed"
          size="$(stat -c '%s' "$compressed")"
          echo "Compressed ISO size: $size bytes"
          test "$size" -lt 2147483648 || { echo "::error::Compressed ISO still exceeds GitHub's 2 GiB release asset limit"; exit 1; }
          (
            cd build/iso
            sha256sum chimera-ii-os.iso > chimera-ii-os.iso.sha256
            sha256sum chimera-ii-os.iso.zst > chimera-ii-os.iso.zst.sha256
          )
      - name: Upload ISO artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: chimera-ii-os-live-installer
          path: |
            build/iso/chimera-ii-os.iso
            build/iso/chimera-ii-os.iso.sha256
            chimera-ii-os.iso

      - name: Publish validated ISO candidate to GitHub Releases
        # Fail closed by default: a BIOS entry-marker smoke test is not userspace/release acceptance.
        # Enable this repository variable only after Live, Installer, Recovery, installed-disk and SMP gates pass.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CHIMERA_RELEASE_ACCEPTANCE_APPROVED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="iso-${GITHUB_SHA::12}"
          assets=(
            build/iso/chimera-ii-os.iso.zst
            build/iso/chimera-ii-os.iso.zst.sha256
            build/iso/chimera-ii-os.iso.sha256
          )
          notes="Automated ChimeraIIOS ISO candidate from commit $GITHUB_SHA. CI validated the original ISO checksum and BIOS/QEMU boot markers (ELBC). The ISO is distributed as Zstandard-compressed .iso.zst because the raw ISO exceeds GitHub's 2 GiB per-asset limit. Decompress with: zstd -d chimera-ii-os.iso.zst -o chimera-ii-os.iso; verify the compressed file with its .zst.sha256 and the decompressed ISO with chimera-ii-os.iso.sha256. This is a development prerelease; full userspace/Aurora readiness is not implied."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --draft=false --prerelease \
              --title "Chimera II OS ISO candidate (${GITHUB_SHA::7})" \
              --notes "$notes"
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Chimera II OS ISO candidate (${GITHUB_SHA::7})" \
              --notes "$notes"
          fi
