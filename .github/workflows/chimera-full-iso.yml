name: Build Chimera II Full ISO

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kernel/**"
      - "boot/**"
      - "installer/**"
      - "desktop/**"
      - "iso/**"
      - "tools/build-live-boot-binaries.sh"
      - "tools/build-full-iso.sh"
      - "build-chimera-iso.sh"
      - "tools/wallpapers/**"
      - "tools/build-full-iso.*"
      - "tools/collect-production-closeout-evidence.py"
      - "tools/tests/**"
      - "CMakeLists.txt"
      - "tests/boot/**"
      - ".github/workflows/chimera-full-iso.yml"
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "src/**"
      - "include/**"
      - "database/**"
      - "cmake/**"
      - "boot/**"
      - "installer/**"
      - "desktop/**"
      - "services/**"
      - "userland/**"
      - "iso/**"
      - "tools/build-full-iso.*"
      - "tools/collect-production-closeout-evidence.py"
      - "tools/tests/**"
      - "sdk/**"
      - "CMakeLists.txt"
      - "tests/boot/**"
      - ".github/workflows/chimera-full-iso.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CHIMERA_FETCH_SOURCES: "0"

jobs:
  build:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ISO and cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm xorriso grub-pc-bin grub-efi-amd64-bin grub-common grub2-common mtools dosfstools qemu-system-x86 ovmf gcc g++ clang openjdk-21-jdk python3 python3-pip git curl busybox-static cpio zstd

      - name: Validate boot target routing and embedded artwork contract
        run: python3 tests/boot/test_iso_target_routing_artwork.py
      - name: Validate shell syntax and user-memory/progress/wallpaper contracts
        run: |
          set -euo pipefail
          for script in build-chimera-iso.sh desktop/aurora/aurora-desktop-init.sh desktop/aurora/aurora-init-splash.sh desktop/aurora/aurora-progress.sh system/boot/koronos-progress.sh; do
            bash -n "$script"
          done
          python3 tools/wallpapers/test_embed_wallpapers.py
          python3 tools/tests/test_progress_bridge_contract.py
          python3 tools/tests/test_user_copy_syscall_contract.py
          python3 tools/tests/test_syscall_usercopy_contract.py

      - name: Test production closeout DAPS gate
        run: |
          python3 -m py_compile tools/production-closeout-daps.py tools/collect-production-closeout-evidence.py
          python3 -m unittest discover -s tools/tests -p "test_production_closeout_daps.py" -v
          python3 -m unittest discover -s tools/tests -p "test_collect_production_closeout_evidence.py" -v

      - name: Test fail-closed userspace handoff evidence verifier and release gate
        run: |
          python3 -m unittest discover -s tests/boot -p "test_userspace_handoff_verifier.py" -v
          python3 -m unittest discover -s tests/boot -p "test_chimera_iso_release_gate.py" -v

      - name: Build ASM/C/C++ and compose ISO
        env:
          CHIMERA_AURORA_BACKGROUND: ""
        run: |
          chmod +x iso/chimera-live-iso.sh tools/build-full-iso.sh
          ./tools/build-full-iso.sh

      - name: Validate ISO artifacts
        run: |
          test -f build/iso/chimera-ii-os.iso
          test -f build/iso/chimera-ii-os.iso.sha256
          file build/iso/chimera-ii-os.iso
          sha256sum -c build/iso/chimera-ii-os.iso.sha256

      - name: Validate ISO contains target payloads and offline artwork
        run: |
          set -euo pipefail
          iso=build/iso/chimera-ii-os.iso
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          extract() {
            local source="$1" output="$2"
            xorriso -osirrox on -indev "$iso" -extract "$source" "$output" >/dev/null
            test -s "$output" || { echo "::error::ISO payload missing or empty: $source"; exit 1; }
          }
          extract /boot/koronos/koronos.elf "$tmp/koronos.elf"
          extract /boot/live/chimera-live-initramfs.img "$tmp/live-initramfs.img"
          extract /boot/live/live-manifest.json "$tmp/live-manifest.json"
          extract /boot/live/user-init-live.elf "$tmp/user-init-live.elf"
          extract /boot/recovery/chimera-recovery-initramfs.img "$tmp/recovery-initramfs.img"
          extract /boot/recovery/recovery-manifest.json "$tmp/recovery-manifest.json"
          extract /boot/recovery/user-init-recovery.elf "$tmp/user-init-recovery.elf"
          extract /boot/installer/user-init-installer.elf "$tmp/user-init-installer.elf"
          python3 tools/validate-native-init-elf.py --target live "$tmp/user-init-live.elf"
          python3 tools/validate-native-init-elf.py --target installer "$tmp/user-init-installer.elf"
          python3 tools/validate-native-init-elf.py --target recovery "$tmp/user-init-recovery.elf"
          extract /install/installer/installation.img "$tmp/installation.img"
          extract /install/installer/installation-manifest.json "$tmp/installation-manifest.json"
          extract /install/installer/installer-contract.json "$tmp/installer-contract.json"
          extract /boot/grub/grub.cfg "$tmp/grub.cfg"
          extract /boot/grub/aurora-wayland-glass.jpg "$tmp/aurora-wayland-glass.jpg"
          extract /boot/grub/Init.mp4 "$tmp/Init.mp4"
          # Inspect the initramfs actually embedded in the ISO. This is a
          # payload-content check, not a substitute for target-specific QEMU.
          mkdir -p "$tmp/live-root" "$tmp/recovery-root"
          (cd "$tmp/live-root" && gzip -dc "$tmp/live-initramfs.img" | cpio -id --quiet)
          (cd "$tmp/recovery-root" && gzip -dc "$tmp/recovery-initramfs.img" | cpio -id --quiet)
          grep -Fq 'USERSPACE READY: target=live' "$tmp/live-root/init"
          grep -Fq 'USERSPACE READY: target=recovery' "$tmp/recovery-root/init"
          grep -Fq 'exec /bin/sh -i' "$tmp/live-root/init"
          grep -Fq 'exec /bin/chimera-recovery-console.sh' "$tmp/recovery-root/init"
          extract /desktop/aurora/assets/chimera-infinite-research-horizon.svg "$tmp/chimera-wallpaper.svg"
          extract /desktop/aurora/assets/chimera-artwork-manifest.json "$tmp/chimera-artwork-manifest.json"
          python3 - "$tmp" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for name in ("live-manifest.json", "recovery-manifest.json",
                       "installation-manifest.json", "installer-contract.json",
                       "chimera-artwork-manifest.json"):
              json.loads((root / name).read_text())
          if "<svg" not in (root / "chimera-wallpaper.svg").read_text():
              raise SystemExit("embedded Chimera wallpaper is not SVG source")
          artwork = json.loads((root / "chimera-artwork-manifest.json").read_text())
          if not any(item.get("path") == "desktop/aurora/assets/chimera-infinite-research-horizon.svg" for item in artwork.get("artworks", [])):
              raise SystemExit("artwork manifest does not declare the embedded Chimera wallpaper")
          grub = (root / "grub.cfg").read_text()
          for target in ("aurora-live", "install", "recovery"):
              if f"--id {target}" not in grub:
                  raise SystemExit(f"GRUB config missing required target: {target}")
          for module in (
              "module2 /boot/live/user-init-live.elf chimera-user-init-elf target=live",
              "module2 /boot/installer/user-init-installer.elf chimera-user-init-elf target=installer",
              "module2 /boot/recovery/user-init-recovery.elf chimera-user-init-elf target=recovery",
          ):
              if module not in grub:
                  raise SystemExit(f"GRUB config missing target-specific native init module: {module}")
          print("ISO payload check passed: Koronos, target native init ELFs, Live, Recovery, Installer and offline Aurora artwork are embedded.")
          PY

      - name: QEMU headless Koronos boot smoke test
        run: |
          set +e
          timeout 20s qemu-system-x86_64 \
            -machine pc -m 1024 -smp 1 -accel tcg \
            -display none -serial none -monitor none \
            -no-reboot -no-shutdown -cdrom build/iso/chimera-ii-os.iso \
            -debugcon file:/tmp/chimera-qemu-debugcon.log \
            -global isa-debugcon.iobase=0xe9 >/tmp/chimera-qemu.log 2>&1
          qemu_rc=$?
          set -e
          cat /tmp/chimera-qemu.log
          if [ -f /tmp/chimera-qemu-debugcon.log ]; then
            python3 - <<'PY'
          from pathlib import Path
          data = Path("/tmp/chimera-qemu-debugcon.log").read_bytes().decode("latin1")
          markers = "ELBC"
          cursor = 0
          for marker in markers:
              found = data.find(marker, cursor)
              if found < 0:
                  raise SystemExit(f"QEMU did not reach Koronos marker {marker!r}; debugcon={data!r}")
              cursor = found + 1
          print("QEMU reached x86 entry, long mode, Koronos handoff and post-init markers (ELBC).")
          PY
          else
            echo "QEMU produced no debugcon output (exit $qemu_rc)" >&2
            exit 1
          fi

      - name: Verify actual Live, Installer, and Recovery userspace handoff
        id: userspace_gate
        shell: bash
        run: |
          set -uo pipefail
          iso=build/iso/chimera-ii-os.iso
          base=/tmp/chimera-userspace-traces
          mkdir -p "$base"
          accepted=true
          for target in live installer recovery; do
            tree="$base/$target/tree"
            mkdir -p "$tree/boot/grub" "$tree/boot/koronos" "$tree/boot/live" "$tree/boot/recovery" "$tree/boot/installer" "$tree/install/installer"
            xorriso -osirrox on -indev "$iso" -extract /boot/koronos/koronos.elf "$tree/boot/koronos/koronos.elf" >/dev/null 2>&1 || accepted=false
            if [[ "$target" == "live" ]]; then
              xorriso -osirrox on -indev "$iso" -extract /boot/live/chimera-live-initramfs.img "$tree/boot/live/chimera-live-initramfs.img" >/dev/null 2>&1 || accepted=false
              xorriso -osirrox on -indev "$iso" -extract /boot/live/live-manifest.json "$tree/boot/live/live-manifest.json" >/dev/null 2>&1 || accepted=false
              xorriso -osirrox on -indev "$iso" -extract /boot/live/user-init-live.elf "$tree/boot/live/user-init-live.elf" >/dev/null 2>&1 || accepted=false
            elif [[ "$target" == "recovery" ]]; then
              xorriso -osirrox on -indev "$iso" -extract /boot/recovery/chimera-recovery-initramfs.img "$tree/boot/recovery/chimera-recovery-initramfs.img" >/dev/null 2>&1 || accepted=false
              xorriso -osirrox on -indev "$iso" -extract /boot/recovery/recovery-manifest.json "$tree/boot/recovery/recovery-manifest.json" >/dev/null 2>&1 || accepted=false
              xorriso -osirrox on -indev "$iso" -extract /boot/recovery/user-init-recovery.elf "$tree/boot/recovery/user-init-recovery.elf" >/dev/null 2>&1 || accepted=false
            else
              xorriso -osirrox on -indev "$iso" -extract /boot/installer/user-init-installer.elf "$tree/boot/installer/user-init-installer.elf" >/dev/null 2>&1 || accepted=false
              for f in installation.img installation-manifest.json installer-contract.json installation_phases.json installer_profiles.json; do
                xorriso -osirrox on -indev "$iso" -extract "/install/installer/$f" "$tree/install/installer/$f" >/dev/null 2>&1 || accepted=false
              done
            fi
            cat > "$tree/boot/grub/grub.cfg" <<GRUB
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Chimera target $target handoff acceptance" {
            multiboot2 /boot/koronos/koronos.elf
          GRUB
            if [[ "$target" == "live" ]]; then
              cat >> "$tree/boot/grub/grub.cfg" <<'GRUB'
            module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
            module2 /boot/live/live-manifest.json chimera-live-manifest
            module2 /boot/live/user-init-live.elf chimera-user-init-elf target=live
          GRUB
            elif [[ "$target" == "recovery" ]]; then
              cat >> "$tree/boot/grub/grub.cfg" <<'GRUB'
            module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
            module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
            module2 /boot/recovery/user-init-recovery.elf chimera-user-init-elf target=recovery
          GRUB
            else
              cat >> "$tree/boot/grub/grub.cfg" <<'GRUB'
            module2 /install/installer/installation.img chimera-installation-image
            module2 /install/installer/installation-manifest.json chimera-installation-manifest
            module2 /install/installer/installer-contract.json chimera-installer-contract
            module2 /install/installer/installation_phases.json chimera-install-phases
            module2 /install/installer/installer_profiles.json chimera-installer-profiles
            module2 /boot/installer/user-init-installer.elf chimera-user-init-elf target=installer
          GRUB
            fi
            cat >> "$tree/boot/grub/grub.cfg" <<'GRUB'
            boot
          }
          GRUB
            test_iso="$base/$target.iso"
            trace="$base/$target-debugcon.log"
            if ! grub-mkrescue -o "$test_iso" "$tree" >/dev/null 2>&1; then
              echo "::warning::Could not create $target target smoke ISO"
              accepted=false
              continue
            fi
            set +e
            timeout 12s qemu-system-x86_64 -machine q35 -m 1024 -cdrom "$test_iso" -boot d -display none -serial none -monitor none -no-reboot -no-shutdown -debugcon "file:$trace" -global isa-debugcon.iobase=0xe9 >/dev/null 2>&1
            qemu_rc=$?
            set -e
            if [[ ! -s "$trace" ]]; then
              echo "::warning::$target QEMU emitted no debugcon trace (exit $qemu_rc)"
              accepted=false
              continue
            fi
            if ! grep -Fq '[KRN ] KORONOS READY' "$trace"; then
              echo "::warning::$target target did not reach Koronos readiness"
              accepted=false
              continue
            fi
            if ! python3 tests/boot/verify-userspace-handoff.py "$target" "$trace"; then
              echo "::warning::$target actual ring-3 init handoff is not verified; release remains blocked"
              accepted=false
            fi
          done
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          if [[ "$accepted" == true ]]; then
            echo "All three targets proved ordered kernel-ready -> CPL3 init syscall -> matching nonzero PID readiness."
          else
            echo "Userspace acceptance is NOT VERIFIED for every target. Build artifacts may be reviewed, but no release will be published."
          fi

      - name: Run UEFI target handoff matrix (candidate smoke; not production acceptance)
        shell: bash
        run: |
          set -uo pipefail
          base=/tmp/chimera-userspace-traces
          accepted=true
          code=""
          vars=""
          while IFS= read -r -d '' candidate; do
            candidate_vars="${candidate/CODE/VARS}"
            if [[ -f "$candidate_vars" ]]; then
              code="$candidate"
              vars="$candidate_vars"
              break
            fi
          done < <(find /usr/share -type f \( -iname 'OVMF_CODE*.fd' -o -iname 'OVMF_CODE*.bin' \) -print0 2>/dev/null)

          if [[ -z "$code" || -z "$vars" ]]; then
            echo "::error::UEFI candidate matrix cannot run: matching OVMF code/vars images not found"
            exit 1
          fi
          for target in live installer recovery; do
            test_iso="$base/$target.iso"
            if [[ ! -s "$test_iso" ]]; then
              echo "::error::$target candidate ISO missing; BIOS candidate build did not produce it"
              accepted=false
              continue
            fi
            trace="$base/$target-uefi-debugcon.log"
            vars_copy="$base/$target-uefi-vars.fd"
            cp "$vars" "$vars_copy"
            set +e
            timeout 18s qemu-system-x86_64 -machine q35 -m 1024 -cdrom "$test_iso" -boot d \
              -display none -serial none -monitor none -no-reboot -no-shutdown \
              -drive "if=pflash,format=raw,unit=0,readonly=on,file=$code" \
              -drive "if=pflash,format=raw,unit=1,file=$vars_copy" \
              -debugcon "file:$trace" -global isa-debugcon.iobase=0xe9 >/dev/null 2>&1
            qemu_rc=$?
            set -e
            if [[ ! -s "$trace" ]] || ! grep -Fq '[KRN ] KORONOS READY' "$trace"; then
              echo "::error::$target UEFI candidate did not reach Koronos readiness (qemu exit $qemu_rc)"
              accepted=false
              continue
            fi
            if ! python3 tests/boot/verify-userspace-handoff.py "$target" "$trace"; then
              echo "::error::$target UEFI candidate ring-3 handoff is not verified"
              accepted=false
            fi
          done
          echo "UEFI candidate smoke matrix accepted=$accepted (this is not production acceptance)"
          if [[ "$accepted" != true ]]; then exit 1; fi

      - name: Upload target-specific userspace acceptance traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-target-userspace-traces
          path: /tmp/chimera-userspace-traces/
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect fail-closed production closeout evidence
        if: always() && hashFiles('build/iso/chimera-ii-os.iso') != ''
        run: |
          set -euo pipefail
          mkdir -p /tmp/chimera-userspace-traces
          python3 tools/collect-production-closeout-evidence.py \
            --iso build/iso/chimera-ii-os.iso \
            --output-dir build/iso \
            --candidate-traces /tmp/chimera-userspace-traces
          echo "::notice::Evidence manifest created with NOT RUN production gates. Candidate smoke traces are diagnostic only; DAPS must remain blocked until actual production evidence exists."

      - name: Compress ISO for GitHub release asset size limit
        run: |
          set -euo pipefail
          iso=build/iso/chimera-ii-os.iso
          compressed="$iso.zst"
          zstd -T0 -3 --force "$iso" -o "$compressed"
          zstd -t "$compressed"
          size="$(stat -c '%s' "$compressed")"
          echo "Compressed ISO size: $size bytes"
          test "$size" -lt 2147483648 || { echo "::error::Compressed ISO still exceeds GitHub's 2 GiB release asset limit"; exit 1; }
          (
            cd build/iso
            sha256sum chimera-ii-os.iso > chimera-ii-os.iso.sha256
            sha256sum chimera-ii-os.iso.zst > chimera-ii-os.iso.zst.sha256
          )
      - name: Upload ISO artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-ii-os-live-installer
          path: |
            build/iso/chimera-ii-os.iso.zst
            build/iso/chimera-ii-os.iso.zst.sha256
            build/iso/chimera-ii-os.iso.sha256
            build/iso/production-closeout-evidence.json
            build/iso/closeout-traces/**

      - name: Enforce full production closeout evidence (DAPS)
        # Candidate target smoke is not the six-case production gate. Never publish
        # unless the evidence bundle was generated by the production verifier.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CHIMERA_RELEASE_ACCEPTANCE_APPROVED == 'true'
        run: |
          set -euo pipefail
          evidence=build/iso/production-closeout-evidence.json
          if [[ ! -s "$evidence" ]]; then
            echo "::error::Production closeout evidence is missing; release is blocked."
            exit 1
          fi
          python3 tools/production-closeout-daps.py "$evidence"

      - name: Publish validated ISO candidate to GitHub Releases
        # Fail closed by default: a BIOS entry-marker smoke test is not userspace/release acceptance.
        # Enable this repository variable only after Live, Installer, Recovery, installed-disk and SMP gates pass.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.userspace_gate.outputs.accepted == 'true' && vars.CHIMERA_RELEASE_ACCEPTANCE_APPROVED == 'true' && hashFiles('build/iso/production-closeout-evidence.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="iso-${GITHUB_SHA::12}"
          assets=(
            build/iso/chimera-ii-os.iso.zst
            build/iso/chimera-ii-os.iso.zst.sha256
            build/iso/chimera-ii-os.iso.sha256
          )
          notes="Automated ChimeraIIOS ISO candidate from commit $GITHUB_SHA. The production-closeout DAPS evidence bundle passed the six-case target/firmware and independent runtime gates. The ISO is distributed as Zstandard-compressed .iso.zst because the raw ISO exceeds GitHub's 2 GiB per-asset limit. Decompress with: zstd -d chimera-ii-os.iso.zst -o chimera-ii-os.iso; verify the compressed file with its .zst.sha256 and the decompressed ISO with chimera-ii-os.iso.sha256. This is a development prerelease; full userspace/Aurora readiness is not implied."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --draft=false --prerelease \
              --title "Chimera II OS ISO candidate (${GITHUB_SHA::7})" \
              --notes "$notes"
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Chimera II OS ISO candidate (${GITHUB_SHA::7})" \
              --notes "$notes"
          fi
