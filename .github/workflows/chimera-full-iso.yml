name: Build Chimera II Full ISO

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kernel/**"
      - "boot/**"
      - "installer/**"
      - "desktop/**"
      - "iso/**"
      - "tools/build-live-boot-binaries.sh"
      - "tools/build-full-iso.sh"
      - "tools/build-full-iso.*"
      - "CMakeLists.txt"
      - "tests/boot/**"
      - ".github/workflows/chimera-full-iso.yml"
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "src/**"
      - "include/**"
      - "database/**"
      - "cmake/**"
      - "boot/**"
      - "installer/**"
      - "desktop/**"
      - "services/**"
      - "userland/**"
      - "iso/**"
      - "tools/build-full-iso.*"
      - "sdk/**"
      - "CMakeLists.txt"
      - "tests/boot/**"
      - ".github/workflows/chimera-full-iso.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CHIMERA_FETCH_SOURCES: "0"

jobs:
  build:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ISO and cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm xorriso grub-pc-bin grub-efi-amd64-bin grub-common grub2-common mtools dosfstools qemu-system-x86 gcc g++ clang openjdk-21-jdk python3 python3-pip git curl busybox-static cpio zstd

      - name: Validate boot target routing and embedded artwork contract
        run: python3 tests/boot/test_iso_target_routing_artwork.py

      - name: Test fail-closed userspace handoff evidence verifier and release gate
        run: |
          python3 -m unittest discover -s tests/boot -p "test_userspace_handoff_verifier.py" -v
          python3 -m unittest discover -s tests/boot -p "test_chimera_iso_release_gate.py" -v

      - name: Build ASM/C/C++ and compose ISO
        env:
          CHIMERA_AURORA_BACKGROUND: ""
        run: |
          chmod +x iso/chimera-live-iso.sh tools/build-full-iso.sh
          ./tools/build-full-iso.sh

      - name: Validate ISO artifacts
        run: |
          test -f build/iso/chimera-ii-os.iso
          test -f build/iso/chimera-ii-os.iso.sha256
          file build/iso/chimera-ii-os.iso
          sha256sum -c build/iso/chimera-ii-os.iso.sha256

      - name: Validate ISO contains target payloads and offline artwork
        run: |
          set -euo pipefail
          iso=build/iso/chimera-ii-os.iso
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          extract() {
            local source="$1" output="$2"
            xorriso -osirrox on -indev "$iso" -extract "$source" "$output" >/dev/null
            test -s "$output" || { echo "::error::ISO payload missing or empty: $source"; exit 1; }
          }
          extract /boot/koronos/koronos.elf "$tmp/koronos.elf"
          extract /boot/live/chimera-live-initramfs.img "$tmp/live-initramfs.img"
          extract /boot/live/live-manifest.json "$tmp/live-manifest.json"
          extract /boot/candidates/recovery/chimera-recovery-initramfs.img "$tmp/recovery-prototype.img"
          extract /boot/candidates/recovery/recovery-manifest.json "$tmp/recovery-prototype-manifest.json"
          extract /boot/candidates/installer/installation.img "$tmp/installer-prototype.img"
          extract /boot/candidates/installer/installer-initrd.img "$tmp/installer-prototype-initrd.img"
          extract /boot/candidates/installer/installation-manifest.json "$tmp/installation-manifest.json"
          extract /boot/candidates/installer/installer-contract.json "$tmp/installer-contract.json"
          extract /boot/candidates/native-runtime-candidates.json "$tmp/native-runtime-candidates.json"
          extract /boot/grub/grub.cfg "$tmp/grub.cfg"
          extract /boot/spitfire/spitfire-menu.cfg "$tmp/spitfire-menu.cfg"
          extract /boot/spitfire/spitfire-sf0-mbr.bin "$tmp/spitfire-sf0-mbr.bin"
          extract /boot/spitfire/spitfire-stage2.bin "$tmp/spitfire-stage2.bin"
          extract /boot/gates/gates-menu.cfg "$tmp/gates-menu.cfg"
          extract /boot/jasper/live-image.cfg "$tmp/jasper-live-image.cfg"
          extract /boot/jasper/install.cfg "$tmp/install.cfg"
          extract /boot/jasper/recovery.cfg "$tmp/recovery.cfg"
          extract /boot/grub/aurora-wayland-glass.jpg "$tmp/aurora-wayland-glass.jpg"
          extract /boot/grub/Init.mp4 "$tmp/Init.mp4"
          test "$(stat -c%s "$tmp/spitfire-sf0-mbr.bin")" -eq 512
          mkdir -p "$tmp/live-root" "$tmp/recovery-root" "$tmp/installer-root"
          (cd "$tmp/live-root" && gzip -dc "$tmp/live-initramfs.img" | cpio -id --quiet)
          (cd "$tmp/recovery-root" && gzip -dc "$tmp/recovery-prototype.img" | cpio -id --quiet)
          (cd "$tmp/installer-root" && gzip -dc "$tmp/installer-prototype-initrd.img" | cpio -id --quiet)
          grep -Fq 'USERSPACE READY: target=live' "$tmp/live-root/init"
          grep -Fq 'exec /bin/sh -i' "$tmp/live-root/init"
          grep -Fq 'USERSPACE READY: target=recovery' "$tmp/recovery-root/init"
          grep -Fq 'exec /bin/chimera-recovery-console.sh' "$tmp/recovery-root/init"
          grep -Fq 'USERSPACE READY: target=installer' "$tmp/installer-root/init"
          extract /desktop/aurora/assets/chimera-infinite-research-horizon.svg "$tmp/chimera-wallpaper.svg"
          extract /desktop/aurora/assets/chimera-artwork-manifest.json "$tmp/chimera-artwork-manifest.json"
          python3 - "$tmp" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for name in ("live-manifest.json", "recovery-prototype-manifest.json",
                       "installation-manifest.json", "installer-contract.json",
                       "native-runtime-candidates.json", "chimera-artwork-manifest.json"):
              json.loads((root / name).read_text())
          candidates=json.loads((root / "native-runtime-candidates.json").read_text())
          assert candidates["status"] == "prototype-built-not-native-koronos-runtime"
          assert candidates["installer"]["bootable_by_koronos"] is False
          assert candidates["recovery"]["bootable_by_koronos"] is False
          if "<svg" not in (root / "chimera-wallpaper.svg").read_text():
              raise SystemExit("embedded Chimera wallpaper is not SVG source")
          artwork = json.loads((root / "chimera-artwork-manifest.json").read_text())
          if not any(item.get("path") == "desktop/aurora/assets/chimera-infinite-research-horizon.svg" for item in artwork.get("artworks", [])):
              raise SystemExit("artwork manifest does not declare the embedded Chimera wallpaper")
          grub=(root / "grub.cfg").read_text()
          spit=(root / "spitfire-menu.cfg").read_text()
          gates=(root / "gates-menu.cfg").read_text()
          jasper=(root / "jasper-live-image.cfg").read_text()
          installer=(root / "install.cfg").read_text()
          recovery=(root / "recovery.cfg").read_text()
          assert "configfile /boot/spitfire/spitfire-menu.cfg" in grub
          assert "configfile /boot/gates/gates-menu.cfg" in spit
          assert "configfile /boot/jasper/live-image.cfg" in gates
          assert "Live — Aurora Desktop" in jasper
          assert "Linux Rescue Shell" in jasper
          assert "native-installer-runtime.ready" in installer
          assert "native-recovery-runtime.ready" in recovery
          assert "Native Koronos Installer" in installer
          assert "Native Koronos Recovery" in recovery
          print("ISO payload check passed: GRUB2 -> Spit Fire -> Jasper, Spit Fire BIOS artifacts, and fail-closed runtime prototypes are embedded.")
          PY

      - name: QEMU headless Koronos boot smoke test
        run: |
          set +e
          timeout 45s qemu-system-x86_64 \
            -machine pc -m 1024 -smp 1 -accel tcg \
            -display none -serial none -monitor none \
            -no-reboot -no-shutdown -cdrom build/iso/chimera-ii-os.iso \
            -debugcon file:/tmp/chimera-qemu-debugcon.log \
            -global isa-debugcon.iobase=0xe9 >/tmp/chimera-qemu.log 2>&1
          qemu_rc=$?
          set -e
          cat /tmp/chimera-qemu.log
          if [ -f /tmp/chimera-qemu-debugcon.log ]; then
            python3 - <<'PY'
          from pathlib import Path
          data = Path("/tmp/chimera-qemu-debugcon.log").read_bytes().decode("latin1")
          markers = "ELBC"
          cursor = 0
          for marker in markers:
              found = data.find(marker, cursor)
              if found < 0:
                  raise SystemExit(f"QEMU did not reach Koronos marker {marker!r}; debugcon={data!r}")
              cursor = found + 1
          print("QEMU reached x86 entry, long mode, Koronos handoff and post-init markers (ELBC).")
          PY
          else
            echo "QEMU produced no debugcon output (exit $qemu_rc)" >&2
            exit 1
          fi

      - name: Verify native Live userspace and fail-closed Installer/Recovery gates
        id: userspace_gate
        shell: bash
        run: |
          set -uo pipefail
          iso=build/iso/chimera-ii-os.iso
          base=/tmp/chimera-userspace-traces
          mkdir -p "$base"
          accepted=true
          tree="$base/live/tree"
          mkdir -p "$tree/boot/grub" "$tree/boot/koronos" "$tree/boot/live"
          xorriso -osirrox on -indev "$iso" -extract /boot/koronos/koronos.elf "$tree/boot/koronos/koronos.elf" >/dev/null 2>&1 || accepted=false
          xorriso -osirrox on -indev "$iso" -extract /boot/live/chimera-live-initramfs.img "$tree/boot/live/chimera-live-initramfs.img" >/dev/null 2>&1 || accepted=false
          xorriso -osirrox on -indev "$iso" -extract /boot/live/live-manifest.json "$tree/boot/live/live-manifest.json" >/dev/null 2>&1 || accepted=false
          cat > "$tree/boot/grub/grub.cfg" <<'GRUB'
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Koronos native Live userspace acceptance" {
            multiboot2 /boot/koronos/koronos.elf chm.mode=live chm.log=verbose chm.progress=events
            module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
            module2 /boot/live/live-manifest.json chimera-live-manifest
            boot
          }
          GRUB
          test_iso="$base/live.iso"
          trace="$base/live-debugcon.log"
          if ! grub-mkrescue -o "$test_iso" "$tree" >/dev/null 2>&1; then
            echo "::warning::Could not create native Live target smoke ISO"
            accepted=false
          else
            set +e
            timeout 20s qemu-system-x86_64 -machine q35 -m 1024 -cdrom "$test_iso" -boot d -display none -serial none -monitor none -no-reboot -no-shutdown -debugcon "file:$trace" -global isa-debugcon.iobase=0xe9 >/dev/null 2>&1
            qemu_rc=$?
            set -e
            if [[ ! -s "$trace" ]]; then
              echo "::warning::Native Live QEMU emitted no debugcon trace (exit $qemu_rc)"
              accepted=false
            elif ! grep -Fq '[KRN ] KORONOS READY' "$trace"; then
              echo "::warning::Native Live target did not reach Koronos kernel readiness"
              accepted=false
            elif ! python3 tests/boot/verify-userspace-handoff.py live "$trace"; then
              echo "::warning::Native Live CPL3 init syscall/PID readiness is not verified"
              accepted=false
            fi
          fi

          # Installer and Recovery prototypes are BusyBox/Linux images. They are
          # intentionally not passed to the Koronos kernel and do not count as
          # native targets. Verify the menus require explicit, absent readiness markers.
          xorriso -osirrox on -indev "$iso" -extract /boot/candidates/native-runtime-candidates.json "$base/native-runtime-candidates.json" >/dev/null 2>&1 || accepted=false
          xorriso -osirrox on -indev "$iso" -extract /boot/jasper/install.cfg "$base/install.cfg" >/dev/null 2>&1 || accepted=false
          xorriso -osirrox on -indev "$iso" -extract /boot/jasper/recovery.cfg "$base/recovery.cfg" >/dev/null 2>&1 || accepted=false
          python3 - "$base" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          m=json.loads((root/"native-runtime-candidates.json").read_text())
          assert m["status"] == "prototype-built-not-native-koronos-runtime"
          assert m["installer"]["bootable_by_koronos"] is False
          assert m["recovery"]["bootable_by_koronos"] is False
          assert "native-installer-runtime.ready" in (root/"install.cfg").read_text()
          assert "native-recovery-runtime.ready" in (root/"recovery.cfg").read_text()
          assert not any(x["path"].endswith(".ready") for x in m["installer"]["artifacts"]+m["recovery"]["artifacts"])
          PY
          accepted=false
          printf '%s\n' "Native Installer: BLOCKED (prototype is BusyBox/Linux; no native ready marker)" > "$base/installer-BLOCKED.txt"
          printf '%s\n' "Native Koronos Recovery: BLOCKED (prototype is BusyBox/Linux; no native ready marker)" > "$base/recovery-BLOCKED.txt"
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          echo "Release acceptance is NOT VERIFIED: native CPL3/PID Live readiness is pending, and Installer/Recovery are correctly blocked until native runtime images pass their own cold-boot gates."
      - name: Upload target-specific userspace acceptance traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-target-userspace-traces
          path: /tmp/chimera-userspace-traces/
          if-no-files-found: ignore
          retention-days: 14

      - name: Compress ISO for GitHub release asset size limit
        run: |
          set -euo pipefail
          iso=build/iso/chimera-ii-os.iso
          compressed="$iso.zst"
          zstd -T0 -3 --force "$iso" -o "$compressed"
          zstd -t "$compressed"
          size="$(stat -c '%s' "$compressed")"
          echo "Compressed ISO size: $size bytes"
          test "$size" -lt 2147483648 || { echo "::error::Compressed ISO still exceeds GitHub's 2 GiB release asset limit"; exit 1; }
          (
            cd build/iso
            sha256sum chimera-ii-os.iso > chimera-ii-os.iso.sha256
            sha256sum chimera-ii-os.iso.zst > chimera-ii-os.iso.zst.sha256
          )
      - name: Upload ISO artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-ii-os-live-installer
          path: |
            build/iso/chimera-ii-os.iso.zst
            build/iso/chimera-ii-os.iso.zst.sha256
            build/iso/chimera-ii-os.iso.sha256

      - name: Publish validated ISO candidate to GitHub Releases
        # Fail closed by default: a BIOS entry-marker smoke test is not userspace/release acceptance.
        # Enable this repository variable only after Live, Installer, Recovery, installed-disk and SMP gates pass.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.userspace_gate.outputs.accepted == 'true' && vars.CHIMERA_RELEASE_ACCEPTANCE_APPROVED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="iso-${GITHUB_SHA::12}"
          assets=(
            build/iso/chimera-ii-os.iso.zst
            build/iso/chimera-ii-os.iso.zst.sha256
            build/iso/chimera-ii-os.iso.sha256
          )
          notes="Automated ChimeraIIOS ISO candidate from commit $GITHUB_SHA. CI validated the original ISO checksum and BIOS/QEMU boot markers (ELBC). The ISO is distributed as Zstandard-compressed .iso.zst because the raw ISO exceeds GitHub's 2 GiB per-asset limit. Decompress with: zstd -d chimera-ii-os.iso.zst -o chimera-ii-os.iso; verify the compressed file with its .zst.sha256 and the decompressed ISO with chimera-ii-os.iso.sha256. This is a development prerelease; full userspace/Aurora readiness is not implied."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --draft=false --prerelease \
              --title "Chimera II OS ISO candidate (${GITHUB_SHA::7})" \
              --notes "$notes"
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Chimera II OS ISO candidate (${GITHUB_SHA::7})" \
              --notes "$notes"
          fi
