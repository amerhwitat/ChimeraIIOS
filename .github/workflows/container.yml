name: Container — Build and Push Docker Hub

on:
  push:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.comprehensive'
      - 'build-chimera-iso.sh'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/container.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.comprehensive'
      - 'build-chimera-iso.sh'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/container.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
      CHIMERA_DOCKERHUB_IMAGE: docker.io/amerhwitat/chimeraiios
      CHIMERA_DOCKERHUB_TAG: ${{ github.sha }}
      CHIMERA_DOCKER_CACHE_MAX_AGE: 0s
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Validate Compose
        run: docker compose config

      - name: Report publication mode
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "Docker Hub publication enabled for $CHIMERA_DOCKERHUB_IMAGE:$CHIMERA_DOCKERHUB_TAG"
          else
            echo "Building for validation only; PR events and missing secrets never publish."
          fi

      - name: Build with canonical ISO script and publish only on trusted push
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build-chimera-iso.sh
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            ./build-chimera-iso.sh --docker-only --clean-state --push --prune-docker-cache --tag "$GITHUB_SHA"
            docker buildx imagetools inspect "$CHIMERA_DOCKERHUB_IMAGE:$CHIMERA_DOCKERHUB_TAG"
          else
            ./build-chimera-iso.sh --docker-only --clean-state --prune-docker-cache --tag "$GITHUB_SHA"
          fi

      - name: Reclaim ephemeral BuildKit cache and report disk usage
        if: always()
        run: |
          docker builder prune --all --force --filter 'until=0s' || true
          docker system df || true
          df -h
