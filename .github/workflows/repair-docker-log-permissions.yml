name: One-time repair Docker build logs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch build script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('build-chimera-iso.sh')
          text = path.read_text()

          old = '''    if [ "${CHIMERA_PRUNE:-0}" = "1" ] && docker buildx prune -af >/tmp/chimera-buildx-prune.log 2>&1; then
        log_info "Unused BuildKit cache pruned."
    else
        log_warning "BuildKit cache prune failed; continuing."
        cat /tmp/chimera-buildx-prune.log >&2 || true
    fi
    rm -f /tmp/chimera-buildx-prune.log

    # Dockerfile.comprehensive now uses FROM builder AS runtime. This avoids
'''
          new = '''    # Keep Docker build logs inside the selected Chimera build storage. Fixed
    # /tmp names can become root-owned after a sudo build and make the next
    # unprivileged build fail before Docker is invoked.
    local log_dir="${BUILD_DIR}/logs"
    mkdir -p "$log_dir"
    local prune_log
    prune_log="$(mktemp "$log_dir/buildx-prune.XXXXXX.log")"

    if [ "${CHIMERA_PRUNE:-0}" = "1" ]; then
        if docker buildx prune -af >"$prune_log" 2>&1; then
            log_info "Unused BuildKit cache pruned."
        else
            log_warning "BuildKit cache prune failed; continuing."
            cat "$prune_log" >&2 || true
        fi
    else
        rm -f "$prune_log"
    fi

    # Dockerfile.comprehensive now uses FROM builder AS runtime. This avoids
'''
          if old not in text:
              raise SystemExit('BuildKit prune block not found')
          text = text.replace(old, new, 1)

          old = '''    local build_rc=1
    local attempt
    local build_log="/tmp/chimera-docker-build.log"
    : > "$build_log"
'''
          new = '''    local build_rc=1
    local attempt
    local build_log
    build_log="$(mktemp "$log_dir/docker-build.XXXXXX.log")"
'''
          if old not in text:
              raise SystemExit('Docker build log block not found')
          text = text.replace(old, new, 1)

          old = '''                docker run --rm ubuntu:24.04 sh -c 'dd if=/dev/zero of=/tmp/chimera-retry.bin bs=1M count=8 status=none && test -s /tmp/chimera-retry.bin' >/tmp/chimera-storage-retry.log 2>&1; then
'''
          new = '''                docker run --rm ubuntu:24.04 sh -c 'dd if=/dev/zero of=/tmp/chimera-retry.bin bs=1M count=8 status=none && test -s /tmp/chimera-retry.bin' >"$log_dir/storage-retry.log" 2>&1; then
'''
          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace('            cat /tmp/chimera-storage-retry.log >&2 || true\n', '            cat "$log_dir/storage-retry.log" >&2 || true\n', 1)
              text = text.replace('            rm -f /tmp/chimera-storage-retry.log\n', '            rm -f "$log_dir/storage-retry.log"\n', 1)

          path.write_text(text)
          subprocess.run(['bash', '-n', str(path)], check=True)
          PY

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-chimera-iso.sh
          git rm -f .github/workflows/repair-docker-log-permissions.yml
          git commit -m 'fix: use build-local writable Docker logs'
          git push
