name: Chimera II OS Docker Hub publish

on:
  push:
    branches: [fix/canonical-iso-rebased-20261109]
    tags: ['v*']
    paths:
      - 'Dockerfile.comprehensive'
      - 'docker/iso/**'
      - '.dockerignore'
      - '.github/workflows/chimera-dockerhub-publish.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: docker.io/amerhwitat/chimeraiios
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub publication skipped; configure DOCKER_USERNAME/DOCKER_PASSWORD or DOCKERHUB_USERNAME/DOCKERHUB_TOKEN."
          fi

      - name: Set up QEMU
        if: steps.credentials.outputs.available == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.credentials.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.credentials.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: steps.credentials.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
            type=ref,event=branch

      - name: Build and push comprehensive image
        if: steps.credentials.outputs.available == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.comprehensive
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=chimera-comprehensive
          cache-to: type=gha,mode=max,scope=chimera-comprehensive
          provenance: mode=max
          sbom: true

      - name: Verify published Docker Hub image
        if: steps.credentials.outputs.available == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            [[ -n "$image" ]] && docker buildx imagetools inspect "$image"
          done <<< "$IMAGE_TAGS"
