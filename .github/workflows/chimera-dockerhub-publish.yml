name: Chimera II OS Docker Hub publish (canonical builder)

on:
  push:
    branches: [main, fix/canonical-iso-rebased-20261109]
    tags: ['v*']
    paths:
      - 'build-chimera-iso.sh'
      - 'Dockerfile.comprehensive'
      - 'docker/iso/**'
      - '.dockerignore'
      - '.github/workflows/chimera-dockerhub-publish.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: docker.io/amerhwitat/chimeraiios
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
  CHIMERA_DOCKERHUB_IMAGE: docker.io/amerhwitat/chimeraiios
  CHIMERA_DOCKERHUB_TAG: ${{ github.sha }}
  CHIMERA_DOCKER_CACHE_MAX_AGE: 0s

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub publication skipped; configure DOCKER_USERNAME/DOCKER_PASSWORD or DOCKERHUB_USERNAME/DOCKERHUB_TOKEN."
          fi

      - name: Set up Buildx for remote manifest verification
        if: steps.credentials.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.credentials.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build, clean and push with build-chimera-iso.sh
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build-chimera-iso.sh
          ./build-chimera-iso.sh --docker-only --clean-state --push --prune-docker-cache --tag "${GITHUB_SHA}"

      - name: Verify published Docker Hub image
        if: steps.credentials.outputs.available == 'true'
        run: docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${GITHUB_SHA}"

      - name: Reclaim ephemeral runner BuildKit cache and report storage
        if: always() && steps.credentials.outputs.available == 'true'
        run: |
          docker builder prune --all --force --filter 'until=0s' || true
          docker system df || true
          df -h
