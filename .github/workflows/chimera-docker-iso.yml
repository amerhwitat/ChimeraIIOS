name: Chimera II OS Docker ISO

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/chimera-docker-iso.yml'
      - 'ISA.csv'
      - 'tools/isa/**'
      - 'docker/iso/**'
      - 'tools/build/create-bootable-iso.sh'
      - 'boot/iso/**'
      - 'boot/spitfire/**'
      - 'boot/kernel.bin'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate ISA catalog
        run: python3 tools/isa/validate-isa.py
      - name: Build ISO builder image
        run: docker build --file docker/iso/Dockerfile --tag chimera-ii-os-iso .
      - name: Run complete ISO builder
        run: |
          mkdir -p docker-output
          docker run --rm \
            --env CHIMERA_ARCH=x86_64 \
            --env CHIMERA_FIRMWARE=uefi \
            --volume "$PWD/docker-output:/output" \
            chimera-ii-os-iso
      - name: Verify ISO artifact and checksum
        run: |
          test -s docker-output/output.iso
          test -s docker-output/output.iso.sha256
          # The container writes a checksum containing /output/output.iso, which
          # is valid inside the container but not on the GitHub-hosted runner.
          # Regenerate a portable checksum against the mounted artifact path.
          # The container creates mounted files as root; remove its checksum before
          # writing the host-side portable checksum to avoid an ownership failure.
          rm -f docker-output/output.iso.sha256
          sha256sum docker-output/output.iso > docker-output/output.iso.sha256
          sha256sum --check docker-output/output.iso.sha256
      - name: Install ISO inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes xorriso
      - name: Verify actual ISO payloads and GRUB metadata
        run: |
          set -euo pipefail
          inspect="docker-output/iso-inspect"
          mkdir -p "$inspect"
          # The builder runs inside Docker, so its staging tree is not on the
          # runner. Inspect the artifact itself instead of testing host-only paths.
          for item in \
            "/src/ISA.csv:src/ISA.csv" \
            "/boot/spitfire/spitfire-sf0-mbr.bin:boot/spitfire/spitfire-sf0-mbr.bin" \
            "/boot/spitfire/spitfire-sf1-longmode.o:boot/spitfire/spitfire-sf1-longmode.o" \
            "/boot/koronos/koronos.elf:boot/koronos/koronos.elf" \
            "/boot/grub/grub.cfg:boot/grub/grub.cfg" \
            "/boot/visual/aurora-boot.png:boot/visual/aurora-boot.png" \
            "/boot/visual/Init.mp4:boot/visual/Init.mp4"; do
            iso_path="${item%%:*}"
            local_path="${item#*:}"
            mkdir -p "$inspect/$(dirname "$local_path")"
            xorriso -osirrox on -indev docker-output/output.iso -extract "$iso_path" "$inspect/$local_path" >/dev/null
            test -s "$inspect/$local_path" || { echo "ERROR: ISO payload missing: $iso_path" >&2; exit 2; }
          done
          grep -q 'multiboot2 /boot/koronos/koronos.elf' "$inspect/boot/grub/grub.cfg"
          grep -q 'background_image --mode stretch /boot/visual/aurora-boot.png' "$inspect/boot/grub/grub.cfg"
      - name: Inspect ISO BIOS El Torito and UEFI metadata
        run: |
          xorriso -indev docker-output/output.iso -report_el_torito plain -report_system_area plain -print '' | tee docker-output/ISO-BOOT-REPORT.txt
      - name: Upload Docker ISO release artifact
        uses: actions/upload-artifact@v4
        with:
          name: chimera2os-docker-output-iso
          path: |
            docker-output/output.iso
            docker-output/output.iso.sha256
            docker-output/ISO-BOOT-REPORT.txt
          retention-days: 14
