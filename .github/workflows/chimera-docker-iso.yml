name: Chimera II OS Docker ISO

on:
  pull_request:
    paths:
      - 'docker/iso/**'
      - 'tools/build/create-bootable-iso.sh'
      - 'boot/iso/**'
      - 'boot/spitfire/**'
      - '.github/workflows/chimera-docker-iso.yml'
  workflow_dispatch:
  push:
    paths:
      - 'ISA.csv'
      - 'tools/isa/**'
      - 'docker/iso/**'
      - 'tools/build/create-bootable-iso.sh'
      - 'boot/iso/**'
      - 'boot/spitfire/**'
      - 'boot/kernel.bin'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate ISA catalog
        run: python3 tools/isa/validate-isa.py
      - name: Build ISO builder image
        run: docker build --file docker/iso/Dockerfile --tag chimera-ii-os-iso .
      - name: Run complete ISO builder
        run: |
          mkdir -p docker-output
          docker run --rm \
            --env CHIMERA_ARCH=x86_64 \
            --env CHIMERA_FIRMWARE=uefi \
            --volume "$PWD/docker-output:/output" \
            chimera-ii-os-iso
      - name: Verify ISO artifact and checksum
        run: |
          test -s docker-output/output.iso
          test -s docker-output/output.iso.sha256
          (cd docker-output && sha256sum --check output.iso.sha256)
      - name: Verify staged Koronos, Spit Fire, Live, Recovery, artwork and GRUB metadata
        run: |
          set -euo pipefail
          tree=boot/iso/dist/iso
          test -s "$tree/boot/koronos/koronos.elf"
          test -s "$tree/boot/spitfire/spitfire-stage2.bin"
          test -s "$tree/boot/live/chimera-live-initramfs.img"
          test -s "$tree/boot/live/live-manifest.json"
          test -s "$tree/boot/recovery/chimera-recovery-initramfs.img"
          test -s "$tree/boot/recovery/recovery-manifest.json"
          test -s "$tree/boot/visual/aurora-boot.png"
          test -s "$tree/boot/visual/Init.mp4"
          grep -q 'multiboot2 /boot/koronos/koronos.elf' "$tree/boot/grub/grub.cfg"
          grep -q '/boot/live/chimera-live-initramfs.img' "$tree/boot/grub/grub.cfg"
          grep -q 'target=live' "$tree/boot/live/live-manifest.json" || true
          echo "Verified canonical Koronos boot tree, live/recovery payloads, offline artwork, and GRUB linkage."
      - name: Inspect ISO BIOS El Torito and UEFI metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso
          xorriso -indev docker-output/output.iso -report_el_torito plain -report_system_area plain -print '' | tee docker-output/ISO-BOOT-REPORT.txt
      - name: Upload Docker ISO release artifact
        uses: actions/upload-artifact@v4
        with:
          name: chimera2os-docker-output-iso
          path: |
            docker-output/output.iso
            docker-output/output.iso.sha256
            docker-output/ISO-BOOT-REPORT.txt
          retention-days: 14
