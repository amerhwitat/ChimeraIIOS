name: Database Engine Build and Provenance Matrix
on:
  push:
    paths:
      - 'database/**'
      - 'data/registry/databases.json'
      - 'tools/validate_database_build_matrix.py'
      - 'tests/database/**'
      - '.github/workflows/database-engine-build-matrix.yml'
  pull_request:
    paths:
      - 'database/**'
      - 'data/registry/databases.json'
      - 'tools/validate_database_build_matrix.py'
      - 'tests/database/**'
      - '.github/workflows/database-engine-build-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate database source and license matrix
        run: |
          python3 tools/validate_database_build_matrix.py
          python3 -m pytest tests/database/test_database_catalog.py tests/database/test_database_build_matrix.py -q
      - name: Build and test Koronos database service adapter
        run: |
          cmake -S database -B build/database -DCMAKE_BUILD_TYPE=Release
          cmake --build build/database --parallel 2
          ctest --test-dir build/database --output-on-failure
          file build/database/chimera_db_backend_test
          build/database/chimera_db_backend_test
  acquire-upstream-server-images:
    runs-on: ubuntu-latest
    steps:
      - name: Acquire upstream server engine images and record immutable digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for image in mariadb:11.4 postgres:17 firebirdsql/firebird:5.0.2 valkey/valkey:8.1.2 cassandra:5.0 couchdb:3.4.3; do
            docker pull "$image"
            safe="$(printf '%s' "$image" | tr '/:' '__')"
            docker image inspect "$image" --format '{{json .RepoDigests}}' > "artifacts/$safe.digests.json"
            docker image inspect "$image" --format '{{.Id}}' > "artifacts/$safe.image-id.txt"
            printf '%s\n' "$image" > "artifacts/$safe.reference.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: database-upstream-image-provenance
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
