name: Boot and ISO validation

on:
  push:
    branches: [main]
    paths:
      - 'boot/**'
      - 'kernel/**'
      - 'installer/**'
      - 'desktop/aurora/assets/**'
      - 'tools/branding/**'
      - 'tests/boot/**'
      - 'tools/boot/**'
      - 'tools/catalogs/**'
      - 'data/isa/online-source-catalog.json'
      - 'isa/isa_database.json'
      - 'tests/catalogs/**'
      - 'system/commands/chimera-arabic.json'
      - 'system/commands/online-command-catalog.json'
      - 'data/isa/online-isa-index.json'
      - 'tools/tests/test-iso-resume-and-aurora.sh'
      - 'build-chimera-iso.sh'
      - '.github/workflows/boot-iso-validation.yml'
  pull_request:
    paths:
      - 'boot/**'
      - 'kernel/**'
      - 'installer/**'
      - 'desktop/aurora/assets/**'
      - 'tools/branding/**'
      - 'tests/boot/**'
      - 'build-chimera-iso.sh'
      - 'tests/build/**'
      - 'tools/catalogs/**'
      - 'data/isa/online-source-catalog.json'
      - 'isa/isa_database.json'
      - 'tests/catalogs/**'
      - 'system/commands/chimera-arabic.json'
      - 'system/commands/online-command-catalog.json'
      - 'data/isa/online-isa-index.json'
      - '.github/workflows/boot-iso-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install boot validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm gcc g++ binutils grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools dosfstools ovmf qemu-system-x86 busybox-static cpio ffmpeg imagemagick rsync file gzip bzip2 unzip librsvg2-bin python3-pytest
      - name: Shell syntax and regression tests
        run: |
          bash -n build-chimera-iso.sh
          bash tests/build/test_cpu_aware_iso.sh
          bash -n tools/branding/stage-aurora-image.sh
          bash -n tools/branding/chimera-set-desktop-background.sh
          bash tests/boot/test-boot-artifact-regressions.sh
          bash tools/tests/test-iso-resume-and-aurora.sh
          python3 tools/boot/validate_boot_pipeline.py
          python3 -m unittest discover -s tests/boot -p 'test_native_boot_pipeline.py' -v
          bash -n boot/iso/build-iso.sh
          bash -n boot/iso/prepare-layout.sh
          bash -n boot/spitfire/build-spitfire.sh
          bash -n kernel/build-koronos.sh
      - name: Validate artwork XML and manifests
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path("desktop/aurora/assets").glob("*.svg"):
              ET.parse(p)
          for p in [
              Path("boot/splash/aurora_boot_splash.svg"),
              Path("boot/splash/jasper_background.svg"),
              Path("boot/splash/spitfire_background.svg"),
          ]:
              ET.parse(p)
          for p in [
              Path("boot/boot_protocol.json"),
              Path("boot/boot-artwork-manifest.json"),
              Path("installer/installation_phases.json"),
          ]:
              json.loads(p.read_text())
          print("boot artwork and manifests are syntactically valid")
          PY
      - name: Validate installation media contract
        run: bash tests/image/test_installation_media_contract.sh
      - name: Validate catalogs, native QFS and hardware AI contracts
        run: |
          python3 tools/catalogs/refresh_online_catalogs.py --self-test
          python3 -m unittest discover -s tests/catalogs -p 'test_*.py' -v
          python3 -m pytest -q tests/filesystem/test_qfs.py tests/cognition/test_hardware_recommender.py
      - name: Validate Aurora background contracts
        run: |
          grep -q 'background_image --mode stretch /boot/grub/aurora-wayland-glass.png' boot/iso/grub.cfg
          grep -q 'background_image' boot/installation/menu.cfg
          grep -q 'background_image' boot/jasper/jasper.cfg
          grep -q 'background_image' boot/jasper/diagnostics.cfg
          grep -q 'background_image' boot/jasper/install.cfg
          grep -q 'background_image' boot/jasper/live.cfg
          grep -q 'background_image' boot/jasper/recovery.cfg
          grep -q 'background_image' boot/spitfire/spitfire-menu.cfg
          grep -q 'desktop-background.conf' desktop/aurora/gates_menu.json
          test -s system/branding/aurora-default.png.base64
      - name: Validate GRUB linkage and target routing contract
        run: |
          grep -q 'multiboot2 /boot/koronos/koronos.elf' boot/iso/grub.cfg
          grep -q 'background_image --mode stretch /boot/grub/aurora-wayland-glass.png' boot/iso/grub.cfg
          grep -q 'configfile /boot/installation/menu.cfg' boot/iso/grub.cfg
          grep -q 'module2 /install/installer/installation.img chimera-installation-image' boot/jasper/install.cfg
          grep -q 'Mobile boot is unavailable in this build' boot/iso/grub.cfg
          for cfg in boot/iso/grub.cfg boot/jasper/jasper.cfg boot/jasper/live.cfg boot/jasper/install.cfg boot/installation/menu.cfg boot/spitfire/spitfire-menu.cfg; do
            grub-script-check "$cfg"
          done
          grep -q '3840x2160' boot/iso/grub.cfg
          grep -q '1024x768' boot/iso/grub.cfg
          grep -q '640x480' boot/iso/grub.cfg
          test -f kernel/arch/x86_64/entry.asm
          test -f kernel/arch/x86_64/koronos.ld
          test -f boot/spitfire/sf0_mbr.asm
          test -f boot/spitfire/sf1_longmode.asm
          test -f boot/spitfire/sf2_loader.cpp
      - name: Build Koronos and Spit Fire artifacts
        run: |
          bash kernel/build-koronos.sh
          bash boot/spitfire/build-spitfire.sh build/bootloaders build/koronos/x86_64/koronos.elf
          nm -g build/bootloaders/spitfire-sf1-longmode.o | grep -Eq '[[:space:]]T[[:space:]]start$'

          test -s build/bootloaders/spitfire-stage2.bin
      - name: Build complete native BIOS/UEFI ISO candidate
        run: |
          set -euo pipefail
          # Use the repository's native ISO mastering stage; this is a CI candidate, not a release.
          bash boot/iso/build-iso.sh
          test -s boot/iso/dist/output.iso
          xorriso -indev boot/iso/dist/output.iso -report_el_torito plain -report_system_area plain | tee boot/iso/dist/ISO-BOOT-REPORT-CI.txt
          grep -q 'El Torito' boot/iso/dist/ISO-BOOT-REPORT-CI.txt
          test -s boot/iso/dist/iso/boot/grub/grub.cfg
          test -s boot/iso/dist/iso/boot/koronos/koronos.elf
          test -s boot/iso/dist/iso/boot/live/chimera-live-initramfs.img
          test -s boot/iso/dist/iso/boot/recovery/chimera-recovery-initramfs.img
          test -s boot/iso/dist/iso/install/installer/installation.img
      - name: Boot complete ISO through BIOS and UEFI
        run: |
          set -uo pipefail
          smoke=build/full-iso-qemu
          iso=boot/iso/dist/output.iso
          mkdir -p "$smoke"
          set +e
          timeout 25s qemu-system-x86_64 -machine q35 -m 1024 -vga std -cdrom "$iso" -boot d -display none -serial "file:$smoke/bios-serial.log" -monitor none -no-reboot -no-shutdown -debugcon "file:$smoke/bios-debugcon.log" -global isa-debugcon.iobase=0xe9 -d guest_errors,cpu_reset -D "$smoke/bios-qemu.log"
          bios_status=$?
          # Prefer the non-Secure-Boot firmware pair, matching the disk image size.
          ovmf_code="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE_4M.fd' -print -quit)"
          ovmf_vars="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS_4M.fd' -print -quit)"
          if [[ -z "$ovmf_code" || -z "$ovmf_vars" ]]; then
            ovmf_code="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE.fd' -print -quit)"
            ovmf_vars="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS.fd' -print -quit)"
          fi
          if [[ -z "$ovmf_code" || -z "$ovmf_vars" ]]; then
            echo "::error::OVMF firmware files are missing; installed package contents:"
            dpkg -L ovmf || true
            exit 1
          fi
          cp "$ovmf_vars" "$smoke/OVMF_VARS.fd"
          timeout 25s qemu-system-x86_64 -machine q35 -m 1024 -vga std -drive if=pflash,format=raw,readonly=on,file="$ovmf_code" -drive if=pflash,format=raw,file="$smoke/OVMF_VARS.fd" -cdrom "$iso" -boot order=d -display none -serial "file:$smoke/uefi-serial.log" -monitor none -no-reboot -no-shutdown -debugcon "file:$smoke/uefi-debugcon.log" -global isa-debugcon.iobase=0xe9 -d guest_errors,cpu_reset -D "$smoke/uefi-qemu.log"
          uefi_status=$?
          set -e
          echo "BIOS QEMU exit: $bios_status; UEFI QEMU exit: $uefi_status"
          for mode in bios uefi; do
            if ! grep -Fq '[KRN ] KORONOS READY' "$smoke/$mode-debugcon.log" 2>/dev/null; then
              echo "::error::$mode ISO boot did not reach the Koronos readiness marker"
              [[ -f "$smoke/$mode-serial.log" ]] && tail -100 "$smoke/$mode-serial.log" || true
              [[ -f "$smoke/$mode-qemu.log" ]] && tail -100 "$smoke/$mode-qemu.log" || true
              exit 1
            fi
          done
          # Test target routing through each possible top-level menu configuration, with GRUB output mirrored to serial.
          original_cfg="$smoke/staged-grub.cfg"
          if [[ ! -s "$original_cfg" ]]; then cp ./boot/iso/dist/iso/boot/grub/grub.cfg "$original_cfg"; fi
          original_jasper_cfg="$smoke/original-jasper.cfg"
          original_install_cfg="$smoke/original-installation-menu.cfg"
          cp ./boot/iso/dist/iso/boot/jasper/jasper.cfg "$original_jasper_cfg"
          cp ./boot/iso/dist/iso/boot/installation/menu.cfg "$original_install_cfg"
          original_jasper_install_cfg="$smoke/original-jasper-install.cfg"
          cp ./boot/iso/dist/iso/boot/jasper/install.cfg "$original_jasper_install_cfg"
          for target in live install recovery; do
            case "$target" in
              live) main_index=0; jasper_index=0; install_index=0 ;;
              install) main_index=2; jasper_index=1; install_index=1 ;;
              recovery) main_index=5; jasper_index=2; install_index=0 ;;
            esac
            sed -E "s/^set default=.*/set default=$main_index/" "$original_cfg" > "$smoke/target-grub.cfg"
            printf '\ninsmod serial\nserial --unit=0 --speed=115200\nterminal_output --append serial\n' >> "$smoke/target-grub.cfg"
            cp "$smoke/target-grub.cfg" ./boot/iso/dist/iso/boot/grub/grub.cfg
            cp "$smoke/target-grub.cfg" ./boot/iso/dist/iso/boot/jasper/grub.cfg
            sed -E "s/^set default=.*/set default=$jasper_index/" "$original_jasper_cfg" > "$smoke/target-jasper.cfg"
            printf '\ninsmod serial\nserial --unit=0 --speed=115200\nterminal_output --append serial\n' >> "$smoke/target-jasper.cfg"
            cp "$smoke/target-jasper.cfg" ./boot/iso/dist/iso/boot/jasper/jasper.cfg
            { printf 'set timeout=0\nset default=%s\n' "$install_index"; cat "$original_install_cfg"; printf '\ninsmod serial\nserial --unit=0 --speed=115200\nterminal_output --append serial\n'; } > "$smoke/target-installation-menu.cfg"
            cp "$smoke/target-installation-menu.cfg" ./boot/iso/dist/iso/boot/installation/menu.cfg
            if [[ "$target" == recovery ]]; then
              cat > "$smoke/target-jasper-install.cfg" <<'EOF'
          set timeout=0
          set default=0
          insmod normal
          insmod multiboot2
          insmod serial
          serial --unit=0 --speed=115200
          terminal_output --append serial
          menuentry "QEMU recovery target" {
            multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
            module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
            module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
            boot
          }
          EOF
            else
              { printf 'set timeout=0\nset default=%s\n' "$install_index"; cat "$original_jasper_install_cfg"; printf '\ninsmod serial\nserial --unit=0 --speed=115200\nterminal_output --append serial\n'; } > "$smoke/target-jasper-install.cfg"
            fi
            cp "$smoke/target-jasper-install.cfg" ./boot/iso/dist/iso/boot/jasper/install.cfg
            grub-mkrescue -o "$smoke/target-$target.iso" ./boot/iso/dist/iso
            set +e
            timeout 15s qemu-system-x86_64 -machine q35 -m 1024 -vga std -cdrom "$smoke/target-$target.iso" -boot d -display none -serial "file:$smoke/target-$target-serial.log" -monitor none -no-reboot -no-shutdown -debugcon "file:$smoke/target-$target-debugcon.log" -global isa-debugcon.iobase=0xe9
            target_status=$?
            set -e
            trace="$smoke/target-$target-debugcon.log"
            grep -Fq '[KRN ] KORONOS READY' "$trace" || { echo "::error::$target menu did not reach Koronos (QEMU exit $target_status)"; tail -100 "$smoke/target-$target-serial.log" || true; exit 1; }
            case "$target" in
              live)
                grep -Fq '[LIVE] Live initramfs module accepted' "$trace" || { echo "::error::Live menu loaded the wrong target payload"; tail -100 "$smoke/target-live-serial.log" || true; exit 1; }
                grep -Fq 'USERSPACE NOT READY' "$trace" || { echo "::error::Live target must report the real userspace readiness boundary"; exit 1; }
                ;;
              install)
                grep -Fq '[INST] Installer target detected' "$trace" || { echo "::error::Installer menu did not hand off installer modules"; tail -100 "$smoke/target-install-serial.log" || true; exit 1; }
                grep -Fq 'installer userspace NOT READY' "$trace" || { echo "::error::Installer readiness was falsely reported"; exit 1; }
                ;;
              recovery)
                grep -Fq '[RECV] Recovery initramfs and manifest accepted' "$trace" || { echo "::error::Recovery menu did not hand off recovery modules"; tail -100 "$smoke/target-recovery-serial.log" || true; exit 1; }
                grep -Fq 'Recovery userspace NOT READY' "$trace" || { echo "::error::Recovery readiness was falsely reported"; exit 1; }
                ;;
            esac
          done
          cp "$original_cfg" ./boot/iso/dist/iso/boot/grub/grub.cfg
          cp "$original_cfg" ./boot/iso/dist/iso/boot/jasper/grub.cfg
          cp "$original_jasper_cfg" ./boot/iso/dist/iso/boot/jasper/jasper.cfg
          cp "$original_install_cfg" ./boot/iso/dist/iso/boot/installation/menu.cfg
          cp "$original_jasper_install_cfg" ./boot/iso/dist/iso/boot/jasper/install.cfg
      - name: Upload full ISO boot traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-full-iso-bios-uefi-traces
          path: |
            build/full-iso-qemu/*
            boot/iso/dist/ISO-BOOT-REPORT-CI.txt
          if-no-files-found: ignore
          retention-days: 14

