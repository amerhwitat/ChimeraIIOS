name: Chimera Boot Artifact Validation

on:
  push:
    paths:
      - 'boot/**'
      - 'kernel/**'
      - '.github/workflows/boot-artifacts.yml'
      - 'tools/tests/**'
      - 'tools/build-boot-artifacts.sh'
      - 'tools/package_os_assets.py'
      - 'boot/iso/**'
      - 'tools/boot/verify-production-init-elfs.py'
      - 'tests/boot/test_production_init_elf_validator.py'
  pull_request:
    paths:
      - 'boot/**'
      - 'kernel/**'
      - 'tools/tests/**'
      - '.github/workflows/boot-artifacts.yml'
      - 'tools/build-boot-artifacts.sh'
      - 'boot/iso/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install boot build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential binutils nasm file grub-common grub-pc-bin             grub-efi-amd64-bin xorriso mtools python3
      - name: Build Koronos, Spit Fire, Jasper and GRUB artifacts
        run: |
          chmod +x kernel/build-koronos.sh boot/spitfire/build-spitfire.sh tools/build-boot-artifacts.sh
          bash tools/build-boot-artifacts.sh
      - name: Test production init ELF payload validator
        run: python3 tests/boot/test_production_init_elf_validator.py
      - name: Validate ELF artifacts
        run: |
          test -s build/boot-artifacts/koronos/koronos.elf
          test -s build/boot-artifacts/jasper/jasper.elf
          test -s build/boot-artifacts/spitfire/spitfire-stage2.bin
          file build/boot-artifacts/koronos/koronos.elf
          file build/boot-artifacts/jasper/jasper.elf
      - name: Validate execution-order manifest
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open("build/boot-artifacts/manifests/boot-execution-order.json"))
          assert [x["id"] for x in p["native_execution_order"]] == ["spitfire","jasper","grub","koronos"]
          PY
      - name: Validate Koronos Multiboot2 header
        run: grub-file --is-x86-multiboot2 build/boot-artifacts/koronos/koronos.elf
      - name: Embed all artwork and package built ELF/EFI payloads
        run: |
          set -euo pipefail
          python3 tools/package_os_assets.py --root . --output build/os-asset-bundle --binary-root build/boot-artifacts --command-root . --command-root build/boot-artifacts --require-elf --require-efi --require-commands
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path("build/os-asset-bundle")
          a=json.loads((p/"embedded-artwork.json").read_text())
          b=json.loads((p/"binary-manifest.json").read_text())
          assert a["assets"], "embedded artwork manifest is empty"
          assert b["elf_count"] > 0, "no ELF payloads packaged"
          assert b["efi_count"] > 0, "no EFI payloads packaged"
          print(f"packaged artwork={len(a['assets'])} ELF={b['elf_count']} EFI={b['efi_count']}")
          PY
      - name: Upload offline artwork and native boot binaries
        uses: actions/upload-artifact@v4
        with:
          name: chimera-offline-artwork-elf-efi-bundle
          path: build/os-asset-bundle/
          if-no-files-found: error
          retention-days: 14
