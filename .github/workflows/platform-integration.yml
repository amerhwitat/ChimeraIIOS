name: Platform integration contracts

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
  workflow_dispatch:

jobs:
  contracts-and-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build g++-aarch64-linux-gnu g++-riscv64-linux-gnu
      - name: Validate platform contracts
        run: python3 -m unittest discover -s tests/platform -v
      - name: Cross-compile AArch64 and RV64 hardware/architecture probes
        run: bash tools/build-koronos-targets.sh
      - name: Compile and test the native SDK
        run: bash tools/build-sdk-bundle.sh "$RUNNER_TEMP/chimera-sdk"
