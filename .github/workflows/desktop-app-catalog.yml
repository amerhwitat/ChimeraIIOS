name: Desktop Application Catalog CI
on:
  push:
    paths:
      - "appcenter/**"
      - ".github/workflows/desktop-app-catalog.yml"
  pull_request:
    paths:
      - "appcenter/**"
      - ".github/workflows/desktop-app-catalog.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate application catalog
        run: python appcenter/cli/chimera-appctl.py validate
      - name: Test Application Center discovery and safe plans
        run: python -m pytest -q appcenter/tests
