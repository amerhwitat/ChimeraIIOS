name: Koronos Kernel Build
on:
  push:
    branches: [ main ]
    paths:
      - "kernel/**"
      - "isa/koronos/**"
      - "tools/koronos/**"
      - ".github/workflows/koronos-kernel.yml"
  pull_request:
    paths:
      - "kernel/**"
      - "isa/koronos/**"
      - "tools/koronos/**"
      - ".github/workflows/koronos-kernel.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install freestanding toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm g++ binutils python3
      - name: Build Koronos ELF64
        run: bash kernel/build-koronos.sh
      - name: Test physical frame allocator
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -I kernel/include \
            tests/kernel/frame_allocator_test.cpp kernel/core/frame_allocator.cpp \
            -o /tmp/chimera-frame-allocator-test
          /tmp/chimera-frame-allocator-test
      - name: Test protected-process admission
        run: |
          g++ -std=c++17 -I kernel/include kernel/core/elf64.cpp kernel/core/process.cpp kernel/tests/process_admission.cpp -o /tmp/chimera-process-admission
          /tmp/chimera-process-admission
      - name: Validate ELF64
        run: python3 tools/koronos/validate_elf.py build/koronos/x86_64/koronos.elf
      - name: Assert no unresolved symbols
        run: test -z "$(nm -u build/koronos/x86_64/koronos.elf)"