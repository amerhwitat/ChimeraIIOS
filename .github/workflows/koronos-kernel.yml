name: Koronos Kernel Build
on:
  push:
    branches: [ main ]
    paths:
      - "kernel/**"
      - "isa/koronos/**"
      - "tools/koronos/**"
      - "tools/tests/test_user_copy_syscall_contract.py"
      - "tools/tests/test_syscall_usercopy_contract.py"
      - ".github/workflows/koronos-kernel.yml"
      - "docs/PRODUCTION_RUNTIME_ACCEPTANCE.md"
  pull_request:
    paths:
      - "kernel/**"
      - "isa/koronos/**"
      - "tools/koronos/**"
      - ".github/workflows/koronos-kernel.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install freestanding toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm g++ binutils python3
      - name: Build Koronos ELF64
        run: bash kernel/build-koronos.sh
      - name: Validate syscall user-memory boundaries
        run: |
          python3 tools/tests/test_user_copy_syscall_contract.py
          python3 tools/tests/test_syscall_usercopy_contract.py
      - name: Test protected-process admission
        run: |
          g++ -std=c++17 -I kernel/include kernel/core/elf64.cpp kernel/core/process.cpp kernel/tests/process_admission.cpp -o /tmp/chimera-process-admission
          /tmp/chimera-process-admission
      - name: Test transactional RAMFS extraction, symlinks, and rollback
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I kernel/include \
            kernel/core/initramfs_cpio.cpp kernel/core/ramfs.cpp kernel/tests/ramfs_test.cpp \
            -o /tmp/koronos-ramfs-test
          /tmp/koronos-ramfs-test
      - name: Test fail-closed device driver probing
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -I kernel/include \
            kernel/core/driver.cpp kernel/tests/driver_probe_test.cpp \
            -o /tmp/koronos-driver-probe-test
          /tmp/koronos-driver-probe-test
      - name: Validate ELF64
        run: python3 tools/koronos/validate_elf.py build/koronos/x86_64/koronos.elf
      - name: Assert no unresolved symbols
        run: test -z "$(nm -u build/koronos/x86_64/koronos.elf)"