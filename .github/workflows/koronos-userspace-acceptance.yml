name: Koronos Userspace Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'kernel/**'
      - 'boot/iso/**'
      - 'tools/build-live-boot-binaries.sh'
      - 'tools/chimera-stage-installer-media.sh'
      - '.github/workflows/koronos-userspace-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'boot/iso/**'
      - 'tools/build-live-boot-binaries.sh'
      - 'tools/chimera-stage-installer-media.sh'
      - '.github/workflows/koronos-userspace-acceptance.yml'

permissions:
  contents: read

jobs:
  userspace:
    name: ${{ matrix.target }} / ${{ matrix.firmware }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [live, installer, recovery]
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel, ISO and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc g++ binutils grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools qemu-system-x86 ovmf
      - name: Build Koronos and high-address userspace probes
        run: bash kernel/build-koronos.sh
      - name: Build target-specific BIOS/UEFI ISO
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ROOT="$PWD"
          OUT="$ROOT/build/userspace-acceptance/$TARGET"
          ISO_ROOT="$OUT/iso"
          mkdir -p "$ISO_ROOT/boot/grub"
          cp build/koronos/x86_64/koronos.elf "$ISO_ROOT/boot/koronos.elf"
          cp "build/koronos/x86_64/user-init-$TARGET.elf" "$ISO_ROOT/boot/user-init-$TARGET.elf"
          cat > "$ISO_ROOT/boot/grub/grub.cfg" <<EOF
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Koronos $TARGET userspace acceptance" {
            multiboot2 /boot/koronos.elf
            module2 /boot/user-init-$TARGET.elf chimera-user-init-elf target=$TARGET probe=1
            boot
          }
          EOF
          grub-mkrescue -o "$OUT/koronos-$TARGET.iso" "$ISO_ROOT"
          test -s "$OUT/koronos-$TARGET.iso"
      - name: Boot and require userspace-originated readiness
        env:
          TARGET: ${{ matrix.target }}
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          set -uo pipefail
          OUT="$PWD/build/userspace-acceptance/$TARGET"
          LOG="$OUT/qemu-$FIRMWARE.log"
          QEMU=(qemu-system-x86_64 -m 512M -cdrom "$OUT/koronos-$TARGET.iso" -boot d -display none -serial none -monitor none -no-reboot -no-shutdown -debugcon "file:$LOG" -global isa-debugcon.iobase=0xe9)
          if [ "$FIRMWARE" = uefi ]; then
            OVMF_CODE=""
            OVMF_VARS=""
            for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
              if [ -f "$candidate" ]; then
                vars_candidate="${candidate/CODE/VARS}"
                if [ -f "$vars_candidate" ]; then OVMF_CODE="$candidate"; OVMF_VARS="$vars_candidate"; break; fi
              fi
            done
            if [ -z "$OVMF_CODE" ] || [ -z "$OVMF_VARS" ]; then
              echo "ERROR: matching OVMF code/vars images were not installed" >&2
              find /usr/share -iname 'OVMF_*.fd' -print >&2 || true
              exit 1
            fi
            cp "$OVMF_VARS" "$OUT/OVMF_VARS.fd"
            QEMU+=(-drive "if=pflash,format=raw,unit=0,readonly=on,file=$OVMF_CODE"
                   -drive "if=pflash,format=raw,unit=1,file=$OUT/OVMF_VARS.fd")
          fi
          set +e
          timeout 18s "${QEMU[@]}"
          qemu_rc=$?
          set -e
          # A healthy test init exits to the kernel, which then idles. Timeout
          # is therefore expected; the marker and clean-exit diagnostics are the
          # acceptance evidence, not the QEMU process exit code.
          grep -Fq "[KRN ] KORONOS READY" "$LOG"
          grep -Fq "USERSPACE PROBE READY: $TARGET init pid=1" "$LOG"
          grep -Fq "[PROBE] Target ring-3 ELF probe emitted its own readiness handshake and exited cleanly" "$LOG"
          grep -Fq "[MM  ] Process page-table self-test passed" "$LOG"
          echo "Accepted target=$TARGET firmware=$FIRMWARE qemu_exit=$qemu_rc"
      - name: Prove in-kernel timeout aborts a non-returning ring-3 process
        if: matrix.firmware == 'bios'
        run: |
          set -euo pipefail
          ROOT="$PWD"
          OUT="$ROOT/build/userspace-acceptance/timeout"
          ISO_ROOT="$OUT/iso"
          mkdir -p "$ISO_ROOT/boot/grub"
          cp build/koronos/x86_64/koronos.elf "$ISO_ROOT/boot/koronos.elf"
          cp build/koronos/x86_64/user-init-timeout.elf "$ISO_ROOT/boot/user-init-timeout.elf"
          cat > "$ISO_ROOT/boot/grub/grub.cfg" <<'EOF'
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Koronos in-kernel timeout acceptance" {
            multiboot2 /boot/koronos.elf
            module2 /boot/user-init-timeout.elf chimera-user-init-elf target=live probe=1
            boot
          }
          EOF
          grub-mkrescue -o "$OUT/koronos-timeout.iso" "$ISO_ROOT"
          LOG="$OUT/qemu-timeout.log"
          set +e
          timeout 15s qemu-system-x86_64 -machine pc -m 512M -cdrom "$OUT/koronos-timeout.iso" -boot d \
            -display none -serial none -monitor none -no-reboot -no-shutdown \
            -debugcon "file:$LOG" -global isa-debugcon.iobase=0xe9
          qemu_rc=$?
          set -e
          cat "$LOG"
          grep -Fq "[RUN ] Dispatching selected user init through CR3 + ring-3 entry with 10s kernel deadline" "$LOG"
          grep -Fq "[RUN ] ERROR: in-kernel PIT deadline expired; user process aborted and address space will be reclaimed" "$LOG"
          ! grep -Fq "USERSPACE PROBE READY: live" "$LOG"
          echo "Accepted in-kernel non-cooperative timeout (outer QEMU exit=$qemu_rc)"

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userspace-${{ matrix.target }}-${{ matrix.firmware }}-logs
          path: |
            build/userspace-acceptance/${{ matrix.target }}/qemu-${{ matrix.firmware }}.log
            build/userspace-acceptance/timeout/qemu-timeout.log
          if-no-files-found: warn

  full-iso-live-userspace:
    name: Full ISO target ELF probe acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native ISO and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm binutils python3 grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools dosfstools qemu-system-x86 busybox-static cpio ffmpeg imagemagick unzip python3-cairosvg
      - name: Build Koronos and target-specific user-init ELFs
        run: |
          set -euo pipefail
          bash kernel/build-koronos.sh
          test -s build/koronos/x86_64/user-init-live.elf
          test -s build/koronos/x86_64/user-init-installer.elf
          test -s build/koronos/x86_64/user-init-recovery.elf
      - name: Build Live and Recovery payloads and the canonical BIOS/UEFI ISO
        run: |
          set -euo pipefail
          bash tools/build-live-boot-binaries.sh
          bash boot/iso/build-iso.sh
          test -s boot/iso/dist/output.iso
          test -s boot/iso/dist/iso/boot/koronos/user-init-live.elf
          test -s boot/iso/dist/iso/boot/koronos/user-init-installer.elf
          test -s boot/iso/dist/iso/boot/koronos/user-init-recovery.elf
          sha256sum -c boot/iso/dist/output.iso.sha256
      - name: Verify six-case full-ISO target ELF probe matrix (not production init acceptance)
        run: |
          set -euo pipefail
          base="$PWD/boot/iso/dist/full-iso-probes"
          mkdir -p "$base"
          ovmf_code=""
          ovmf_vars=""
          for pair in \
            "OVMF_CODE_4M.fd:OVMF_VARS_4M.fd" \
            "OVMF_CODE.fd:OVMF_VARS.fd" \
            "edk2-x86_64-code.fd:edk2-x86_64-vars.fd"; do
            code_name="${pair%%:*}"
            vars_name="${pair##*:}"
            code_path="$(find /usr/share/OVMF /usr/share/ovmf /usr/share/qemu \( -type f -o -type l \) -name "$code_name" -print -quit 2>/dev/null || true)"
            vars_path="$(find /usr/share/OVMF /usr/share/ovmf /usr/share/qemu \( -type f -o -type l \) -name "$vars_name" -print -quit 2>/dev/null || true)"
            if [[ -n "$code_path" && -s "$code_path" && -n "$vars_path" && -s "$vars_path" ]]; then
              ovmf_code="$code_path"
              ovmf_vars="$vars_path"
              break
            fi
          done
          [[ -n "$ovmf_code" && -n "$ovmf_vars" ]] || { echo "::error::No matching OVMF CODE/VARS pair"; exit 1; }
          for target in live installer recovery; do
            case "$target" in
              live) menu_id=aurora-live ;;
              installer) menu_id=install ;;
              recovery) menu_id=recovery ;;
            esac
            for firmware in bios uefi; do
              tree="$base/$target-$firmware/tree"
              mkdir -p "$tree/boot/koronos"
              cp -a boot/iso/dist/iso/. "$tree/"
              cp "build/koronos/x86_64/user-init-$target.elf" "$tree/boot/koronos/user-init-$target.elf"
              python3 - "$tree/boot/grub/grub.cfg" "$target" <<'PY'
import sys
from pathlib import Path
cfg = Path(sys.argv[1])
target = sys.argv[2]
text = cfg.read_text(encoding="utf-8")
if target == "live":
    needle = "module2 /boot/live/live-manifest.json chimera-live-manifest\n"
elif target == "installer":
    needle = "module2 /install/installer/installer_profiles.json chimera-installer-profiles\n"
else:
    needle = "module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest\n"
module = f"module2 /boot/koronos/user-init-{target}.elf chimera-user-init-elf target={target} probe=1\n"
if needle not in text:
    raise SystemExit(f"target menu contract not found for {target}: {needle.strip()}")
text = text.replace(needle, needle + module)
cfg.write_text(text, encoding="utf-8")
PY
              sed -i "s/^set default=0$/set default=$menu_id/" "$tree/boot/grub/grub.cfg"
              grep -q "^set default=$menu_id$" "$tree/boot/grub/grub.cfg"
              iso="$base/$target-$firmware.iso"
              log="$base/$target-$firmware-debugcon.log"
              grub-mkrescue -o "$iso" "$tree"
              qemu=(qemu-system-x86_64 -machine q35 -m 1024 -smp 2 -accel tcg -cdrom "$iso" -boot d -display none -serial none -monitor none -no-reboot -no-shutdown -debugcon "file:$log" -global isa-debugcon.iobase=0xe9)
              if [[ "$firmware" == uefi ]]; then
                vars_copy="$base/$target-OVMF_VARS.fd"
                cp "$ovmf_vars" "$vars_copy"
                qemu+=(-drive "if=pflash,format=raw,unit=0,readonly=on,file=$ovmf_code"
                       -drive "if=pflash,format=raw,unit=1,file=$vars_copy")
              fi
              set +e
              timeout 45s "${qemu[@]}"
              qemu_rc=$?
              set -e
              cat "$log"
              grep -Fq '[KRN ] KORONOS READY' "$log"
              grep -Fq "USERSPACE PROBE READY: $target init pid=1" "$log" || { echo "::error::$target/$firmware target ELF probe did not reach ring-3 readiness (QEMU exit $qemu_rc)"; exit 1; }
              grep -Fq 'USERSPACE SYSCALL RETURNED TO RING3' "$log"
              grep -Fq '[MM  ] Process page-table self-test passed' "$log"
              grep -Fq '[PROBE] Target ring-3 ELF probe emitted its own readiness handshake and exited cleanly' "$log"
              echo "PASS: full ISO tree target ELF probe target=$target firmware=$firmware"
            done
          done
      - name: Upload full-ISO userspace probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-full-iso-userspace-probes
          path: |
            boot/iso/dist/full-iso-probes/*-debugcon.log
            boot/iso/dist/output.iso.sha256
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload full-ISO userspace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-full-iso-userspace-acceptance
          path: |
            boot/iso/dist/full-iso-userspace-debugcon.log
            boot/iso/dist/full-iso-userspace-serial.log
            boot/iso/dist/full-iso-installer-debugcon.log
            boot/iso/dist/full-iso-recovery-debugcon.log
            boot/iso/dist/output.iso.sha256
          if-no-files-found: ignore
          retention-days: 14
