name: OctavianOS live ISO and runtime-provider validation

on:
  push:
    branches: [main]
    paths:
      - 'live-image/**'
      - 'tools/aurora/**'
      - 'tools/commands/**'
      - 'tools/isa/**'
      - 'scripts/import-aurora-*-suite.sh'
      - 'aurora/terminals/**'
      - 'aurora/shells/**'
      - 'system/commands/**'
      - 'isa/catalog.json'
      - 'desktop/**'
      - '.github/workflows/octavian-live-image.yml'
  pull_request:
    paths:
      - 'live-image/**'
      - 'tools/aurora/**'
      - 'tools/commands/**'
      - 'tools/isa/**'
      - 'scripts/import-aurora-*-suite.sh'
      - 'aurora/terminals/**'
      - 'aurora/shells/**'
      - 'system/commands/**'
      - 'isa/catalog.json'
      - 'desktop/**'
      - '.github/workflows/octavian-live-image.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the OctavianOS ISO after all validation succeeds
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: octavian-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate OctavianOS live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO, source-build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools imagemagick python3 python3-gi gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 openbox x11-utils xdotool xvfb dbus-x11
          packages=(build-essential cmake meson ninja-build pkg-config autoconf automake libtool \
            rustc cargo golang-go zig gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu binutils \
            libx11-dev libxext-dev libxrender-dev libxft-dev libfontconfig1-dev libfreetype-dev \
            libxcb1-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl-dev \
            libdbus-1-dev libsystemd-dev libgtk-3-dev libgtk-4-dev libadwaita-1-dev \
            libvte-2.91-gtk4-dev libpcre2-dev libxml2-dev libglib2.0-dev)
          available=()
          for pkg in "${packages[@]}"; do apt-cache show "$pkg" >/dev/null 2>&1 && available+=("$pkg") || true; done
          if (("${#available[@]}")); then sudo apt-get install --yes "${available[@]}"; fi
      - name: Validate build tools, source registries and catalogues
        run: |
          set -euo pipefail
          bash -n live-image/build.sh tools/aurora/install-runtime-packages.sh
          bash -n scripts/import-aurora-terminal-suite.sh scripts/import-aurora-shell-suite.sh
          python3 -m py_compile tools/aurora/audit-terminal-shell-providers.py tools/aurora/export-icon-theme.py tools/commands/audit-command-providers.py tools/commands/build_native_command_matrix.py tools/isa/audit-isa-emulation-providers.py
          python3 -m json.tool aurora/terminals/registry.json >/dev/null
          python3 -m json.tool aurora/shells/registry.json >/dev/null
          python3 -m json.tool system/commands/chimera-command-list.json >/dev/null
          python3 -m json.tool isa/catalog.json >/dev/null
      - name: Build OctavianOS live ISO
        env:
          BUILD_ROOT: ${{ runner.temp }}/octavian-live-build
          OUT_DIR: ${{ runner.temp }}/octavian-live-output
        run: |
          set -euo pipefail
          sudo -E bash live-image/build.sh octavian
          sudo chown -R "$(id -u):$(id -g)" "$OUT_DIR"
          test -s "$OUT_DIR/octavian-os-live-amd64.iso"
      - name: Validate boot, command, ISA, terminal, shell and artwork payloads
        env:
          OUT_DIR: ${{ runner.temp }}/octavian-live-output
        run: |
          set -euo pipefail
          iso="$OUT_DIR/octavian-os-live-amd64.iso"
          (cd "$OUT_DIR" && sha256sum --check octavian-os-live-amd64.iso.sha256)
          xorriso -indev "$iso" -report_el_torito plain -report_system_area plain > "$OUT_DIR/ISO-BOOT-REPORT.txt"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          xorriso -osirrox on -indev "$iso" -extract /live/filesystem.squashfs "$tmp/filesystem.squashfs" >/dev/null
          unsquashfs -d "$tmp/root" "$tmp/filesystem.squashfs" >/dev/null
          root="$tmp/root"
          test -s "$root/usr/share/chimera/catalogs/command-provider-audit.json"
          test -s "$root/usr/share/chimera/catalogs/isa-emulator-provider-audit.json"
          test -s "$root/usr/share/chimera/aurora/terminal-shell-provider-audit.json"
          test -s "$root/usr/share/icons/chimera-aurora/index.theme"
          test -s "$root/usr/share/icons/chimera-aurora/scalable/apps/chimera-settings.svg"
          test -s "$root/usr/share/chimera/aurora/media/manifest.json"
          test -s "$root/usr/lib/chimera/commands/native/x86_64/chimera-cmd"
          test -s "$root/usr/lib/chimera/commands/native/aarch64/chimera-cmd"
          test -s "$root/usr/lib/chimera/commands/native/riscv64/chimera-cmd"
          python3 - "$root" <<'PY'
          import json,sys
          from pathlib import Path
          r=Path(sys.argv[1])
          c=json.loads((r/"usr/share/chimera/catalogs/command-provider-audit.json").read_text())
          t=json.loads((r/"usr/share/chimera/aurora/terminal-shell-provider-audit.json").read_text())
          i=json.loads((r/"usr/share/chimera/catalogs/isa-emulator-provider-audit.json").read_text())
          assert c["unique_command_names"] == 853, c["unique_command_names"]
          assert len(t["entries"]) == 18, len(t["entries"])
          assert i["catalogued_families"] == 11
          print("Audits enumerated all catalogue entries; missing providers remain explicit.")
          PY
          cp "$iso" "$OUT_DIR/octavian-os-live-desktop-fixed.iso"
          cp "$iso.sha256" "$OUT_DIR/octavian-os-live-desktop-fixed.iso.sha256"
      - name: Upload OctavianOS ISO candidate
        uses: actions/upload-artifact@v4
        with:
          name: octavian-os-live-desktop-fixed
          path: |
            ${{ runner.temp }}/octavian-live-output/octavian-os-live-desktop-fixed.iso
            ${{ runner.temp }}/octavian-live-output/octavian-os-live-desktop-fixed.iso.sha256
            ${{ runner.temp }}/octavian-live-output/ISO-BOOT-REPORT.txt
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish validated OctavianOS ISO
    needs: [build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: octavian-os-live-desktop-fixed
          path: release-assets
      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          iso="$(find release-assets -maxdepth 1 -type f -name '*.iso' ! -name '*.sha256' -print -quit)"
          checksum="$(find release-assets -maxdepth 1 -type f -name '*.iso.sha256' -print -quit)"
          report="$(find release-assets -maxdepth 1 -type f -name 'ISO-BOOT-REPORT.txt' -print -quit)"
          test -s "$iso" && test -s "$checksum" && test -s "$report"
          version="$(date -u +%Y.%m.%d)"
          short="${GITHUB_SHA:0:12}"
          tag="octavian-os-live-${version}-desktop-${short}"
          gh release create "$tag" "$iso" "$checksum" "$report" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OctavianOS ${version} — hosted desktop ISO" \
            --notes "Built from ${GITHUB_SHA}. This Debian/Linux-backed hosted desktop ISO includes command/ISA provider audit reports, architecture-specific native command cross-build artifacts, installed/source-built Aurora terminal and shell providers where available, and the generated Aurora icon/artwork theme. Missing providers and unsupported ISA families are explicitly reported. This is not a Koronos-native production release."
