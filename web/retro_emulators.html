<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chimera Retro Emulators</title><link rel="stylesheet" href="style.css"></head><body><main class="shell" style="padding:32px"><p class="eyebrow">CHIMERA RETRO COMPUTING</p><h1>Retro Computer Emulators</h1><p>Unified catalog and launcher adapters for classic computers and consoles. Legal ROMs, disks and firmware remain user-supplied.</p><div id="emulators" class="grid"></div></main><script>(()=>{const root=document.querySelector('#emulators');fetch('retro_emulators.json',{cache:'no-store'}).then(r=>r.json()).then(c=>{root.innerHTML=c.emulators.map(e=>`<article class="card" style="padding:20px"><h2>${e.title}</h2><p>${e.systems.join(' · ')}</p><p><small>${e.backend} · ${e.license}</small></p><a href="${e.url}" target="_blank" rel="noopener noreferrer">Project / documentation</a></article>`).join('')}).catch(e=>root.textContent='Catalog unavailable: '+e.message)})();</script></body></html>
