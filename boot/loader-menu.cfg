# Chimera II unified boot menu
# The media builder installs the appropriate loader assets for the firmware target.

menuentry "Chimera II OS — Spit Fire Native" {
  multiboot2 /boot/chimera2-kernel.elf
  module2 /boot/initrd.img chimera-initrd
}

menuentry "Chimera II OS — GRUB2 / Multiboot2" {
  multiboot2 /boot/chimera2-kernel.elf
  module2 /boot/initrd.img chimera-initrd
}

menuentry "Linux — installed system" {
  chainloader /EFI/linux/grubx64.efi
}

menuentry "Windows Boot Manager" {
  chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "Chimera II OS Setup" {
  multiboot2 /boot/installer/chimera-installer.elf
  module2 /boot/installer/installer-initrd.img installer-initrd
}

menuentry "Hardware Diagnostics / Recovery" {
  multiboot2 /boot/recovery/chimera-recovery.elf
}
