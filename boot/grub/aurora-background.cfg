# Shared display policy: try the highest mode advertised by firmware/adapter first.
# GRUB mode selection is best-effort; actual availability depends on GOP/VBE and the display.
set gfxmode=5120x2880,4096x2160,3840x2160,3440x1440,3200x1800,2880x1800,2560x1600,2560x1440,2560x1080,2048x1536,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x800,1280x720,1152x864,1024x768,800x600,640x480,auto
set gfxpayload=keep

# Canonical Chimera II Aurora artwork for GRUB/Jasper-compatible gfxterm menus.
# The ISO builder must stage /boot/visual/aurora-wayland-glass.jpg.
insmod jpeg
if [ -f /boot/visual/aurora-wayland-glass.jpg ]; then
  background_image /boot/visual/aurora-wayland-glass.jpg
fi
set color_normal=white/black
set color_highlight=black/light-cyan
