# Chimera II OS installation menu contract.
insmod gfxterm
# Shared display policy: try the highest mode advertised by firmware/adapter first.
# GRUB mode selection is best-effort; actual availability depends on GOP/VBE and the display.
set gfxmode=5120x2880x32,5120x2880x24,5120x2880,4096x2160x32,4096x2160x24,4096x2160,3840x2160x32,3840x2160x24,3840x2160,3440x1440x32,3440x1440x24,3440x1440,3200x1800x32,3200x1800x24,3200x1800,2880x1800x32,2880x1800x24,2880x1800,2560x1600x32,2560x1600x24,2560x1600,2560x1440x32,2560x1440x24,2560x1440,2560x1080x32,2560x1080x24,2560x1080,2048x1536x32,2048x1536x24,2048x1536,1920x1200x32,1920x1200x24,1920x1200,1920x1080x32,1920x1080x24,1920x1080,1680x1050x32,1680x1050x24,1680x1050,1600x1200x32,1600x1200x24,1600x1200,1600x900x32,1600x900x24,1600x900,1440x900x32,1440x900x24,1440x900,1366x768x32,1366x768x24,1366x768,1280x1024x32,1280x1024x24,1280x1024,1280x800x32,1280x800x24,1280x800,1280x720x32,1280x720x24,1280x720,1152x864x32,1152x864x24,1152x864,1024x768x32,1024x768x24,1024x768,800x600x32,800x600x24,800x600,640x480x32,640x480x24,640x480,auto
set gfxpayload=keep
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/visual/aurora-wayland-glass.jpg ]; then
  background_image --mode stretch /boot/visual/aurora-wayland-glass.jpg
elif [ -f /boot/jasper/background.jpg ]; then
  background_image --mode stretch /boot/jasper/background.jpg
elif [ -f /boot/jasper/background.png ]; then
  background_image --mode stretch /boot/jasper/background.png
fi

menuentry "Install Chimera II OS — Guided" --id install-guided {
  if [ -f /install/installer/installation.img ] && [ -f /install/installer/installation-manifest.json ] && [ -f /install/installer/installer-contract.json ] && [ -f /install/installer/installation_phases.json ] && [ -f /install/installer/installer_profiles.json ]; then
    configfile /boot/jasper/install.cfg
  else
    echo "ERROR: Chimera installation media contracts are incomplete."
    echo "Required: installation.img, installation-manifest.json, installer-contract.json,"
    echo "installation_phases.json and installer_profiles.json."
    echo "Rebuild the ISO with the native installation media stage enabled."
    sleep 8
  fi
}
menuentry "Install Chimera II OS — Recovery / Repair" --id install-recovery {
  configfile /boot/jasper/recovery.cfg
}
menuentry "Run Aurora Live First" --id install-live {
  configfile /boot/jasper/live.cfg
}
