# Chimera II OS installation menu contract
insmod gfxterm
insmod png
if [ -f /boot/jasper/background.png ]; then background_image --mode stretch /boot/jasper/background.png; fi
menuentry "Install Chimera II OS — Guided" --id install-guided {
  if [ -f /install/installer/installation.img ] && [ -f /install/installer/installation-manifest.json ]; then
    configfile /boot/jasper/install.cfg
  else
    echo "Installation image or manifest is missing from this ISO."
    sleep 5
  fi
}
menuentry "Install Chimera II OS — Recovery / Repair" --id install-recovery { configfile /boot/jasper/recovery.cfg }
menuentry "Run Aurora Live First" --id install-live { configfile /boot/jasper/live.cfg }
