set timeout=120
set timeout_style=menu
# Contract preview only: the current installer init reports a dry run and does not write disks.
menuentry 'Chimera II OS Enterprise Service Selection — contract preview' --id install-services {
  set chimera_service_media_complete=1
  if [ ! -f /install/installer/installation.img ]; then
    set chimera_service_media_complete=0
  fi
  if [ ! -f /install/installer/installation-manifest.json ]; then
    set chimera_service_media_complete=0
  fi
  if [ ! -f /install/installer/installer-contract.json ]; then
    set chimera_service_media_complete=0
  fi
  if [ ! -f /install/installer/installation_phases.json ]; then
    set chimera_service_media_complete=0
  fi
  if [ ! -f /install/installer/installer_profiles.json ]; then
    set chimera_service_media_complete=0
  fi
  if [ ! -f /install/installer/services/service-selection.json ]; then
    set chimera_service_media_complete=0
  fi
  if [ "$chimera_service_media_complete" = "1" ]; then
    multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
    module2 /boot/targets/target-init-installer.elf chimera-user-init-elf target=installer firmware=$grub_platform
    module2 /install/installer/installation.img chimera-installation-image
    module2 /install/installer/installation-manifest.json chimera-installation-manifest
    module2 /install/installer/installer-contract.json chimera-installer-contract
    module2 /install/installer/installation_phases.json chimera-install-phases
    module2 /install/installer/installer_profiles.json chimera-installer-profiles
    module2 /install/installer/services/service-selection.json chimera-installer-services-contract
    boot
  else
    echo "ERROR: installer service-selection media contracts are incomplete."
    echo "Return to the parent menu and rebuild the native installation media."
    sleep 8
  fi
}
