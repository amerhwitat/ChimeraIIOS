# Spit Fire native boot menu contract.
insmod gfxterm
insmod png
if [ -f /boot/spitfire/background.png ]; then background_image --mode stretch /boot/spitfire/background.png; fi
# On optical media GRUB supplies the ISO El Torito firmware handoff; Spit Fire remains
# the native disk/firmware path and hands the same Koronos ELF ABI to the kernel.
menuentry "Spit Fire — Boot Koronos" --id spitfire-koronos {
  multiboot2 /boot/koronos/koronos.elf
}
menuentry "Spit Fire — Safe Graphics / Koronos" --id spitfire-safe {
  multiboot2 /boot/koronos/koronos.elf
}
menuentry "Spit Fire — Return to Jasper" --id spitfire-return { configfile /boot/jasper/jasper.cfg }
