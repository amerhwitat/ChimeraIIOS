# Spit Fire native boot menu contract.
insmod gfxterm
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/visual/aurora-background.jpg ]; then background_image --mode stretch /boot/visual/aurora-background.jpg; elif [ -f /boot/spitfire/background.png ]; then background_image --mode stretch /boot/spitfire/background.png; fi
menuentry "Spit Fire — Boot Koronos" --id spitfire-koronos {
  multiboot2 /boot/koronos/koronos.elf
  boot
}
menuentry "Spit Fire — Safe Graphics / Koronos" --id spitfire-safe {
  multiboot2 /boot/koronos/koronos.elf
  boot
}
menuentry "Spit Fire — Return to Jasper" --id spitfire-return { configfile /boot/jasper/jasper.cfg }
