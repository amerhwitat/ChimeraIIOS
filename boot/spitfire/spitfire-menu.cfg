# Spit Fire native boot menu contract.
insmod gfxterm
# Prefer the highest firmware/adapter-supported graphics mode, falling back through VGA/SVGA modes.
set gfxmode=3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set terminal_output=gfxterm
terminal_output gfxterm
insmod jpeg
insmod png
insmod multiboot2
terminal_output gfxterm
if [ -f /boot/spitfire/background.png ]; then background_image --mode stretch /boot/spitfire/background.png; elif [ -f /boot/spitfire/aurora-boot.png ]; then background_image --mode stretch /boot/spitfire/aurora-boot.png; elif [ -f /boot/spitfire/aurora-wayland-glass.jpg ]; then background_image --mode stretch /boot/spitfire/aurora-wayland-glass.jpg; elif [ -f /boot/visual/spitfire_background.svg ]; then echo "SPIT FIRE artwork staged"; fi
if [ -f /boot/spitfire/boot-artwork-manifest.json ]; then echo "SPIT FIRE artwork contract: ready"; fi
if [ -f /boot/spitfire/Init.mp4 ]; then echo "SPIT FIRE intro media: ready"; fi
echo "[--------------------]  0%  SPIT FIRE native bootstrap"
echo "[#####---------------] 25%  Long-mode transition"
echo "[##########----------] 50%  Jasper handoff"
echo "[###############-----] 75%  GRUB / Koronos"
echo "[####################] 100% Boot menu ready"
menuentry "Spit Fire — Boot Koronos" --id spitfire-koronos {
  echo "[####################] 100% Loading Koronos"
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}
menuentry "Spit Fire — Safe Graphics / Koronos" --id spitfire-safe {
  echo "[####################] 100% Safe graphics ready"
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}
menuentry "Spit Fire — Dedicated Recovery" --id spitfire-recovery {
  echo "[####################] 100% Recovery ready"
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
  module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
  boot
}
menuentry "Spit Fire — Return to Main Menu" --id spitfire-return { configfile /boot/grub/grub.cfg }
