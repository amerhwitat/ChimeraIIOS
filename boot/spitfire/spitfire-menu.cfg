# Spit Fire native boot menu contract.
# Progress shows verified menu/handoff steps; kernel/userspace must report real runtime events.
insmod gfxterm
# Prefer the highest firmware/adapter-supported graphics mode, falling back through VGA/SVGA modes.
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set debug=all
set terminal_output=gfxterm
terminal_output gfxterm
function boot_log { echo "[BOOT] $1"; }
function boot_progress_0 { echo "[--------------------]  0% $1"; }
function boot_progress_25 { echo "[#####---------------] 25% $1"; }
function boot_progress_50 { echo "[##########----------] 50% $1"; }
function boot_progress_75 { echo "[###############-----] 75% $1"; }
function boot_progress_100 { echo "[####################] 100% $1"; }
boot_progress_0 "Boot menu initialized; checking target payloads"
insmod jpeg
insmod png
insmod multiboot2
terminal_output gfxterm
if [ -f /boot/spitfire/background.png ]; then background_image --mode stretch /boot/spitfire/background.png; elif [ -f /boot/spitfire/aurora-boot.png ]; then background_image --mode stretch /boot/spitfire/aurora-boot.png; elif [ -f /boot/spitfire/aurora-wayland-glass.jpg ]; then background_image --mode stretch /boot/spitfire/aurora-wayland-glass.jpg; elif [ -f /boot/visual/spitfire_background.svg ]; then echo "SPIT FIRE artwork staged"; fi
if [ -f /boot/spitfire/boot-artwork-manifest.json ]; then echo "SPIT FIRE artwork contract: ready"; fi
if [ -f /boot/spitfire/Init.mp4 ]; then echo "SPIT FIRE intro media: ready"; fi
echo "[--------------------]  0%  SPIT FIRE native bootstrap"
echo "[#####---------------] 25%  Long-mode transition"
echo "[##########----------] 50%  Jasper handoff"
echo "[###############-----] 75%  GRUB / Koronos"
echo "[####################] 100% Boot menu ready"
menuentry "Spit Fire — Live Aurora / Koronos" --id spitfire-koronos {
  echo "[####################] 100% Loading Koronos"
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events loglevel=7 ignore_loglevel printk.time=1
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}
menuentry "Spit Fire — Safe Graphics / Koronos" --id spitfire-safe {
  echo "[####################] 100% Safe graphics ready"
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events loglevel=7 ignore_loglevel printk.time=1
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}
menuentry "Spit Fire — Native Installer" --id spitfire-install {
  echo "[INST] Checking complete native installer payload"
  if [ -f /boot/koronos/koronos.elf -a -f /boot/installer/installer-initrd.img -a -f /install/installer/installation.img -a -f /install/installer/installation-manifest.json -a -f /install/installer/installer-contract.json -a -f /install/installer/installation_phases.json -a -f /install/installer/installer_profiles.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=installer chm.log=verbose chm.progress=events loglevel=7 ignore_loglevel printk.time=1
    module2 /boot/installer/installer-initrd.img chimera-installer-initrd
    module2 /install/installer/installation.img chimera-installation-image
    module2 /install/installer/installation-manifest.json chimera-installation-manifest
    module2 /install/installer/installer-contract.json chimera-installer-contract
    module2 /install/installer/installation_phases.json chimera-install-phases
    module2 /install/installer/installer_profiles.json chimera-installer-profiles
    boot
  else
    echo "[INST BLOCKED] Native installer initramfs/image/contracts are incomplete."
    sleep 8
  fi
}
menuentry "Spit Fire — Dedicated Recovery" --id spitfire-recovery {
  echo "[RECOVERY] Checking native recovery payload"
  if [ -f /boot/koronos/koronos.elf -a -f /boot/recovery/chimera-recovery-initramfs.img -a -f /boot/recovery/recovery-manifest.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=recovery chm.log=verbose chm.progress=events loglevel=7 ignore_loglevel printk.time=1
    module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
    module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
    boot
  else
    echo "[RECOVERY BLOCKED] Native recovery initramfs/manifest are incomplete."
    sleep 8
  fi
}
menuentry "Koronos — Native Kernel Diagnostics (experimental)" --id koronos {
  echo "[KORO] Starting native Koronos with verbose diagnostics"
  if [ -f /boot/koronos/koronos.elf ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=diagnostics chm.log=verbose chm.progress=events loglevel=7 ignore_loglevel printk.time=1
    boot
  else
    echo "[KORO BLOCKED] /boot/koronos/koronos.elf is missing."
    echo "No alternate kernel will be substituted."
    sleep 8
  fi
}

menuentry "Spit Fire — Return to Main Menu" --id spitfire-return { configfile /boot/grub/grub.cfg }
