# Chimera II OS graphical GRUB entry point.
# Keep GRUB responsible only for firmware graphics, selection and loading;
# MP4 playback starts later in the native Koronos/Aurora runtime.
insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod jpeg
insmod png
insmod font
insmod normal
insmod search
insmod search_fs_file
insmod linux
insmod multiboot2
insmod chain
insmod configfile
insmod reboot
insmod halt
insmod echo
set gfxmode=1024x768,auto
set gfxpayload=keep
set terminal_output=gfxterm
terminal_output gfxterm
set timeout=8
set default=0
if [ -f /boot/visual/aurora-background.jpg ]; then
  background_image --mode stretch /boot/visual/aurora-background.jpg
elif [ -f /boot/grub/aurora-wayland-glass.jpg ]; then
  background_image --mode stretch /boot/grub/aurora-wayland-glass.jpg
elif [ -f /boot/grub/aurora-wayland-glass.png ]; then
  background_image /boot/grub/aurora-wayland-glass.png
fi

menuentry "Chimera II OS — Live Aurora / Koronos" --id aurora-live {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
}
menuentry "Chimera II OS — Install Chimera II OS" --id install {
  configfile /boot/installation/menu.cfg
}
menuentry "Chimera II OS — Recovery" --id recovery {
  configfile /boot/jasper/recovery.cfg
}
menuentry "Chimera II OS — Diagnostics" --id diagnostics {
  configfile /boot/jasper/diagnostics.cfg
}
menuentry "Chimera II OS — Spit Fire Native Path" --id spitfire {
  configfile /boot/spitfire/spitfire-menu.cfg
}
menuentry "Chimera II OS — Firmware Setup" --id firmware {
  fwsetup
}
menuentry "Chimera II OS — Safe Graphics / Koronos" --id safe {
  multiboot2 /boot/kernel.bin
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs safe-graphics
  module2 /boot/live/live-manifest.json chimera-live-manifest
}
menuentry "Chimera II OS — Jasper Boot Manager" --id jasper {
  configfile /boot/jasper/jasper.cfg
}
menuentry "Chimera II OS — GRUB Command Line" {
  commandline
}
menuentry "Chimera II OS — Reboot" {
  reboot
}
menuentry "Chimera II OS — Power Off" {
  halt
}
