insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu
set gfxmode=auto
set gfxpayload=keep
set timeout=5
set default=0
if [ -f /boot/grub/aurora-wayland-glass.png ]; then
  background_image /boot/grub/aurora-wayland-glass.png
fi
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue
menuentry "Chimera II OS — Koronos Kernel" {
    multiboot2 /boot/kernel.bin
    boot
}
menuentry "Chimera II OS — Jasper / GRUB2 Recovery" {
    configfile /boot/grub/grub.cfg
}
menuentry "Chimera II OS — Aurora Wayland Glass" {
    multiboot2 /boot/kernel.bin
    boot
}
