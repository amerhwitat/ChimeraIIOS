# Chimera II OS graphical GRUB entry point.
insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod jpeg
insmod png
insmod font
insmod normal
insmod search
insmod search_fs_file
insmod multiboot2
insmod chain
insmod configfile
insmod reboot
insmod halt
insmod echo
if [ "$grub_platform" = efi ]; then insmod efi_gop; insmod efifwsetup; fi
set gfxmode=auto,1920x1080,1600x900,1280x720,1024x768,800x600,640x480
set gfxpayload=keep
set terminal_output=gfxterm
terminal_output gfxterm
set timeout=8
set default=0

if [ -f /boot/visual/aurora-wayland-glass.jpg ]; then background_image --mode stretch /boot/visual/aurora-wayland-glass.jpg; fi

menuentry "Chimera II OS — Live Aurora / Koronos" --id aurora-live {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  module2 /system/hardware/chimera-hardware-profile.json chimera-hardware-profile
  module2 /system/hardware/compatibility-modes.json chimera-compatibility-modes
  module2 /system/hardware/nbit-policy.conf chimera-nbit-policy
  boot
}
menuentry "Chimera II OS — Normal Boot" --id normal { configfile /boot/jasper/jasper.cfg; }
menuentry "Chimera II OS — Install Chimera II OS" --id install { configfile /boot/installation/menu.cfg; }
menuentry "Chimera II OS — Enterprise Service Selection" --id services { configfile /boot/installation/services.cfg; }
menuentry "Chimera II OS — Repair Terminal / Recovery" --id recovery { configfile /boot/jasper/recovery.cfg; }
menuentry "Chimera II OS — Safe Mode" --id safe-mode { configfile /boot/jasper/safe-mode.cfg; }
menuentry "Chimera II OS — Last Known Good" --id last-known-good { configfile /boot/jasper/last-known-good.cfg; }
menuentry "Chimera II OS — Diagnostics" --id diagnostics { configfile /boot/jasper/diagnostics.cfg; }
menuentry "Chimera II OS — Retro Computer Center" --id retro { configfile /boot/jasper/retro.cfg; }
menuentry "Chimera II OS — Spit Fire Native Path" --id spitfire { configfile /boot/spitfire/spitfire-menu.cfg; }

if [ "$grub_platform" = efi ]; then
  menuentry "Chimera II OS — UEFI Firmware Setup" --id firmware { fwsetup; }
else
  menuentry "Chimera II OS — Firmware Setup (BIOS/VMware)" --id firmware-bios {
    echo "Firmware Setup is not available through GRUB in legacy BIOS mode."
    echo "Configure UEFI on the machine/VM to access firmware setup."
    read
  }
fi

menuentry "Chimera II OS — Jasper Boot Manager" --id jasper { configfile /boot/jasper/jasper.cfg; }
menuentry "Chimera II OS — GRUB Command Line" { commandline; }
menuentry "Chimera II OS — Reboot" { reboot; }
menuentry "Chimera II OS — Power Off" { halt; }
