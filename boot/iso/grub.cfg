# Chimera II OS boot menu. Primary paths are self-contained and expose
# normal, Live CD, installation, recovery, diagnostics and mobile targets.
insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod jpeg
insmod png
insmod font
insmod normal
insmod search
insmod search_fs_file
insmod multiboot2
insmod chain
insmod reboot
insmod halt
insmod echo
if [ "$grub_platform" = efi ]; then insmod efi_gop; insmod efifwsetup; fi
set gfxmode=auto,1920x1080,1600x900,1280x720,1024x768,800x600,640x480
set gfxpayload=keep
set terminal_output=gfxterm
terminal_output gfxterm
set timeout=8
set default=0

if [ -f /boot/visual/aurora-boot.png ]; then background_image --mode stretch /boot/visual/aurora-boot.png; fi
set color_normal=light-gray/black
set color_highlight=white/blue

menuentry "Chimera II OS — Live Aurora / Koronos [100% path ready]" --id aurora-live {
  echo "[████░░░░░░░░░░░░░░░░]  0%  Aurora Live CD"
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "Chimera II OS — Normal Boot [system progress]" --id normal {
  echo "[████░░░░░░░░░░░░░░░░]  0%  Starting Koronos"
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "Chimera II OS — Install / Installer Environment [progress UI]" --id install {
  echo "[████░░░░░░░░░░░░░░░░]  0%  Installer environment"
