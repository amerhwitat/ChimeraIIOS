insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu
insmod normal
insmod search
insmod search_fs_file
insmod linux
insmod multiboot2
insmod chain
insmod configfile
insmod reboot
insmod halt
insmod echo
set gfxmode=auto
set gfxpayload=keep
set timeout=8
set default=0
if [ -f /boot/grub/aurora-wayland-glass.png ]; then background_image /boot/grub/aurora-wayland-glass.png; fi
function chimera_live {
  if [ -f /boot/vmlinuz ] && [ -f /boot/chimera-live-initramfs.img ]; then
    linux /boot/vmlinuz boot=chimera-live quiet splash chm.mode=live chm.koronos=/boot/koronos.elf
    initrd /boot/chimera-live-initramfs.img
    boot
  else
    echo "Chimera live kernel/initramfs payload is missing."
    sleep 5
  fi
}
menuentry "Chimera II OS — Live Desktop / Aurora" --id aurora-live { chimera_live }
menuentry "Chimera II OS — Live Safe Graphics" --id safe {
  if [ -f /boot/vmlinuz ] && [ -f /boot/chimera-live-initramfs.img ]; then
    linux /boot/vmlinuz boot=chimera-live chm.mode=safe-graphics nomodeset chm.koronos=/boot/koronos.elf
    initrd /boot/chimera-live-initramfs.img
    boot
  else
    echo "Live kernel payload is missing."; sleep 5
  fi
}
menuentry "Chimera II OS — Recovery / Jasper" --id jasper { configfile /boot/jasper/recovery.cfg }
menuentry "Chimera II OS — Diagnostics" --id diagnostics { chimera_live }
menuentry "Chimera II OS — Firmware Setup (UEFI)" --id firmware { fwsetup }
menuentry "Chimera II OS — GRUB Command Line" { commandline }
menuentry "Chimera II OS — Reboot" { reboot }
menuentry "Chimera II OS — Power Off" { halt }
