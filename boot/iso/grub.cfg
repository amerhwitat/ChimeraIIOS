# Chimera II OS graphical GRUB entry point.
# The same ISO is intended to boot as an El Torito BIOS CD/DVD or as an
# x86_64 UEFI CD/DVD. This is the common path used by physical systems,
# Hyper-V Generation 1/2 and VMware BIOS/EFI virtual machines.
insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod jpeg
insmod png
insmod font
insmod normal
insmod search
insmod search_fs_file
insmod multiboot2
insmod chain
insmod configfile
insmod reboot
insmod halt
insmod echo
if [ "$grub_platform" = efi ]; then
  insmod efi_gop
  insmod efifwsetup
fi

# Keep the firmware-provided framebuffer/GOP when possible. Hyper-V Gen2 and
# VMware EFI expose a virtual UEFI graphics device; legacy BIOS paths fall back
# through GRUB's bochs/cirrus/VBE-compatible video modules.
set gfxmode=auto,1920x1080,1600x900,1280x720,1024x768,800x600,640x480
set gfxpayload=keep
set terminal_output=gfxterm
terminal_output gfxterm
set timeout=8
set default=0

if [ -f /boot/visual/aurora-wayland-glass.jpg ]; then
  background_image --mode stretch /boot/visual/aurora-wayland-glass.jpg
elif [ -f /boot/grub/aurora-wayland-glass.jpg ]; then
  background_image --mode stretch /boot/grub/aurora-wayland-glass.jpg
elif [ -f /boot/grub/aurora-wayland-glass.png ]; then
  background_image --mode stretch /boot/grub/aurora-wayland-glass.png
fi

menuentry "Chimera II OS — Live Aurora / Koronos" --id aurora-live {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  module2 /system/hardware/chimera-hardware-profile.json chimera-hardware-profile
  module2 /system/hardware/compatibility-modes.json chimera-compatibility-modes
  module2 /system/hardware/nbit-policy.conf chimera-nbit-policy
  boot
}
menuentry "Chimera II OS — Install Chimera II OS" --id install {
  configfile /boot/installation/menu.cfg
}
menuentry "Chimera II OS — Retro Computer Center" --id retro {
  configfile /boot/jasper/retro.cfg
}
menuentry "Chimera II OS — Recovery" --id recovery {
  configfile /boot/jasper/recovery.cfg
}
menuentry "Chimera II OS — Diagnostics" --id diagnostics {
  configfile /boot/jasper/diagnostics.cfg
}
menuentry "Chimera II OS — Spit Fire Native Path" --id spitfire {
  configfile /boot/spitfire/spitfire-menu.cfg
}

if [ "$grub_platform" = efi ]; then
  menuentry "Chimera II OS — UEFI Firmware Setup" --id firmware {
    fwsetup
  }
else
  menuentry "Chimera II OS — Firmware Setup (BIOS/VMware)" --id firmware-bios {
    echo "Firmware Setup is not available through GRUB in legacy BIOS mode."
    echo "For UEFI firmware setup, configure the VM/system for UEFI and reboot."
    echo "Press any key to return to the Chimera II OS menu."
    read
  }
fi

menuentry "Chimera II OS — Safe Graphics / Koronos" --id safe {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs safe-graphics
  module2 /boot/live/live-manifest.json chimera-live-manifest
  module2 /system/hardware/chimera-hardware-profile.json chimera-hardware-profile
  module2 /system/hardware/compatibility-modes.json chimera-compatibility-modes
  module2 /system/hardware/nbit-policy.conf chimera-nbit-policy
  boot
}
menuentry "Chimera II OS — Jasper Boot Manager" --id jasper {
  configfile /boot/jasper/jasper.cfg
}
menuentry "Chimera II OS — GRUB Command Line" {
  commandline
}
menuentry "Chimera II OS — Reboot" {
  reboot
}
menuentry "Chimera II OS — Power Off" {
  halt
}
