insmod all_video
insmod gfxterm
insmod png
insmod normal
insmod search
insmod search_fs_file
insmod linux
insmod multiboot2
insmod chain
insmod configfile
insmod reboot
insmod halt
insmod echo
set gfxmode=auto
set gfxpayload=keep
set timeout=8
set default=0
if [ -f /boot/grub/aurora-wayland-glass.png ]; then background_image /boot/grub/aurora-wayland-glass.png; fi

# Koronos is the executable Chimera II OS kernel. Linux vmlinuz is not used.
menuentry "Chimera II OS — Live Aurora / Koronos" --id aurora-live {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
}
menuentry "Chimera II OS — Safe Graphics / Koronos" --id safe {
  multiboot2 /boot/kernel.bin
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs safe-graphics
  module2 /boot/live/live-manifest.json chimera-live-manifest
}
menuentry "Chimera II OS — Installation / Koronos" --id install { configfile /boot/installation/menu.cfg }
menuentry "Chimera II OS — Jasper Boot Manager" --id jasper { configfile /boot/jasper/jasper.cfg }
menuentry "Chimera II OS — Spit Fire Native Menu" --id spitfire { configfile /boot/spitfire/spitfire-menu.cfg }
menuentry "Chimera II OS — Recovery" --id recovery { configfile /boot/jasper/recovery.cfg }
menuentry "Chimera II OS — Diagnostics" --id diagnostics { configfile /boot/jasper/diagnostics.cfg }
menuentry "Chimera II OS — Firmware Setup (UEFI)" --id firmware { fwsetup }
menuentry "Chimera II OS — GRUB Command Line" { commandline }
menuentry "Chimera II OS — Reboot" { reboot }
menuentry "Chimera II OS — Power Off" { halt }
