insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu
insmod normal
insmod search
insmod search_fs_file
insmod chain
insmod configfile
insmod reboot
insmod halt
insmod echo
insmod test
set gfxmode=auto
set gfxpayload=keep
set timeout=8
set default=0
if [ -f /boot/grub/aurora-wayland-glass.png ]; then
  background_image /boot/grub/aurora-wayland-glass.png
fi
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue
search --file --set=chimera_root /boot/kernel.bin
if [ -z "$chimera_root" ]; then search --file --set=chimera_root /boot/koronos.elf; fi

function chimera_boot {
  if [ -f /boot/kernel.bin ]; then
    multiboot2 /boot/kernel.bin $*
  else
    multiboot2 /boot/koronos.elf $*
  fi
  boot
}

submenu "Chimera II OS — Gates Menu" {
  menuentry "Aurora Wayland Glass Desktop" { chimera_boot chm.mode=gates chm.desktop=aurora }
  menuentry "Linux Desktop Personality" { chimera_boot chm.mode=gates chm.desktop=linux }
  menuentry "Windows Compatibility Desktop" { chimera_boot chm.mode=gates chm.desktop=windows }
  menuentry "macOS Compatibility Desktop" { chimera_boot chm.mode=gates chm.desktop=macos }
  menuentry "BSD/Unix Desktop Personality" { chimera_boot chm.mode=gates chm.desktop=bsd }
  menuentry "Safe Graphics / Compatibility Mode" { chimera_boot chm.mode=safe-graphics chm.cpu=auto chm.compat=auto }
  menuentry "Installer — Aurora GUI" { chimera_boot chm.mode=installer chm.installer=gui chm.cpu=auto chm.compat=auto }
  menuentry "Installer — Text / Serial" { chimera_boot chm.mode=installer chm.installer=cli chm.console=serial chm.cpu=auto chm.compat=auto }
  menuentry "Recovery / Rescue Environment" { chimera_boot chm.mode=recovery chm.recovery=1 chm.cpu=auto chm.compat=auto }
}

menuentry "Chimera II OS — Koronos Kernel" { chimera_boot chm.mode=koronos chm.parallel=auto chm.cpu=auto chm.compat=auto }
menuentry "Chimera II OS — Aurora Wayland Glass" { chimera_boot chm.mode=desktop chm.desktop=aurora chm.cpu=auto chm.compat=auto }
menuentry "Chimera II OS — Linux Personality" { chimera_boot chm.mode=desktop chm.desktop=linux chm.cpu=auto chm.compat=auto }
menuentry "Chimera II OS — Windows Personality" { chimera_boot chm.mode=desktop chm.desktop=windows chm.cpu=auto chm.compat=auto }
menuentry "Chimera II OS — macOS Personality" { chimera_boot chm.mode=desktop chm.desktop=macos chm.cpu=auto chm.compat=auto }
menuentry "Chimera II OS — BSD/Unix Personality" { chimera_boot chm.mode=desktop chm.desktop=bsd chm.cpu=auto chm.compat=auto }

menuentry "Chimera II OS — Install Chimera II OS" { chimera_boot chm.mode=installer chm.installer=gui }
menuentry "Chimera II OS — Install (Text/Serial)" { chimera_boot chm.mode=installer chm.installer=cli chm.console=serial }
menuentry "Chimera II OS — Rescue / Recovery" { chimera_boot chm.mode=recovery chm.recovery=1 }
menuentry "Chimera II OS — Hardware Diagnostics" { chimera_boot chm.mode=diagnostics chm.diagnostics=hardware }
menuentry "Chimera II OS — Kernel Diagnostics" { chimera_boot chm.mode=diagnostics chm.diagnostics=kernel }
menuentry "Chimera II OS — Memory/CPU Diagnostics" { chimera_boot chm.mode=diagnostics chm.diagnostics=memory-cpu }

menuentry "Chimera II OS — Existing Windows EFI" {
  if [ -f /EFI/Microsoft/Boot/bootmgfw.efi ]; then
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    boot
  else
    echo "Windows EFI loader not found on this media/device."
    sleep 3
  fi
}
menuentry "Chimera II OS — Firmware Setup (UEFI)" {
  if commandpath; then
    fwsetup
  else
    echo "UEFI firmware setup is unavailable in this firmware."
    sleep 3
  fi
}
menuentry "Chimera II OS — GRUB Command Line" { commandline }
menuentry "Chimera II OS — GRUB Configuration" { configfile /boot/grub/grub.cfg }
menuentry "Chimera II OS — Reboot" { reboot }
menuentry "Chimera II OS — Power Off" { halt }
menuentry "Chimera II OS — Jasper / GRUB2 Recovery" { configfile /boot/jasper/grub.cfg }
