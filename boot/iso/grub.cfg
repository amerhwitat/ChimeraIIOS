if [ "$grub_platform" = efi ]; then
  menuentry "Chimera II OS — UEFI Firmware Setup" --id firmware { fwsetup; }
else
  menuentry "Chimera II OS — Firmware Setup (BIOS/VMware)" --id firmware-bios {
    echo "Firmware Setup is not available through GRUB in legacy BIOS mode."
    echo "Configure UEFI on the machine/VM to access firmware setup."
    read
  }
fi

menuentry "Chimera II OS — GRUB Command Line" { commandline; }
menuentry "Chimera II OS — Reboot" { reboot; }
menuentry "Chimera II OS — Power Off" { halt; }
