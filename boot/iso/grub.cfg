insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu
insmod normal
insmod search
insmod search_fs_file
insmod multiboot2
insmod chain
insmod configfile
insmod reboot
insmod halt
insmod echo
set gfxmode=auto
set gfxpayload=keep
set timeout=8
set default=0
if [ -f /boot/grub/aurora-wayland-glass.png ]; then
  background_image /boot/grub/aurora-wayland-glass.png
fi
search --file --set=chimera_root /boot/kernel.bin

function chimera_boot {
  if [ -f /boot/kernel.bin ]; then
    multiboot2 /boot/kernel.bin $*
    boot
  else
    echo "Koronos kernel payload is missing from this ISO."
    sleep 5
  fi
}

menuentry "Chimera II OS — Aurora Wayland Glass" --id aurora {
  chimera_boot chm.mode=desktop chm.desktop=aurora chm.cpu=auto chm.compat=auto
}
menuentry "Chimera II OS — Koronos Kernel" --id koronos {
  chimera_boot chm.mode=koronos chm.parallel=auto chm.cpu=auto
}
menuentry "Chimera II OS — Safe Graphics" --id safe {
  chimera_boot chm.mode=safe-graphics chm.cpu=auto chm.compat=auto
}
menuentry "Chimera II OS — Installer — Aurora GUI" --id installer {
  chimera_boot chm.mode=installer chm.installer=gui
}
menuentry "Chimera II OS — Installer — Text / Serial" --id installer-cli {
  chimera_boot chm.mode=installer chm.installer=cli chm.console=serial
}
menuentry "Chimera II OS — Recovery / Jasper" --id jasper {
  configfile /boot/jasper/recovery.cfg
}
menuentry "Chimera II OS — Diagnostics" --id diagnostics {
  chimera_boot chm.mode=diagnostics chm.diagnostics=hardware
}
menuentry "Chimera II OS — Existing Windows EFI" --id windows {
  if [ -f /EFI/Microsoft/Boot/bootmgfw.efi ]; then
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    boot
  else
    echo "Windows EFI loader not found."
    sleep 3
  fi
}
menuentry "Chimera II OS — Firmware Setup (UEFI)" --id firmware { fwsetup }
menuentry "Chimera II OS — GRUB Command Line" { commandline }
menuentry "Chimera II OS — Reboot" { reboot }
menuentry "Chimera II OS — Power Off" { halt }

submenu "Chimera II OS — Boot Components" {
  menuentry "Koronos kernel stub / Multiboot2" { chimera_boot chm.mode=koronos chm.stub=1 }
  menuentry "Jasper recovery configuration" { configfile /boot/jasper/recovery.cfg }
  menuentry "Spit Fire BIOS artifact (inspect only)" {
    echo "Spit Fire native BIOS image: /boot/spitfire/spitfire-sf0-mbr.bin"
    echo "Linked stage2: /boot/spitfire/spitfire-stage2.bin"
    echo "The canonical ISO path is GRUB -> Multiboot2 -> Koronos."
    sleep 5
  }
}
