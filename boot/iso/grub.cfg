# Chimera II OS boot menu. All primary paths are self-contained so the
# ISO does not depend on secondary config files that were not staged.
insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod jpeg
insmod png
insmod font
insmod normal
insmod search
insmod search_fs_file
insmod multiboot2
insmod chain
insmod reboot
insmod halt
insmod echo
if [ "$grub_platform" = efi ]; then insmod efi_gop; insmod efifwsetup; fi
set gfxmode=auto,1920x1080,1600x900,1280x720,1024x768,800x600,640x480
set gfxpayload=keep
set terminal_output=gfxterm
terminal_output gfxterm
set timeout=8
set default=0

if [ -f /boot/visual/aurora-wayland-glass.jpg ]; then background_image --mode stretch /boot/visual/aurora-wayland-glass.jpg; fi

menuentry "Chimera II OS — Live Aurora / Koronos" --id aurora-live {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  if [ -f /system/hardware/chimera-hardware-profile.json ]; then module2 /system/hardware/chimera-hardware-profile.json chimera-hardware-profile; fi
  if [ -f /system/hardware/compatibility-modes.json ]; then module2 /system/hardware/compatibility-modes.json chimera-compatibility-modes; fi
  if [ -f /system/hardware/nbit-policy.conf ]; then module2 /system/hardware/nbit-policy.conf chimera-nbit-policy; fi
  boot
}

menuentry "Chimera II OS — Normal Boot" --id normal {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "Chimera II OS — Install / Installer Environment" --id install {
  echo "Starting the Chimera installer-capable Live environment..."
