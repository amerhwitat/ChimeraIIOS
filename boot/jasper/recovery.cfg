# Jasper recovery path — Koronos first, recovery payloads as Multiboot2 modules.
insmod gfxterm
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/visual/aurora-background.jpg ]; then background_image --mode stretch /boot/visual/aurora-background.jpg; elif [ -f /boot/jasper/background.png ]; then background_image --mode stretch /boot/jasper/background.png; fi
menuentry "Chimera II OS — Recovery / Koronos" --id recovery {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
  boot
}
menuentry "Return to Live Aurora" { configfile /boot/jasper/live.cfg }
