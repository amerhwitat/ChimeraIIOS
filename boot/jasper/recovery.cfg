# Jasper recovery path — dedicated Koronos recovery initramfs.
insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod normal
insmod gfxterm
insmod jpeg
insmod png
insmod font
insmod gfxmenu
insmod search
insmod multiboot2
set gfxmode=auto,1920x1080,1600x900,1280x720,1024x768,800x600,640x480
set gfxpayload=keep
terminal_output gfxterm
set timeout=5
set default=0
if [ -f /boot/grub/aurora-theme.txt ]; then set theme=/boot/grub/aurora-theme.txt; export theme; elif [ -f /boot/visual/aurora-menu.png ]; then background_image --mode stretch /boot/visual/aurora-menu.png; elif [ -f /boot/visual/aurora-boot.png ]; then background_image --mode stretch /boot/visual/aurora-boot.png; fi
menuentry "Chimera II OS — Recovery Terminal" --id recovery-terminal {
  echo "Starting Koronos recovery console..."
  echo "Commands: help status disks mount-root check-root repair-root verify rollback boot-normal"
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
  module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
  boot
}
menuentry "Chimera II OS — Recovery / Koronos (legacy)" --id recovery-koronos {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
  boot
}
menuentry "Chimera II OS — Safe Graphics Recovery" --id recovery-safe {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
  module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
  boot
}
menuentry "Chimera II OS — GRUB Command Line" --id recovery-grub { commandline }
menuentry "Return to Main Boot Menu" --id recovery-return { configfile /boot/grub/grub.cfg }
menuentry "Reboot" { reboot }
menuentry "Power Off" { halt }
