# Jasper diagnostics path — same Koronos kernel, diagnostics selected by payload.
insmod gfxterm
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/visual/aurora-wayland-glass.jpg ]; then background_image --mode stretch /boot/visual/aurora-wayland-glass.jpg; elif [ -f /boot/visual/aurora-background.jpg ]; then background_image --mode stretch /boot/visual/aurora-background.jpg; elif [ -f /boot/jasper/background.png ]; then background_image --mode stretch /boot/jasper/background.png; fi
menuentry "Chimera II OS — Hardware / Kernel Diagnostics" --id diagnostics {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/diagnostics/diagnostics-manifest.json chimera-diagnostics-manifest
  module2 /boot/visual/aurora-wayland-glass.jpg aurora-background
  boot
}
menuentry "Return to Live Aurora" { configfile /boot/jasper/live.cfg }
