# Jasper diagnostics path — same Koronos kernel, diagnostics selected by payload.
insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod jpeg
insmod png
insmod font
insmod normal
insmod gfxmenu
set gfxmode=auto,1920x1080,1600x900,1280x720,1024x768,800x600,640x480
set gfxpayload=keep
terminal_output gfxterm
if [ -f /boot/grub/aurora-theme.txt ]; then set theme=/boot/grub/aurora-theme.txt; export theme; elif [ -f /boot/visual/aurora-menu.png ]; then background_image --mode stretch /boot/visual/aurora-menu.png; elif [ -f /boot/visual/aurora-boot.png ]; then background_image --mode stretch /boot/visual/aurora-boot.png; fi
menuentry "Chimera II OS — Hardware / Kernel Diagnostics" --id diagnostics {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/diagnostics/diagnostics-manifest.json chimera-diagnostics-manifest
  module2 /boot/visual/aurora-diagnostics.png aurora-background
  boot
}
menuentry "Return to Live Aurora" { configfile /boot/jasper/live.cfg }
