# Jasper -> Koronos live handoff. No Linux vmlinuz is used.
menuentry "Chimera II OS — Aurora Live (Koronos)" --id aurora-live {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
}
menuentry "Chimera II OS — Safe Graphics (Koronos)" --id aurora-safe {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs safe-graphics
}
