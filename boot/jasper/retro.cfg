# Aurora Retro Center — Jasper selections hand off to the graphical Aurora
# session. Emulator processes are never started directly by GRUB/Jasper because
# the bootloader has no X11/Wayland window server. The selected id is carried
# in the Multiboot2 command line and consumed by aurora-session.sh.
insmod gfxterm
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/jasper/background.png ]; then background_image --mode stretch /boot/jasper/background.png; fi

menuentry "Retro — Sinclair ZX Spectrum (Z80)" --id retro-spectrum {
  set CHIMERA_EMULATOR_ID=retro-spectrum
  configfile /boot/jasper/live.cfg
}
menuentry "Retro — Atari ST (Motorola 68000)" --id retro-atari-st {
  set CHIMERA_EMULATOR_ID=retro-atari-st
  configfile /boot/jasper/live.cfg
}
menuentry "Retro — Amiga 68000/020/030/040" --id retro-amiga {
  set CHIMERA_EMULATOR_ID=retro-amiga
  configfile /boot/jasper/live.cfg
}
menuentry "Retro — Commodore C64/C128/PET/VIC-20" --id retro-commodore {
  set CHIMERA_EMULATOR_ID=retro-commodore
  configfile /boot/jasper/live.cfg
}
menuentry "Retro — Apple II / Macintosh" --id retro-apple {
  set CHIMERA_EMULATOR_ID=retro-apple
  configfile /boot/jasper/live.cfg
}
menuentry "Retro — Acorn BBC/Archimedes" --id retro-acorn {
  set CHIMERA_EMULATOR_ID=retro-acorn
  configfile /boot/jasper/live.cfg
}
menuentry "Retro — Amstrad CPC" --id retro-amstrad {
  set CHIMERA_EMULATOR_ID=retro-amstrad
  configfile /boot/jasper/live.cfg
}
menuentry "Retro — DOS/8086 through Pentium" --id retro-pc {
  set CHIMERA_EMULATOR_ID=retro-pc
  configfile /boot/jasper/live.cfg
}
menuentry "Retro — Arcade / Console Center" --id retro-arcade {
  set CHIMERA_EMULATOR_ID=retro-arcade
  configfile /boot/jasper/live.cfg
}
menuentry "Retro — Return to Jasper" { configfile /boot/jasper/jasper.cfg }
