# Aurora Retro Center — architecture-neutral compatibility menu.
# Emulator binaries are optional adapters. ROMs/firmware/media are supplied by
# the user; Chimera does not redistribute copyrighted ROMs or commercial media.
insmod gfxterm
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/jasper/background.png ]; then background_image --mode stretch /boot/jasper/background.png; fi

menuentry "Retro — Sinclair ZX Spectrum (Z80)" --id retro-spectrum {
  echo "ZX Spectrum adapter: Fuse/libretro/zx_go"
  echo "Supply legally obtained TAP/TZX/SNA/Z80/SZX media."
  sleep 5
}
menuentry "Retro — Atari ST (Motorola 68000)" --id retro-atari-st {
  echo "Atari ST adapter: Hatari/libretro"
  echo "Supply legally obtained TOS/media where required."
  sleep 5
}
menuentry "Retro — Amiga 68000/020/030/040" --id retro-amiga {
  echo "Amiga adapter: UAE/SAE/vAmiga"
  echo "Supply legally obtained Kickstart/media where required."
  sleep 5
}
menuentry "Retro — Commodore C64/C128/PET/VIC-20" --id retro-commodore {
  echo "Commodore adapter: VICE/libretro"
  sleep 5
}
menuentry "Retro — Apple II / Macintosh" --id retro-apple {
  echo "Apple adapter: MAME/libretro/Mini vMac"
  sleep 5
}
menuentry "Retro — Acorn BBC/Archimedes" --id retro-acorn {
  echo "Acorn adapter: MAME/RPCEmu"
  sleep 5
}
menuentry "Retro — Amstrad CPC" --id retro-amstrad {
  echo "Amstrad adapter: MAME/libretro"
  sleep 5
}
menuentry "Retro — DOS/8086 through Pentium" --id retro-pc {
  echo "PC adapter: QEMU/DOSBox"
  sleep 5
}
menuentry "Retro — Arcade / Console Center" --id retro-arcade {
  echo "Arcade/console adapter: MAME/libretro"
  sleep 5
}
menuentry "Retro — Return to Jasper" { configfile /boot/jasper/jasper.cfg }
