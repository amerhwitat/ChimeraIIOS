# Jasper Boot Manager — Chimera II OS
# Canonical high-level boot selection; GRUB/Spit Fire adapters consume the same IDs.
set timeout=8
set default=0
insmod gfxterm
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/visual/aurora-background.jpg ]; then background_image --mode stretch /boot/visual/aurora-background.jpg; elif [ -f /boot/jasper/background.png ]; then background_image --mode stretch /boot/jasper/background.png; fi
menuentry "Chimera II OS — Live Aurora / Koronos" --id chimera-live { configfile /boot/jasper/live.cfg }
menuentry "Chimera II OS — Install Chimera II OS" --id chimera-install { configfile /boot/jasper/install.cfg }
menuentry "Chimera II OS — Recovery" --id chimera-recovery { configfile /boot/jasper/recovery.cfg }
menuentry "Chimera II OS — Diagnostics" --id chimera-diagnostics { configfile /boot/jasper/diagnostics.cfg }
menuentry "Chimera II OS — Spit Fire Native Path" --id spitfire { configfile /boot/spitfire/spitfire-menu.cfg }
menuentry "Chimera II OS — Retro Computer Center" --id retro { configfile /boot/jasper/retro.cfg }
menuentry "Chimera II OS — Firmware Setup" --id firmware { fwsetup }
menuentry "Reboot" { reboot }
menuentry "Power Off" { halt }
