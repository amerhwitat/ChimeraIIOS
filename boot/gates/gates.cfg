# Gates firmware menu — invoked by Jasper or the top-level GRUB menu.
# This is a firmware handoff menu, not a claim that GRUB can enumerate every
# firmware-specific boot option or edit NVRAM on every platform.
insmod gfxterm
insmod chain
insmod search
insmod part_gpt
insmod fat
set gfxpayload=keep
terminal_output gfxterm
set timeout=5
set default=0

menuentry "Gates — UEFI Firmware Setup" --id gates-uefi-setup {
  if [ "$grub_platform" = efi ]; then
    fwsetup
  else
    echo "UEFI firmware setup is unavailable in legacy BIOS mode."
    echo "Use the machine's firmware hotkey during power-on."
    read
  fi
}

menuentry "Gates — Windows Boot Manager (if present)" --id gates-windows {
  if [ "$grub_platform" = efi ]; then
    if [ -f /EFI/Microsoft/Boot/bootmgfw.efi ]; then
      chainloader /EFI/Microsoft/Boot/bootmgfw.efi
      boot
    else
      echo "Windows Boot Manager was not found on the current boot volume."
      read
    fi
  else
    echo "Windows UEFI chainloading is not available from this BIOS menu."
    read
  fi
}

menuentry "Gates — Linux EFI Loader (if present)" --id gates-linux {
  if [ "$grub_platform" = efi ]; then
    if [ -f /EFI/linux/grubx64.efi ]; then
      chainloader /EFI/linux/grubx64.efi
      boot
    else
      echo "Linux EFI loader was not found at /EFI/linux/grubx64.efi."
      read
    fi
  else
    echo "Linux EFI chainloading is not available from this BIOS menu."
    read
  fi
}

menuentry "Gates — GRUB Device and Filesystem Inventory" --id gates-inventory {
  echo "Firmware: $grub_platform"
  echo "GRUB devices:"
  ls
  echo "Known boot files on the current volume:"
  ls /EFI
  ls /boot
  read
}

menuentry "Return to Jasper Boot Manager" --id gates-return {
  configfile /boot/jasper/jasper.cfg
}
