# Gates policy menu — the explicit bridge between Spit Fire and Jasper.
insmod normal
insmod gfxterm
insmod jpeg
insmod png
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set timeout=5
set default=0
terminal_output gfxterm
if [ -f /boot/grub/background.jpg ]; then background_image --mode stretch /boot/grub/background.jpg; elif [ -f /boot/visual/aurora-wayland-glass.jpg ]; then background_image --mode stretch /boot/visual/aurora-wayland-glass.jpg; fi
echo "[GATES] Policy menu loaded; target readiness is verified only by the selected runtime."
menuentry "Gates — Continue to Jasper target menu" --id gates-to-jasper {
  configfile /boot/jasper/live-image.cfg
}
menuentry "Gates — Return to Spit Fire menu" --id gates-to-spitfire {
  configfile /boot/spitfire/spitfire-menu.cfg
}
menuentry "Gates — UEFI firmware setup" --id gates-firmware {
  if [ "${grub_platform}" = efi ]; then fwsetup; else echo "UEFI setup unavailable in BIOS mode."; sleep 5; fi
}
menuentry "Gates — GRUB 2 command line" { commandline; }
menuentry "Gates — Boot diagnostics" { echo "platform=${grub_platform} root=${root} cmdpath=${cmdpath} gfxmode=${gfxmode}"; ls /boot; ls /live; sleep 12; }
menuentry "Reboot" { reboot; }
menuentry "Power Off" { halt; }
