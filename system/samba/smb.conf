[global]
   workgroup = CHIMERA
   server role = standalone server
   security = user
   server min protocol = SMB2_10
   server signing = mandatory
   smb encrypt = desired
   map to guest = Never
   restrict anonymous = 2
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   disable spoolss = yes
   usershare allow guests = no
   server string = Chimera II OS SMB Service
   log file = /var/log/samba/log.%m
   max log size = 1000

# Add explicitly authorized shares here. No writable share is enabled by default.
