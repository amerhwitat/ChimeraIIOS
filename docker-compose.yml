services:
  chimera-gui:
    build: .
    image: amerhwitat/chimeraiios:gui
    container_name: chimeraiios-gui
    init: true
    privileged: true
    ports: ["8000:8000"]
    volumes:
      - .:/app
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev:/host/dev:ro
    environment: {CHIMERA_GUI: "1", CHIMERA_HOST_OS: "auto"}
    restart: unless-stopped
