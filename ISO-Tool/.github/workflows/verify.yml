name: ISO-Tool verification
on:
  push:
    paths: ['ISO-Tool/**']
  pull_request:
    paths: ['ISO-Tool/**']
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Test ISO-Tool Python implementation
        working-directory: ISO-Tool/python
        run: python -m pytest -q
