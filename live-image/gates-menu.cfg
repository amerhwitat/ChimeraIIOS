# Gates policy/menu layer between the Spit Fire front menu and Jasper.
# This is a GRUB2 configuration menu, not a separate firmware loader.
insmod all_video
insmod gfxterm
insmod jpeg
insmod png
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set debug=all
terminal_output gfxterm
if [ -f /boot/grub/background.jpg ]; then background_image --mode stretch /boot/grub/background.jpg; fi
set timeout=8
set default=0
echo "[GATES] Boot policy layer ready; target execution is delegated to Jasper."
if [ -s /boot/spitfire/Init.mp4 ]; then echo "[GATES] Init.mp4 staged; playback begins after Linux/Openbox handoff."; fi
menuentry "Gates — Continue to Jasper / GRUB 2 target manager" --id gates-to-jasper {
  configfile /boot/jasper/live-image.cfg
}
menuentry "Gates — Boot diagnostics" --id gates-diagnostics {
  echo "[GATES] platform=${grub_platform} cmdpath=${cmdpath} root=${root} gfxmode=${gfxmode}"
  ls; ls /boot; ls /boot/candidates; ls /live; sleep 15
}
menuentry "Gates — Return to Spit Fire menu" --id gates-to-spitfire {
  configfile /boot/spitfire/spitfire-menu.cfg
}
menuentry "Gates — UEFI firmware setup" --id gates-firmware {
  if [ "${grub_platform}" = efi ]; then fwsetup; else echo "Firmware setup is available only in UEFI mode."; sleep 5; fi
}
menuentry "GRUB 2 command line" --id gates-shell { commandline; }
menuentry "Reboot" --id gates-reboot { reboot; }
menuentry "Power off" --id gates-poweroff { halt; }
